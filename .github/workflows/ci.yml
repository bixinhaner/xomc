name: CI

# 整改 Wave 1.1 落地（2026-04-27 起生效）
# 配套：docs/methodology/AI承诺对峙清单.md 承诺 W1.1
# 渐进 ratchet 计划：
#   启动日   (2026-04-27): 后端 build+vet, 前端 typecheck（gentle gate）
#   启动+3d  (2026-04-30): + 前端 lint
#   启动+5d  (2026-05-02): + go test (含 postgres + redis services)
#   启动+7d  (2026-05-04): + golangci-lint, + 前端 vitest
#   启动+14d (2026-05-11): 全部检查阻塞 merge（W1 末退出标准）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # migration-lint：strict 模式只拦"会让 goose / app 启动 panic"的硬错
  #   · 同目录内重复 version_id（典型事故：2026-05-26 b00bd33a vs 7b8bb3b9 撞 191）
  #   · 缺 goose Up / Down 标记
  # 历史包袱（编号 gap / 命名不规范 / 跨目录同号）只 warn 不 fail，由 release-gate
  # 或本地 ./check-migrations.sh（无 --strict）集中清理。
  # ─────────────────────────────────────────────────────────────
  migration-lint:
    name: Migrations · strict lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Lint migration files (strict — 仅同目录撞号 + 缺 goose 标记报错)
        run: bash omcgo/scripts/check-migrations.sh --strict

  # ─────────────────────────────────────────────────────────────
  # migration-changes：路径过滤门（仅 PR）。只有改了 omcgo/migrations/** 才放行
  #   下面的 real-run（起 timescaledb + 真跑全套），非迁移 PR 省掉起库/迁移开销。
  # ─────────────────────────────────────────────────────────────
  migration-changes:
    name: Migrations · detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect migration changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'omcgo/migrations/**'

  # ─────────────────────────────────────────────────────────────
  # migration-realrun：全新 timescaledb 库真跑 schema + seed 迁移，拦截
  #   「旧 seed × 新 schema」不兼容（删/改列、NOT NULL、CHECK、FK 等——静态
  #   migration-lint 抓不到）。仅 PR + 改了 migrations/** 时跑（path 过滤）。
  #
  # 注：本 job 在「未改迁移的 PR」会被 if 跳过（conclusion=skipped）。若设为
  #   required check，GitHub 把 if 跳过的 job 视作通过（不阻塞）；真正会卡 pending
  #   的只有「workflow 级 on.paths 跳过」——本处用 job 级过滤刻意规避。
  # ─────────────────────────────────────────────────────────────
  migration-realrun:
    name: Migrations · real run (fresh DB schema + seed)
    needs: migration-changes
    if: github.event_name == 'pull_request' && needs.migration-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # 必须带 timescaledb：000001_init_schema CREATE EXTENSION timescaledb + create_hypertable
        image: timescale/timescaledb:2.25.2-pg16
        env:
          POSTGRES_USER: omcgo
          POSTGRES_PASSWORD: omcgo123
          POSTGRES_DB: omcgo_seedcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omcgo -d omcgo_seedcheck"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DSN: postgres://omcgo:omcgo123@localhost:5432/omcgo_seedcheck?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go 1.25.11
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
      - name: Build migrate tool
        working-directory: omcgo
        run: go build -o /tmp/omcgo-migrate ./cmd/migrate
      - name: Apply schema migrations (fresh DB)
        working-directory: omcgo
        run: /tmp/omcgo-migrate --dsn "$DSN" --path ./migrations up
      - name: Apply seed migrations (catches 旧 seed × 新 schema)
        working-directory: omcgo
        run: /tmp/omcgo-migrate --dsn "$DSN" --table goose_db_version_seed --path ./migrations/seed up

  backend-build:
    name: Backend · build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go 1.25.11
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache-dependency-path: omcgo/go.sum

      - name: go vet
        working-directory: omcgo
        run: go vet ./...

      - name: go build (all packages)
        working-directory: omcgo
        run: go build ./...

  frontend-typecheck:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: omcmb/webcode/package-lock.json

      - name: Install dependencies
        working-directory: omcmb/webcode
        run: npm ci

      - name: TypeScript check
        working-directory: omcmb/webcode
        run: npm run typecheck

  # ============================================================
  # 安全扫描（W3.G.1 / T-0062）— 2026-04-28 起生效
  # 配套：docs/security/scan-baseline-2026-04-28.md
  # 三 jobs 并行；high/critical 阻塞 merge（exit code != 0 → CI fail）
  # 工具版本 pin 至明确 tag，避免上游升级破坏。
  # ============================================================

  security-gosec:
    name: Security · gosec (Go SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go 1.25.11
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache-dependency-path: omcgo/go.sum

      - name: Install gosec v2.21.4
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4

      - name: Run gosec
        working-directory: omcgo
        # -severity high: 仅 high/critical 失败；medium/low 在 baseline 治理
        # -confidence medium: 滤掉低置信度噪声
        # -exclude-dir: 跳过测试夹具与生成代码
        # -exclude=G115,G118,G404: baseline 治理项
        #   G115 (整型溢出转换 ×129) — 全部 PG repository 分页 cast，业务路径已校验，待 R-310 专项修
        #   G118 (goroutine context.Background ×13) — 部分守护型 goroutine 设计意图，待 R-311 逐点 review
        #   G404 (math/rand ×9) — 全部非加密用途（cwmpID 计数 / UDP jitter / 压测），待 R-312 迁 math/rand/v2
        # 详见 docs/security/scan-baseline-2026-04-28.md §3
        run: gosec -severity high -confidence medium -exclude-dir=test/fixtures -exclude=G115,G118,G404 ./...

  security-govulncheck:
    name: Security · govulncheck (Go vuln DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go 1.25.11
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache-dependency-path: omcgo/go.sum

      - name: Install govulncheck v1.1.4
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        working-directory: omcgo
        run: govulncheck ./...

  security-npm-audit:
    name: Security · npm audit (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: omcmb/webcode/package-lock.json

      - name: Install dependencies
        working-directory: omcmb/webcode
        run: npm ci

      - name: npm audit (high/critical only)
        working-directory: omcmb/webcode
        # --audit-level=high → 只看 high/critical；moderate/low 在 baseline 治理
        # --omit=dev → 生产依赖才阻塞 merge；devDeps 漏洞不进入产物
        run: npm audit --audit-level=high --omit=dev

  # ============================================================
  # 容器镜像层安全扫描 + SBOM（Epic #27 / issue #66）— 2026-06-10 起生效
  # 此前三件套（gosec/govulncheck/npm-audit）只覆盖语言依赖，放过最终镜像里
  # 的 OS 包与 nginx/node runtime CVE，存在"源码全绿但镜像带 OS CVE 出厂"盲区。
  # 本 job 对四个构建产物镜像扫 OS+lib 层（HIGH/CRITICAL 阻塞）并产出 CycloneDX SBOM。
  # 构建上下文 = 仓库根（与 docker-compose 一致）；APK_MIRROR/GOPROXY 切回境外源以适配 runner。
  # ============================================================

  security-image-scan:
    name: Security · 镜像扫描 + SBOM (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: omcgo-app
            dockerfile: deployments/docker/Dockerfile.app
          - image: omcgo-acs
            dockerfile: deployments/docker/Dockerfile.acs
          - image: omcgo-worker
            dockerfile: deployments/docker/Dockerfile.worker
          - image: omcgo-web
            dockerfile: deployments/docker/Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:scan
          load: true
          # runner 在境外：切回官方 apk 源 + 境外 goproxy，避免国内镜像不可达
          build-args: |
            APK_MIRROR=dl-cdn.alpinelinux.org
            GOPROXY=https://proxy.golang.org,direct

      - name: Trivy 漏洞扫描（HIGH/CRITICAL 阻塞）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: 生成 CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json

      - name: 归档 SBOM 产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 30

  # ============================================================
  # 以下 Job 在 ratchet 时间点启用，先以 continue-on-error 试运行
  # 取消注释 + 删除 continue-on-error 即从"宽容"转为"阻塞"
