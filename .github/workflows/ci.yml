name: CI

# 整改 Wave 1.1 落地（2026-04-27 起生效）
# 配套：docs/methodology/AI承诺对峙清单.md 承诺 W1.1
# 渐进 ratchet 计划：
#   启动日   (2026-04-27): 后端 build+vet, 前端 typecheck（gentle gate）
#   启动+3d  (2026-04-30): + 前端 lint
#   启动+5d  (2026-05-02): + go test (含 postgres + redis services)
#   启动+7d  (2026-05-04): + golangci-lint, + 前端 vitest
#   启动+14d (2026-05-11): 全部检查阻塞 merge（W1 末退出标准）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend · build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: omcgo/go.sum

      - name: go vet
        working-directory: omcgo
        run: go vet ./...

      - name: go build (all packages)
        working-directory: omcgo
        run: go build ./...

  frontend-typecheck:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: omcmb/webcode/package-lock.json

      - name: Install dependencies
        working-directory: omcmb/webcode
        run: npm ci

      - name: TypeScript check
        working-directory: omcmb/webcode
        run: npm run typecheck

