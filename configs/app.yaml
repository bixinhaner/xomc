server:
  host: "0.0.0.0"
  port: 8080
  tls_port: 8443
  grpc_port: 50051
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

db:
  dsn: "postgres://omcgo:password@localhost:5432/omcgo?sslmode=disable"
  max_conns: 50
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

tsdb:
  dsn: "postgres://omcgo:password@localhost:5432/omcgo?sslmode=disable"
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

redis:
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 200

nats:
  url: "nats://localhost:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"

jwt:
  secret: "change-me-in-production-minimum-32-characters!!"
  access_token_ttl: 30m
  refresh_token_ttl: 168h

northbound:
  push_targets: []

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

metrics:
  port: 9091

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
