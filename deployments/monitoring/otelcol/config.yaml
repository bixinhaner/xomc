# OpenTelemetry Collector — OMC Phase 1 + 2b
#
# 数据流：
#   ─── Traces（Phase 1）───────────────────────────────────────────
#   app/acs/worker (OTLP gRPC) → otelcol :4317 → batch → tempo :4317
#
#   ─── Metrics（Phase 2b：替换 pg/redis exporter）─────────────────
#   postgres :5432 (内置协议) → otelcol postgresqlreceiver
#   redis-core / redis-pm     → otelcol redisreceiver ×2    ┐
#                                                            ├→ metricstransform (重命名)
#                                                            │  pg_* / redis_* 保兼容
#                                                            ↓
#                                                  prometheusremotewrite
#                                                            ↓
#                                                  prometheus :9090/api/v1/write
#
# 仅 pg/redis 指标走 otelcol 中转；app/acs/worker /metrics、nats-exporter、
# minio /metrics 仍由 Prometheus 直接 pull（无变动）。
#
# 部署模式：单进程（dev/test/prod 通用）。100 万规模时拆 agent + gateway 两层。
# 详见 docs/design/observability-otelcol-migration-plan-20260520.md §5 §7 D3。

receivers:
  # ─── Traces ───────────────────────────────────────────────────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      # http endpoint 暂不开启——本期所有上报方都是 Go SDK，gRPC 优于 HTTP

  # ─── Metrics: PostgreSQL ──────────────────────────────────────────
  # 直连 PG 内置协议；scrape 间隔 30s 与 Prometheus global 对齐
  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: omcgo
    password: ${env:POSTGRES_PASSWORD}
    databases: [omcgo]
    collection_interval: 30s
    tls:
      insecure: true
    metrics:
      # 显式打开默认关闭的扩展指标（0.103 receiver schema）
      postgresql.database.locks:
        enabled: true
      postgresql.deadlocks:
        enabled: true
      postgresql.sequential_scans:
        enabled: true
      postgresql.wal.age:
        enabled: true
      postgresql.wal.lag:
        enabled: true
      postgresql.wal.delay:
        enabled: true
      # 关掉 index 维度指标——postgresqlreceiver 0.103 的已知问题：
      # 多个表共享相同 index 名（如 `pkey`、`*_pkey`）时只用 index 名做
      # 标签会触发 Prometheus "duplicate sample for timestamp"。本期用不
      # 上 index 维度，关闭可避免每个 scrape 1700 次重复点全 batch 被拒。
      postgresql.index.size:
        enabled: false
      postgresql.index.scans:
        enabled: false

  # ─── Metrics: PostgreSQL（时序库实例 postgres-tsdb / TsPool）────────
  # KPI/时序库物理分离后第二个 PG 实例。指标名与主库 receiver 完全相同
  # （pg_* 别名），若不加区分 label 会与主库的同 series 碰撞成 Prometheus
  # "duplicate sample for timestamp"（HTTP 400）。本 receiver 走独立的
  # metrics/tsdb pipeline，由 resource/metrics_tsdb 打 instance=postgres-tsdb
  # 区分（主库由 resource/metrics 打 instance=postgres）。
  postgresql/tsdb:
    endpoint: postgres-tsdb:5432
    transport: tcp
    username: omcgo
    password: ${env:POSTGRES_TSDB_PASSWORD}
    databases: [omcgo]
    collection_interval: 30s
    tls:
      insecure: true
    metrics:
      postgresql.database.locks:
        enabled: true
      postgresql.deadlocks:
        enabled: true
      postgresql.sequential_scans:
        enabled: true
      postgresql.wal.age:
        enabled: true
      postgresql.wal.lag:
        enabled: true
      postgresql.wal.delay:
        enabled: true
      postgresql.index.size:
        enabled: false
      postgresql.index.scans:
        enabled: false

  # TSDB 专项 SQL 指标：累计临时写入量/文件数，以及持续超过 5 秒的活跃查询。
  # 属性只保留 database，避免 query text / pid 等高基数标签进入 Prometheus。
  sqlquery/tsdb:
    driver: postgres
    datasource: "host=postgres-tsdb port=5432 user=omcgo password=${env:POSTGRES_TSDB_PASSWORD} dbname=omcgo sslmode=disable"
    collection_interval: 30s
    queries:
      - sql: |
          SELECT datname AS database,
                 temp_bytes::bigint AS temp_bytes,
                 temp_files::bigint AS temp_files
          FROM pg_stat_database
          WHERE datname = current_database()
        metrics:
          - metric_name: pg_stat_database_temp_bytes
            value_column: temp_bytes
            attribute_columns: [database]
            value_type: int
            monotonic: true
            aggregation: cumulative
          - metric_name: pg_stat_database_temp_files
            value_column: temp_files
            attribute_columns: [database]
            value_type: int
            monotonic: true
            aggregation: cumulative
      - sql: |
          SELECT current_database() AS database,
                 count(*)::bigint AS active_long_queries
          FROM pg_stat_activity
          WHERE state = 'active'
            AND pid <> pg_backend_pid()
            AND query_start < now() - interval '5 seconds'
        metrics:
          - metric_name: pg_active_long_queries
            value_column: active_long_queries
            attribute_columns: [database]
            value_type: int

  # ─── Metrics: Redis Core / PM ─────────────────────────────────────
  redis/core:
    endpoint: redis-core:6379
    collection_interval: 30s
    tls:
      insecure: true

  redis/pm:
    endpoint: redis-pm:6379
    collection_interval: 30s
    tls:
      insecure: true
    # redisreceiver 默认全开主要 INFO 段，无需显式 enable

  # ─── Logs: filelog（Phase 3 — 替换 Promtail）──────────────────────
  # 数据流：tail /run/logs/{app,acs,worker}/*.log（lumberjack 轮转后旧 *.log.gz
  # 跳过）→ zap JSON 解析 → 提 timestamp / level / service / trace_id →
  # loki exporter 推 :3100/loki/api/v1/push
  filelog/app:
    include: [/run/logs/app/app.log]
    exclude: [/run/logs/app/*.log.gz, "/run/logs/app/*.log.[0-9]*"]
    start_at: end                # 启动时从尾部开始，避免回灌历史
    include_file_name: false
    include_file_path: false
    # storage: file_storage      # 暂不开（需 extension 加 file_storage），重启
                                  # 时丢一小段 read offset 在 dev 可接受
    operators:
      - type: json_parser        # zap JSON 行 → 字段
        timestamp:
          parse_from: attributes.timestamp
          # zap 默认 ISO8601 with timezone offset
          layout: '2006-01-02T15:04:05.999-0700'
          layout_type: gotime
        severity:
          parse_from: attributes.level
      - type: add
        field: resource["service.name"]
        value: omcgo-app
      - type: add
        field: resource["deployment_unit"]
        value: app

  filelog/acs-primary:
    include: [/run/logs/acs/acs.log]
    exclude: [/run/logs/acs/*.log.gz, "/run/logs/acs/*.log.[0-9]*"]
    start_at: end
    include_file_name: false
    include_file_path: false
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout: '2006-01-02T15:04:05.999-0700'
          layout_type: gotime
        severity:
          parse_from: attributes.level
      - type: add
        field: resource["service.name"]
        value: omcgo-acs
      - type: add
        field: resource["deployment_unit"]
        value: acs
      - type: add
        field: resource["instance"]
        value: primary
      - type: add
        field: resource["loki.resource.labels"]
        value: service.name,deployment_unit,instance

  filelog/acs-candidate:
    include: [/run/logs/acs-candidate/acs.log]
    exclude: [/run/logs/acs-candidate/*.log.gz, "/run/logs/acs-candidate/*.log.[0-9]*"]
    start_at: end
    include_file_name: false
    include_file_path: false
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout: '2006-01-02T15:04:05.999-0700'
          layout_type: gotime
        severity:
          parse_from: attributes.level
      - type: add
        field: resource["service.name"]
        value: omcgo-acs
      - type: add
        field: resource["deployment_unit"]
        value: acs
      - type: add
        field: resource["instance"]
        value: candidate
      - type: add
        field: resource["loki.resource.labels"]
        value: service.name,deployment_unit,instance

  filelog/worker:
    include: [/run/logs/worker/worker.log]
    exclude: [/run/logs/worker/*.log.gz, "/run/logs/worker/*.log.[0-9]*"]
    start_at: end
    include_file_name: false
    include_file_path: false
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout: '2006-01-02T15:04:05.999-0700'
          layout_type: gotime
        severity:
          parse_from: attributes.level
      - type: add
        field: resource["service.name"]
        value: omcgo-worker
      - type: add
        field: resource["deployment_unit"]
        value: worker

  filelog/nginx:
    include:
      - /run/logs/nginx/*access.log
      - /run/logs/nginx/*error.log
    exclude:
      - /run/logs/nginx/*.log.gz
      - "/run/logs/nginx/*.log.[0-9]*"
    start_at: end
    include_file_name: false
    include_file_path: false
    operators:
      # nginx 行非结构化，按整行原样保留，仅打 label
      - type: add
        field: resource["service.name"]
        value: nginx
      - type: add
        field: resource["log_type"]
        # log_type 由 promtail 旧配置区分 access/error；本期暂未拆，调用方
        # 用 LogQL `|= "GET"` 之类二次过滤即可。下次迭代再加 file_path
        # operator 按文件名分流。
        value: nginx

processors:
  # batch：合并下游推送，减少 Prometheus 写入压力
  batch:
    send_batch_size: 1024
    timeout: 5s
    send_batch_max_size: 2048

  # memory_limiter：otelcol 自我保护，防止 OOM 拖垮宿主
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  # resource：补 cluster + service.name label
  # cluster 与 Prometheus external_labels.cluster 对齐
  resource/traces:
    attributes:
      - key: cluster
        value: omcgo-dev
        action: upsert

  # metrics 流加 service / cluster label，与原 exporter 标签对齐。
  resource/metrics:
    attributes:
      - key: cluster
        value: omcgo-dev
        action: upsert

  # transform/pg_instance_main：给主库 postgres 的 pg_* 指标补 DATAPOINT
  # 属性 instance=postgres。必须设在 datapoint 维度而非 resource —— 因为
  # prometheusremotewrite 默认只把 semconv 标准 resource attrs 转 label，
  # 其余 resource attrs 全丢（同 transform/promote_pg_resource 的处理）；
  # datapoint attribute 则会被无条件转成 label。
  transform/pg_instance_main:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["instance"], "postgres")

  # transform/pg_instance_tsdb：给时序库 postgres-tsdb 的 pg_* 指标补
  # DATAPOINT 属性 instance=postgres-tsdb，与主库区分防 "duplicate sample
  # for timestamp"（两实例同名 series 碰撞 → Prometheus HTTP 400）。
  transform/pg_instance_tsdb:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["instance"], "postgres-tsdb")

  transform/redis_instance_core:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["instance"], "redis-core")

  transform/redis_instance_pm:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["instance"], "redis-pm")

  # transform/promote_resource：把 receiver 设置在 RESOURCE 维度的 PG 维度
  # 属性（database / table / index）下沉为 DATAPOINT 属性。
  # 原因：prometheusremotewriteexporter 默认只把 service.name /
  # service.instance.id 等 semconv 标准 resource attrs 转 Prom label，其他
  # OTel-native attrs 全部丢弃。这会让 100 个表的 `postgresql.table.size`
  # 因为没 table 标签全部 collide 成同一 series → "duplicate sample for
  # timestamp" 整批被 Prom 拒。下沉为 datapoint attribute 后，转换器会
  # 无条件转成 label，碰撞消失。
  transform/promote_pg_resource:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["database"], resource.attributes["postgresql.database.name"]) where resource.attributes["postgresql.database.name"] != nil
          - set(attributes["table"], resource.attributes["postgresql.table.name"]) where resource.attributes["postgresql.table.name"] != nil
          - set(attributes["index"], resource.attributes["postgresql.index.name"]) where resource.attributes["postgresql.index.name"] != nil

  # metricstransform：把 OTel semconv 命名重命名为旧 exporter 名字，
  # 让现有告警 / Grafana 面板零修改延续使用。
  #
  # 规则：UPDATE 覆盖（替换名字，不保留 OTel 原名）。曾试过 INSERT 保留双名，
  # 但 prometheusremotewrite 会因 resource attrs 差异以同 timestamp 写出
  # "duplicate sample" 被 Prom 拒绝（HTTP 400）。UPDATE 单名干净无冲突。
  # 未来若 dashboard 要用 OTel 原名再调整为 INSERT 并补 add_label 解冲突。
  metricstransform:
    transforms:
      # ─── PostgreSQL 别名 ──────────────────────────────────────────
      - include: postgresql.backends
        action: update
        new_name: pg_stat_database_numbackends
      - include: postgresql.connection.max
        action: update
        new_name: pg_settings_max_connections
      - include: postgresql.db_size
        action: update
        new_name: pg_database_size_bytes
      - include: postgresql.commits
        action: update
        new_name: pg_stat_database_xact_commit
      - include: postgresql.rollbacks
        action: update
        new_name: pg_stat_database_xact_rollback
      - include: postgresql.deadlocks
        action: update
        new_name: pg_stat_database_deadlocks

      # ─── Redis 别名 ───────────────────────────────────────────────
      - include: redis.memory.used
        action: update
        new_name: redis_memory_used_bytes
      - include: redis.memory.maxmemory
        action: update
        new_name: redis_memory_max_bytes
      - include: redis.uptime
        action: update
        new_name: redis_uptime_in_seconds
      - include: redis.clients.connected
        action: update
        new_name: redis_connected_clients
      - include: redis.commands.processed
        action: update
        new_name: redis_commands_processed_total
      - include: redis.keyspace.hits
        action: update
        new_name: redis_keyspace_hits_total
      - include: redis.keyspace.misses
        action: update
        new_name: redis_keyspace_misses_total

exporters:
  # ─── Traces 出口：Tempo ───────────────────────────────────────────
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

  # ─── Metrics 出口：Prometheus Remote Write ────────────────────────
  # Prometheus 需启用 --web.enable-remote-write-receiver flag 来接受
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    # 关闭 unit suffix 自动添加（保持指标名与 alert 表达式精确一致）
    # 否则 `postgresql_backends` 会变成 `postgresql_backends_total` 之类
    add_metric_suffixes: false
    # 关闭 target_info / scope_info 元数据 metric——otelcol 默认会为每个
    # resource 生成 `target_info{...}` 用来回查 resource 属性，但 pg/redis
    # receiver 各 scrape 产生的 target_info labels 集合一致，会被 Prometheus
    # 判定为同 timestamp 重复样本（HTTP 400 duplicate sample）。
    target_info:
      enabled: false
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    # external_labels：给所有 remote_write 的指标补充 job 标签，模拟原
    # Prometheus scrape job 语义，让告警按 job 维度过滤仍可工作
    external_labels:
      job: otelcol

  # debug：紧急调试用；平时不挂 pipeline
  debug:
    verbosity: basic

  # ─── Logs 出口：Loki ──────────────────────────────────────────────
  # 替换原 promtail → loki 链路；otelcol 直接 push Loki HTTP API。
  #
  # cardinality 死穴：禁止把 request_id / trace_id 这类高基数字段提为 label，
  # 它们留在 log body 让 Loki 用 LogQL `| json | trace_id="..."` 过滤。
  # 由 filelog operators 设的 resource["service.name"] 自动转为 Loki label
  # `service_name`（lokiexporter 默认行为）；保留 default_labels_enabled
  # 全开因为 Loki API 要求每 stream 至少 1 个 label。
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource/traces]
      exporters: [otlp/tempo]

    # 两个 Redis 分管道补 instance 标签，防同名序列碰撞并支持分别告警。
    metrics/redis-core:
      receivers: [redis/core]
      processors: [memory_limiter, transform/redis_instance_core, metricstransform, resource/metrics, batch]
      exporters: [prometheusremotewrite]

    metrics/redis-pm:
      receivers: [redis/pm]
      processors: [memory_limiter, transform/redis_instance_pm, metricstransform, resource/metrics, batch]
      exporters: [prometheusremotewrite]

    # 主库 postgres 指标：promote pg resource → datapoint，补 instance=postgres。
    metrics/pg:
      receivers: [postgresql]
      processors: [memory_limiter, transform/promote_pg_resource, transform/pg_instance_main, metricstransform, resource/metrics, batch]
      exporters: [prometheusremotewrite]

    # 时序库 postgres-tsdb 指标：同主库管道但 instance=postgres-tsdb 区分，
    # 防两实例同名 series 碰撞（duplicate sample for timestamp）。
    metrics/tsdb:
      receivers: [postgresql/tsdb, sqlquery/tsdb]
      processors: [memory_limiter, transform/promote_pg_resource, transform/pg_instance_tsdb, metricstransform, resource/metrics, batch]
      exporters: [prometheusremotewrite]

    # Logs pipeline（Phase 3 — Promtail 下线后由本管道承担）
    logs:
      receivers: [filelog/app, filelog/acs-primary, filelog/acs-candidate, filelog/worker, filelog/nginx]
      processors: [memory_limiter, batch]
      exporters: [loki]

  telemetry:
    metrics:
      level: basic
      address: 0.0.0.0:8888
    logs:
      level: info
      encoding: json
