# OMC 基础服务告警规则（T-0151 + T-0155 Phase 2b 改造）
#
# 覆盖 postgres / redis / nats / minio。
#
# T-0155 Phase 2b 后，pg / redis 由 otelcol postgresqlreceiver / redisreceiver
# 直连数据库采集，再 prometheusremotewrite 推到 Prometheus（job="otelcol"）。
# nats / minio 仍走 Prometheus 直接 scrape。
#
# 信号说明：
#   - up{job="..."} == 0 仅对 Prometheus 自己 scrape 的 target 合成。
#     P2b 后 pg/redis 走 remote_write 没有合成 up，所以 InfraExporterDown
#     收窄到 nats / minio / otelcol 三个仍 scrape 的 target。
#   - pg / redis 用 absent_over_time(关键指标[2m]) 判断"指标流断开"等价
#     于"数据库连不上"。比原 boolean gauge `pg_up`/`redis_up` 多 30-90s 的
#     检测延迟（取决于 scrape interval + for 持续时间），可接受。
#   - PostgresConnectionsHigh / RedisMemoryHigh 用 metricstransform 别名
#     `pg_stat_database_numbackends` / `pg_settings_max_connections` /
#     `redis_memory_used_bytes` / `redis_memory_max_bytes`，表达式与旧版完全一致。

groups:
  - name: omc.infra_liveness
    interval: 30s
    rules:
      - alert: InfraExporterDown
        # P2b 后只剩 nats / minio / otelcol 三个 scrape target；pg / redis 见
        # PostgresMetricsAbsent / RedisMetricsAbsent
        expr: up{job=~"nats|minio|otelcol"} == 0
        for: 2m
        labels:
          severity: critical
          domain: omc
        annotations:
          summary: "基础服务监控目标 {{ $labels.job }} 不可达"
          description: |
            job={{ $labels.job }} 的 scrape 目标已 2 分钟无法抓取。
            可能是 exporter / otelcol 容器退出，或被监控的基础服务本身已宕。
            Impact: 该基础服务健康已不可观测，且大概率服务本身异常。
            Action: docker compose ps 查 {{ $labels.job }} 与对应容器状态。
            若 job=otelcol 不可达，pg/redis 指标流亦会同步中断 → 触发
            PostgresMetricsAbsent / RedisMetricsAbsent。

      - alert: PostgresMetricsAbsent
        # absent_over_time = 1 表示 2 分钟内 Prometheus 完全没收到该指标的
        # 任何数据点。等价于 otelcol postgresqlreceiver 连不上 PG（或 otelcol
        # 自身宕）。pg_stat_database_numbackends 是 P2b 重命名的关键 gauge，
        # 任何 PG 实例存活都会以 collection_interval=30s 持续产值。
        expr: absent_over_time(pg_stat_database_numbackends[2m]) == 1
        for: 1m
        labels:
          severity: critical
          domain: omc
          service: postgres
        annotations:
          summary: "PostgreSQL 指标流中断"
          description: |
            过去 2 分钟未收到任何 pg_stat_database_numbackends 数据点。
            等价于 otelcol postgresqlreceiver 连不上 PG ≥ 2 分钟。
            Impact: 设备/配置/告警等业务数据读写大概率全停，
                    app/acs/worker 级联报错。
            Action: docker compose logs postgres；docker compose logs otelcol；
                    检查 PG 磁盘、连接数、是否 OOM；
                    若 PG 正常确认 otelcol 容器状态与 postgresqlreceiver 错误。

      - alert: RedisMetricsAbsent
        # 同上，redis_uptime_in_seconds 是 P2b 重命名后的 redis.uptime 别名，
        # Redis 存活时永远在涨；2 分钟无数据点等价于 Redis 不可达。
        expr: absent_over_time(redis_uptime_in_seconds[2m]) == 1
        for: 1m
        labels:
          severity: critical
          domain: omc
          service: redis
        annotations:
          summary: "Redis 指标流中断"
          description: |
            过去 2 分钟未收到任何 redis_uptime_in_seconds 数据点。
            等价于 otelcol redisreceiver 连不上 Redis ≥ 2 分钟。
            Impact: TR-069 会话、命令队列、缓存全停，ACS 南向受影响。
            Action: docker compose logs redis；docker compose logs otelcol；
                    检查 Redis 内存与持久化；
                    若 Redis 正常确认 otelcol 容器状态与 redisreceiver 错误。

  - name: omc.infra_capacity
    interval: 30s
    rules:
      - alert: PostgresConnectionsHigh
        # 指标名经 otelcol metricstransform 由 postgresql.backends /
        # postgresql.connection.max 重命名为 pg_* 别名，与 P2b 前完全兼容。
        expr: sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          domain: omc
          service: postgres
        annotations:
          summary: "PostgreSQL 连接数接近上限（> 80%）"
          description: |
            后端连接数已超过 max_connections 的 80%，持续 5 分钟。
            Impact: 新连接可能被拒，应用侧 pgxpool 取连接排队、p99 抖动。
            Action: 查连接泄漏 / 慢查询占用连接；评估调大 max_connections 或连接池配额。

      - alert: RedisAggregationMemoryHigh
        # redis_memory_max_bytes=0（或缺失）表示未设 maxmemory ——
        # 用 and 守卫避免除零 / 缺失误报。聚合状态与普通缓存共享 Redis，
        # 因此这里监控实际 Redis 水位而非不完整的抽样估算。
        expr: (redis_memory_used_bytes / redis_memory_max_bytes >= 0.80) and (redis_memory_max_bytes > 0)
        for: 5m
        labels:
          severity: warning
          domain: omc
          service: redis
        annotations:
          summary: "Redis 聚合内存使用接近 maxmemory（>= 80%）"
          description: |
            Redis 已用内存达到 maxmemory 的 80%，持续 5 分钟。
            Impact: 当前 noeviction 会拒绝新写入，PM 聚合窗口将无法累加并触发消息重投。
            Action: 查 pmagg 活跃窗口/抽样 bytes、TTL 和 sweeper；确认 Redis v2 已启用，
                    按资源预算扩容或降低状态开销。

      - alert: RedisAggregationMemoryCritical
        expr: (redis_memory_used_bytes / redis_memory_max_bytes >= 0.90) and (redis_memory_max_bytes > 0)
        for: 2m
        labels:
          severity: critical
          domain: omc
          service: redis
        annotations:
          summary: "Redis 聚合内存即将达到 maxmemory（>= 90%）"
          description: |
            Redis 已用内存达到 maxmemory 的 90%。noeviction 会拒绝新写入，
            PM 聚合状态、幂等键和运行时缓存都可能写入失败。
            立即检查 pmagg 状态规模、异常恢复循环和 Redis 容量；不要切换为淘汰策略。

