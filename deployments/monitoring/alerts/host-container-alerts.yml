# OMC 主机 / 容器 / nginx 入口 告警规则
#
# 配套 node-exporter（job=node）、cAdvisor（job=cadvisor）、nginx-prometheus-exporter
# （job=nginx，抓 web:8090/stub_status）三个采集器（见 docker-compose.monitoring.yml
# 与 prometheus.yml）。补齐原先缺失的「服务器资源 + 容器资源 + nginx 入口流量」告警。
#
# 阈值取保守经验值（资源类 > 90% 持续 10 分钟才告警，避免瞬时毛刺误报）；
# 压测定标后按实际容量回调，与 infra/connection-pool 告警同一惯例。
#
# 指标来源备注：
#   - node-exporter 以 bind mount 宿主 /proc /sys / 根采集，反映【宿主机】资源；
#   - cAdvisor 的 ContainerMemoryNearLimit 仅在容器设了 mem limit 时才会触发
#     （当前 compose 未设 limit → 不会误报，属未来加 limit 后的前瞻规则）；
#   - nginx stub_status 只有连接/请求总量，没有按状态码拆分；5xx 速率需用 Loki
#     日志（{service="nginx"} |~ "5[0-9]{2}"）派生，不在本 Prometheus 规则内。

groups:
  - name: omc.host
    interval: 30s
    rules:
      - alert: HostMetricsAbsent
        # node-exporter scrape target 宕（容器退出 / 端口不通）→ 宿主资源不可观测。
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          service: node
        annotations:
          summary: "主机指标采集 node-exporter 不可达"
          description: |
            job=node 已 2 分钟抓取失败，宿主 CPU/内存/磁盘资源不可观测。
            Impact: 主机层资源告警全部失效，无法发现服务器过载/磁盘满。
            Action: docker compose ps node-exporter；查容器日志与挂载（/proc /sys /）。

      - alert: HostCPUHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: node
        annotations:
          summary: "宿主 CPU 使用率持续偏高（> 90%）"
          description: |
            {{ $labels.instance }} CPU 使用率 > 90% 已持续 10 分钟。
            Impact: ACS 会话处理 / KPI 计算等可能排队，p99 时延抖动。
            Action: 看 cAdvisor 面板定位吃 CPU 的容器；评估扩容或限流（acs 准入控制）。

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: node
        annotations:
          summary: "宿主内存使用率持续偏高（> 90%）"
          description: |
            {{ $labels.instance }} 内存使用率 > 90% 已持续 10 分钟。
            Impact: 接近 OOM，内核可能 kill 容器进程（pg/redis/app 任一被杀都是事故）。
            Action: 看 cAdvisor 容器内存定位泄漏；评估加内存或给容器设 mem limit。

      - alert: HostDiskSpaceLow
        # 排除 tmpfs/overlay/squashfs 等非持久文件系统，避免误报。
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.10)
          and (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} > 0)
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: node
        annotations:
          summary: "宿主磁盘剩余空间不足（< 10%）：{{ $labels.mountpoint }}"
          description: |
            挂载点 {{ $labels.mountpoint }} 可用空间 < 10% 已持续 10 分钟。
            Impact: PM/MR/固件/备份落盘、PG WAL、容器卷写入可能失败。
            Action: 清理旧 PM/MR/备份与日志；查 docker 卷（pg/minio/loki/tempo）占用。

      - alert: HostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.05)
          and (node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} > 0)
        for: 5m
        labels:
          severity: critical
          domain: omc
          service: node
        annotations:
          summary: "宿主磁盘剩余空间告急（< 5%）：{{ $labels.mountpoint }}"
          description: |
            挂载点 {{ $labels.mountpoint }} 可用空间 < 5% 已持续 5 分钟，随时写满。
            Impact: 数据库写失败 / 文件落盘失败 / 容器异常，可能引发数据损坏。
            Action: 立即清理；磁盘满前优先保 PG 与 MinIO 数据卷所在分区。

      - alert: HostDiskWillFillSoon
        # 按近 6h 趋势线性外推：若 4 小时内会写满，且当前已用 > 70%，才告警（双重守门防噪声）。
        expr: |
          (predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}[6h], 4 * 3600) < 0)
          and
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.30)
        for: 30m
        labels:
          severity: critical
          domain: omc
          service: node
        annotations:
          summary: "宿主磁盘预计 4 小时内写满：{{ $labels.mountpoint }}"
          description: |
            按近 6 小时增长趋势外推，{{ $labels.mountpoint }} 预计 4 小时内耗尽。
            Impact: 早于实际写满给出处置窗口，避免磁盘满引发的级联故障。
            Action: 提前扩容 / 清理；定位异常增长来源（PM 采集量？日志暴涨？备份未清理？）。

      - alert: HostDiskIOSaturated
        # Linux 5.x 的 io_time 只能说明采样时钟内持续有 I/O 活动，不能单独等价为
        # 设备饱和。必须同时满足：活动时钟 >95%、平均 await >20ms、平均队列 >1。
        expr: |
          (rate(node_disk_io_time_seconds_total{device!~"loop.*|ram.*"}[5m]) > 0.95)
          and on (instance, device)
          (
            (
              rate(node_disk_read_time_seconds_total{device!~"loop.*|ram.*"}[5m])
              + rate(node_disk_write_time_seconds_total{device!~"loop.*|ram.*"}[5m])
            )
            /
            clamp_min(
              rate(node_disk_reads_completed_total{device!~"loop.*|ram.*"}[5m])
              + rate(node_disk_writes_completed_total{device!~"loop.*|ram.*"}[5m]),
              0.001
            ) > 0.020
          )
          and on (instance, device)
          (rate(node_disk_io_time_weighted_seconds_total{device!~"loop.*|ram.*"}[5m]) > 1)
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: node
        annotations:
          summary: "宿主磁盘 I/O 持续饱和：{{ $labels.device }}"
          description: |
            磁盘 {{ $labels.device }} 同时满足活动时钟 >95%、平均等待 >20ms、平均队列 >1，
            已持续 10 分钟。此复合条件排除了“小而连续的 I/O 令活动占比接近 100%”的误报。
            Impact: 数据库提交、MinIO 上传和队列持久化时延可能同步升高。
            Action: 在主机面板对照吞吐、IOPS、MinIO scanner 与容器 blkio，定位读写来源。

  - name: omc.container
    interval: 30s
    rules:
      - record: omc:container_last_seen:fresh
        # Prometheus 在目标消失后默认仍保留旧序列约 5 分钟。容器重建期间若直接
        # sum by(service)，旧、新容器 limit 会被相加并产生资源漂移假告警。
        expr: (time() - container_last_seen{name!=""}) < 90

      - alert: ContainerMetricsAbsent
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: warning
          domain: omc
          service: cadvisor
        annotations:
          summary: "容器指标采集 cAdvisor 不可达"
          description: |
            job=cadvisor 已 2 分钟抓取失败，各容器 CPU/内存资源不可观测。
            Impact: 无法按容器定位资源瓶颈（主机层 node-exporter 仍可用）。
            Action: docker compose ps cadvisor；查 privileged 与挂载（/var/lib/docker 等）。

      - alert: ContainerMemoryNearLimit
        # release bundle 强制设 deploy.resources.limits（env 参数化，resources.env 注入），
        # 此为一线生效规则。哨兵 < 64e9 排除未设限环境（cAdvisor 在无 limit 时把
        # spec_memory_limit_bytes 报成整机内存，会稀释饱和度 → 误判）。
        expr: |
          (container_memory_working_set_bytes{name!="",name!~"(omcgo|docker)-minio-.*"}
           / container_spec_memory_limit_bytes{name!="",name!~"(omcgo|docker)-minio-.*"} > 0.90)
          and (container_spec_memory_limit_bytes{name!="",name!~"(omcgo|docker)-minio-.*"} > 0)
          and (container_spec_memory_limit_bytes{name!="",name!~"(omcgo|docker)-minio-.*"} < 64e9)
          and on (id) omc:container_last_seen:fresh
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: cadvisor
        annotations:
          summary: "容器内存接近 limit（> 90%）：{{ $labels.name }}"
          description: |
            容器 {{ $labels.name }} 内存已用 > 其 mem limit 的 90%，持续 10 分钟。
            Impact: 触限将被 OOMKill 重启，丢失会话/进行中任务。
            Action: 查该容器内存泄漏；评估调大 limit 或优化内存占用。

      - alert: MinIOWorkingSetPressure
        # MinIO 海量小对象会产生大量可回收 dentry/inode slab；working set 高并不
        # 等价于进程泄漏，但持续超过 80% 会触发 cgroup 回收并放大磁盘 I/O。
        expr: |
          (
            container_memory_working_set_bytes{name=~"(omcgo|docker)-minio-.*"}
            / container_spec_memory_limit_bytes{name=~"(omcgo|docker)-minio-.*"}
          ) > 0.80
          and
          (
            container_memory_working_set_bytes{name=~"(omcgo|docker)-minio-.*"}
            / container_spec_memory_limit_bytes{name=~"(omcgo|docker)-minio-.*"}
          ) <= 0.90
          and on (id) omc:container_last_seen:fresh
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: minio
        annotations:
          summary: "MinIO working set 持续超过限额 80%：{{ $labels.name }}"
          description: "优先对照 container_memory_rss 判断进程增长；若 RSS 低而 working set 高，通常是可回收文件系统元数据压力，应检查小对象数量、scanner 和磁盘 I/O。"

      - alert: MinIOWorkingSetPressureCritical
        expr: |
          (
            container_memory_working_set_bytes{name=~"(omcgo|docker)-minio-.*"}
            / container_spec_memory_limit_bytes{name=~"(omcgo|docker)-minio-.*"}
          ) > 0.90
          and on (id) omc:container_last_seen:fresh
        for: 5m
        labels:
          severity: critical
          domain: omc
          service: minio
        annotations:
          summary: "MinIO working set 持续超过限额 90%：{{ $labels.name }}"
          description: "MinIO cgroup 已接近 memory.max，持续回收可能造成上传延迟和磁盘 I/O 抬升；检查 RSS、可回收 slab、memory.events、S3 错误和 OOM。"

      - alert: MinIOProcessRSSHigh
        # RSS 与 working set 分开判断：只有进程匿名内存本身持续增长，才按泄漏或
        # 请求缓冲失控处理；文件缓存/slab 不应被误报成 MinIO 进程泄漏。
        expr: |
          (
            container_memory_rss{name=~"(omcgo|docker)-minio-.*"}
            / container_spec_memory_limit_bytes{name=~"(omcgo|docker)-minio-.*"}
          ) > 0.50
          and on (id) omc:container_last_seen:fresh
        for: 10m
        labels:
          severity: critical
          domain: omc
          service: minio
        annotations:
          summary: "MinIO 进程 RSS 持续超过限额 50%：{{ $labels.name }}"
          description: "这不是文件缓存假象；检查并发请求缓冲、multipart upload、goroutine/heap 增长和 MinIO 版本问题。"

      - alert: MinIOProcessRSSGrowing
        # 30 分钟线性增长斜率 > 512KiB/s（约 900MiB/30min），且 RSS 已超过
        # limit 的 15%，可在触及 50% 绝对阈值前发现持续泄漏；容器重启形成的下降
        # 会自然打断 for 窗口。
        expr: |
          (deriv(container_memory_rss{name=~"(omcgo|docker)-minio-.*"}[30m]) > 524288)
          and
          (
            container_memory_rss{name=~"(omcgo|docker)-minio-.*"}
            / container_spec_memory_limit_bytes{name=~"(omcgo|docker)-minio-.*"}
          ) > 0.15
          and on (id) omc:container_last_seen:fresh
        for: 15m
        labels:
          severity: warning
          domain: omc
          service: minio
        annotations:
          summary: "MinIO 进程 RSS 持续快速增长：{{ $labels.name }}"
          description: "MinIO RSS 在 30 分钟窗口内持续增长，预计增幅超过约 900MiB；检查请求缓冲、multipart upload、goroutine/heap 和版本缺陷。"

      - alert: MinIOS3RequestErrors
        # errors_total 同时累计预期的 bucket 探测 4xx（例如首次启动时
        # NoSuchBucket/NoSuchLifecycle），只有专用 5xx 指标代表服务端失败。
        expr: sum(increase(minio_s3_requests_5xx_errors_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          domain: omc
          service: minio
        annotations:
          summary: "MinIO 出现 S3 服务端请求失败"
          description: "最近 5 分钟 MinIO S3 服务端错误计数增加；检查 503/请求限流、磁盘 I/O、memory.max、对象写入失败和 ACS 上传日志。"

      - alert: ContainerOOMKilled
        # container_oom_events_total 在容器被 OOMKill 时自增；任何一次都需关注。
        expr: |
          increase(container_oom_events_total{name=~"(omcgo|docker)-(app|acs|worker|postgres|postgres-tsdb|redis|nats|minio|web)-.*"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
          domain: omc
          service: cadvisor
        annotations:
          summary: "容器发生 OOMKill：{{ $labels.name }}"
          description: |
            容器 {{ $labels.name }} 近 10 分钟发生过 OOMKill（内存触限被内核杀死并重启）。
            Impact: 进行中会话/任务丢失，可能反复重启抖动。
            Action: 查该容器内存泄漏；调大 mem limit 或优化占用；结合「容器内存饱和度」面板定位。

      - alert: ContainerCPUSaturation
        # release bundle 强制设 CPU limit（cpu_quota 有限值），此为一线生效规则。
        # usage、quota、period 使用 cAdvisor Compose service 标签统一聚合。
        # 先按容器计算 quota / period，再按 service 汇总；quota <= 0 的无限额容器被排除。
        expr: |
          (
            sum by (service) (
              rate(container_cpu_usage_seconds_total{service=~"app|acs|worker"}[5m])
              and on (id) omc:container_last_seen:fresh
            )
            /
            sum by (service) (
              (
                (container_spec_cpu_quota{service=~"app|acs|worker"} > 0)
                / container_spec_cpu_period{service=~"app|acs|worker"}
              )
              and on (id) omc:container_last_seen:fresh
            )
          ) > 0.9
          and on (service)
          (
            sum by (service) (
              (container_spec_cpu_quota{service=~"app|acs|worker"} > 0)
              and on (id) omc:container_last_seen:fresh
            ) > 0
          )
        for: 10m
        labels:
          severity: warning
          domain: omc
          observer: cadvisor
        annotations:
          summary: "服务 CPU 接近 limit（> 90%）：{{ $labels.service }}"
          description: |
            服务 {{ $labels.service }} CPU 使用已达其 CPU limit 的 90%，持续 10 分钟。
            Impact: 触限将被 CFS 限流，请求延迟上升。
            Action: 评估调大 CPU limit 或水平扩容；按 service 定位 CPU 热点（开 pprof CPU profile）。

      - alert: ContainerCPUThrottling
        # CFS 限流比 = 被限流周期 / 总周期；持续偏高说明 CPU limit 偏紧。
        expr: |
          (
            rate(container_cpu_cfs_throttled_periods_total{name=~"(omcgo|docker)-(app|acs|worker)-.*"}[5m])
            / rate(container_cpu_cfs_periods_total{name=~"(omcgo|docker)-(app|acs|worker)-.*"}[5m])
          ) > 0.25
          and on (id) omc:container_last_seen:fresh
        for: 10m
        labels:
          severity: warning
          domain: omc
          service: cadvisor
        annotations:
          summary: "容器 CPU 被 CFS 限流（> 25%）：{{ $labels.name }}"
          description: |
            容器 {{ $labels.name }} 近 5 分钟超过 25% 的调度周期被 CPU 限流，持续 10 分钟。
            Impact: 即使整体 CPU 利用率不高，请求也会因限流而抖动变慢。
            Action: 调大 CPU limit；或核对 limit 是否设得过紧。

      - alert: TSDBContainerCPUHigh
        expr: |
          (
            sum by (name) (
              rate(container_cpu_usage_seconds_total{name=~"(omcgo|docker)-postgres-tsdb-.*"}[5m])
              and on (id) omc:container_last_seen:fresh
            )
            /
            sum by (name) (
              (
                container_spec_cpu_quota{name=~"(omcgo|docker)-postgres-tsdb-.*"}
                / container_spec_cpu_period{name=~"(omcgo|docker)-postgres-tsdb-.*"}
              )
              and on (id) omc:container_last_seen:fresh
            )
          ) > 0.70
        for: 10m
        labels: {severity: warning, domain: omc, service: postgres-tsdb}
        annotations: {summary: "postgres-tsdb CPU 持续超过配额 70%：{{ $labels.name }}"}

      - alert: TSDBContainerCPUCritical
        expr: |
          (
            sum by (name) (
              rate(container_cpu_usage_seconds_total{name=~"(omcgo|docker)-postgres-tsdb-.*"}[5m])
              and on (id) omc:container_last_seen:fresh
            )
            /
            sum by (name) (
              (
                container_spec_cpu_quota{name=~"(omcgo|docker)-postgres-tsdb-.*"}
                / container_spec_cpu_period{name=~"(omcgo|docker)-postgres-tsdb-.*"}
              )
              and on (id) omc:container_last_seen:fresh
            )
          ) > 0.90
        for: 5m
        labels: {severity: critical, domain: omc, service: postgres-tsdb}
        annotations: {summary: "postgres-tsdb CPU 持续超过配额 90%：{{ $labels.name }}"}

      - alert: TSDBContainerMemoryHigh
        expr: |
          (
            container_memory_working_set_bytes{name=~"(omcgo|docker)-postgres-tsdb-.*"}
            /
            container_spec_memory_limit_bytes{name=~"(omcgo|docker)-postgres-tsdb-.*"}
          ) > 0.85
          and container_spec_memory_limit_bytes{name=~"(omcgo|docker)-postgres-tsdb-.*"} < 64e9
          and on (id) omc:container_last_seen:fresh
        for: 10m
        labels: {severity: warning, domain: omc, service: postgres-tsdb}
        annotations: {summary: "postgres-tsdb 内存持续超过限额 85%：{{ $labels.name }}"}

      - alert: OMCResourcePlanCAdvisorAbsent
        # 资源漂移规则的实际值完全依赖 cAdvisor；即使 node-exporter 正常，cAdvisor
        # 不可达也不能让 OMCResourcePlanDrift 静默。与普通采集 warning 分开升级为 critical。
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          service: resource-plan
        annotations:
          summary: "资源计划实际 limit 采集 cAdvisor 不可达"
          description: "cAdvisor 连续 2 分钟不可抓取，资源漂移检查失效。禁止在未恢复实际容器指标前继续发布。"

      - alert: OMCResourcePlanBaselineAbsent
        # resources.env 由 Task 1 契约验证后生成 node-exporter textfile；缺失时不能
        # 用硬编码默认值替代，否则运行期会与真实部署方案失联。
        expr: absent_over_time(omc_resource_plan_cpu_cores[5m]) == 1
        for: 2m
        labels:
          severity: critical
          domain: omc
          service: resource-plan
        annotations:
          summary: "资源计划声明指标缺失"
          description: "未收到由完整 resources.env 渲染的资源计划指标，无法与实际 cgroup limit 比对。"

      - alert: OMCResourcePlanCPUQuotaSeriesAbsent
        expr: |
          omc_resource_plan_cpu_cores
          unless on (compose_service)
          label_replace(
            count by (container_label_com_docker_compose_service) (
              (
                container_spec_cpu_quota{container_label_com_docker_compose_service=~"app|acs|acs-candidate|worker|postgres|postgres-tsdb|redis-core|redis-pm|nats|minio|web"} > 0
              )
              and on (id) omc:container_last_seen:fresh
            ),
            "compose_service", "$1", "container_label_com_docker_compose_service", "(.*)"
          )
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: resource-plan
        annotations:
          summary: "资源计划服务缺少 cAdvisor CPU quota 序列：{{ $labels.compose_service }}"
          description: "已声明资源计划的服务没有对应 cAdvisor container_spec_cpu_quota 序列。Task 8 必须核验 Docker 29/overlayfs；若持续缺失，接入 Docker API 资源 exporter 后才可上线。"

      - alert: OMCResourcePlanCPUPeriodSeriesAbsent
        expr: |
          omc_resource_plan_cpu_cores
          unless on (compose_service)
          label_replace(
            count by (container_label_com_docker_compose_service) (
              (
                container_spec_cpu_period{container_label_com_docker_compose_service=~"app|acs|acs-candidate|worker|postgres|postgres-tsdb|redis-core|redis-pm|nats|minio|web"} > 0
              )
              and on (id) omc:container_last_seen:fresh
            ),
            "compose_service", "$1", "container_label_com_docker_compose_service", "(.*)"
          )
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: resource-plan
        annotations:
          summary: "资源计划服务缺少 cAdvisor CPU period 序列：{{ $labels.compose_service }}"
          description: "已声明资源计划的服务没有对应 cAdvisor container_spec_cpu_period 序列，无法计算 CPU 实际 limit。"

      - alert: OMCResourcePlanMemoryLimitSeriesAbsent
        expr: |
          omc_resource_plan_memory_limit_bytes
          unless on (compose_service)
          label_replace(
            count by (container_label_com_docker_compose_service) (
              (
                container_spec_memory_limit_bytes{container_label_com_docker_compose_service=~"app|acs|acs-candidate|worker|postgres|postgres-tsdb|redis-core|redis-pm|nats|minio|web"} > 0
              )
              and on (id) omc:container_last_seen:fresh
            ),
            "compose_service", "$1", "container_label_com_docker_compose_service", "(.*)"
          )
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: resource-plan
        annotations:
          summary: "资源计划服务缺少 cAdvisor 内存 limit 序列：{{ $labels.compose_service }}"
          description: "已声明资源计划的服务没有对应 cAdvisor container_spec_memory_limit_bytes 序列。"

      - alert: OMCResourcePlanDrift
        # 声明值来自 Task 1 完整 resources.env → node-exporter textfile，实际值来自
        # cAdvisor 的 Docker cgroup。按 compose service 标签一一比对，不把计划写死在规则中。
        expr: |
          (
            label_replace(
              sum by (container_label_com_docker_compose_service) (
                (
                  container_spec_cpu_quota{container_label_com_docker_compose_service=~"app|acs|acs-candidate|worker|postgres|postgres-tsdb|redis-core|redis-pm|nats|minio|web"}
                  / container_spec_cpu_period{container_label_com_docker_compose_service=~"app|acs|acs-candidate|worker|postgres|postgres-tsdb|redis-core|redis-pm|nats|minio|web"}
                )
                and on (id) omc:container_last_seen:fresh
              ),
              "compose_service", "$1", "container_label_com_docker_compose_service", "(.*)"
            )
            != on (compose_service)
            omc_resource_plan_cpu_cores
          )
          or
          (
            label_replace(
              sum by (container_label_com_docker_compose_service) (
                container_spec_memory_limit_bytes{container_label_com_docker_compose_service=~"app|acs|acs-candidate|worker|postgres|postgres-tsdb|redis-core|redis-pm|nats|minio|web"}
                and on (id) omc:container_last_seen:fresh
              ),
              "compose_service", "$1", "container_label_com_docker_compose_service", "(.*)"
            )
            != on (compose_service)
            omc_resource_plan_memory_limit_bytes
          )
        for: 3m
        labels:
          severity: critical
          domain: omc
          service: resource-plan
        annotations:
          summary: "OMC 声明资源计划与容器实际 limit 不一致：{{ $labels.compose_service }}"
          description: |
            cAdvisor 报告的实际 cgroup CPU 或内存限额已偏离同源 resources.env 声明值。
            Action: 先运行 release healthcheck.sh 定位 resources.env、Compose 渲染或 Docker inspect
                    的哪一层漂移；禁止只改单层或用容器重启掩盖问题。

  - name: omc.nginx
    interval: 30s
    rules:
      - alert: NginxExporterDown
        expr: up{job="nginx"} == 0
        for: 2m
        labels:
          severity: warning
          domain: omc
          service: nginx
        annotations:
          summary: "nginx-exporter 不可达，入口流量指标中断"
          description: |
            job=nginx 已 2 分钟抓取失败，nginx 并发/QPS 指标不可观测。
            Impact: 看不到入口流量；但 nginx 本身是否可用需另看 NginxUnreachable。
            Action: docker compose ps nginx-exporter；确认能否抓 web:8090/stub_status。

      - alert: NginxUnreachable
        # nginx_up=0：exporter 在跑但抓不到 web:8090/stub_status，
        # 等价于 nginx（web 容器）宕或 8090 监听异常 —— 前端/REST/ACS 入口全断。
        expr: nginx_up == 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          service: nginx
        annotations:
          summary: "Nginx 入口网关不可达（stub_status 抓不到）"
          description: |
            nginx-exporter 抓 web:8090/stub_status 失败 ≥ 2 分钟，nginx 大概率不可用。
            Impact: 前端页面、REST API、ACS 南向入口可能全部不可达（整站入口宕）。
            Action: docker compose ps web；docker compose logs web；查 nginx 配置与 8080/8081 监听。

      - alert: NginxConnectionsHigh
        # 经验阈值，需压测定标。worker_connections=10240×worker 数（auto=CPU 核），
        # 高并发 ACS 场景该值可能正常偏高，部署后按实际容量回调。
        expr: nginx_connections_active > 8000
        for: 5m
        labels:
          severity: warning
          domain: omc
          service: nginx
        annotations:
          summary: "Nginx 活跃连接数持续偏高（> 8000）"
          description: |
            nginx 活跃连接 > 8000 已持续 5 分钟，接近 worker_connections 容量上限。
            Impact: 再涨会拒绝新连接（设备 Inform / 前端请求失败）。
            Action: 看是否设备 Inform 洪泛或慢上游堆积；评估扩 ACS 实例 / 调 worker_connections。
