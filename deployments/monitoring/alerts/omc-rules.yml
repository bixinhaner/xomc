# OMC 告警规则 — 三进程存活 + 崩溃循环 + 监控心跳 + 业务级告警
#
# 注意：
#   - 以 up{job="..."} == 0 作为存活信号
#   - critical: 影响主链路（app / acs）
#   - warning: 异步 worker，短暂 down 不立即升级
#   - omc.meta（T-0149）：DeadMansSwitch 监控栈心跳
#   - omc.business（T-0153）：业务级告警，基于各模块已注册的 Prometheus 指标；
#     阈值为初始经验值，须随真实运行基线调整。

groups:
  - name: omc.process_liveness
    interval: 30s
    rules:
      - alert: OMCAppDown
        expr: up{job="omc-app"} == 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          deployment_unit: app
        annotations:
          summary: "omcgo-app instance {{ $labels.instance }} is down"
          description: |
            omcgo-app metrics endpoint has been unreachable for 2 minutes.
            Affected instance: {{ $labels.instance }}.
            Impact: 管理面 REST API 与 gRPC 不可用，前端登录/查询/下发全停。
            Action: 查看 run/logs/app/app.log，确认进程是否退出或端口被占用。

      - alert: OMCACSDown
        # ACS 采用 primary + candidate 双实例接力。单副本失效仍可承载南向流量，
        # 只有两个静态抓取目标都不可达时才判定主链路中断。
        expr: sum(up{job="omc-acs", instance=~"acs-primary:9090|acs-candidate:9090"}) < 1
        for: 2m
        labels:
          severity: critical
          domain: omc
          deployment_unit: acs
        annotations:
          summary: "全部 omcgo-acs 实例均不可达"
          description: |
            primary 与 candidate 两个 omcgo-acs metrics endpoint 已同时不可达 2 分钟。
            Impact: TR-069 南向断开，CPE 无法 Inform / 接收命令。
            Action: 查看 run/logs/acs/acs.log，确认 :7547 / :7557 监听是否正常。

      - alert: OMCACSReplicaDown
        expr: up{job="omc-acs", instance=~"acs-primary:9090|acs-candidate:9090"} == 0
        for: 2m
        labels:
          severity: warning
          domain: omc
          deployment_unit: acs
        annotations:
          summary: "omcgo-acs 单副本不可达（{{ $labels.instance }}）"
          description: |
            ACS 剩余副本仍可承载南向请求，但发布接力冗余已经降级。
            Affected instance: {{ $labels.instance }}.
            Action: 立即检查对应容器与 /readyz，恢复双副本后再执行下一次发布。

      - alert: OMCWorkerDown
        expr: up{job="omc-worker"} == 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          deployment_unit: worker
        annotations:
          summary: "omcgo-worker instance {{ $labels.instance }} is down"
          description: |
            omcgo-worker metrics endpoint has been unreachable for 5 minutes.
            Affected instance: {{ $labels.instance }}.
            Impact: PM/MR 文件处理与 KPI 计算延迟，告警/数据同步不实时。
            Action: 查看 run/logs/worker/worker.log。

      - alert: OMCProcessCrashLooping
        # up 在 0/1 间反复跳变 = 进程崩溃后被 systemd 反复拉起。一次「崩溃+拉起」
        # 产生 2 次 changes；15min 内 > 4 次 ≈ 2 轮以上重启，属异常（正常发版
        # 重启仅 2 次）。systemd StartLimitBurst（见 omcgo-*.service，T-0150）
        # 熔断后 up 稳定为 0，转由上面的 *Down 规则接管。
        expr: changes(up{job=~"omc-app|omc-acs|omc-worker"}[15m]) > 4
        for: 1m
        labels:
          severity: critical
          domain: omc
        annotations:
          summary: "{{ $labels.job }} 正在崩溃循环（{{ $labels.instance }}）"
          description: |
            过去 15 分钟内 {{ $labels.job }} 的存活状态反复跳变（> 4 次），
            进程崩溃后被反复重启 —— 大概率存在无法自愈的故障。
            Impact: 服务实际不可用或频繁中断。
            Action: journalctl -u omcgo-app|omcgo-acs|omcgo-worker -n 200 定位
                    崩溃根因；若 systemd 已因 StartLimitBurst 进入 failed 态，
                    修复后用 systemctl reset-failed <unit> 恢复。

  - name: omc.mml_translation
    interval: 30s
    rules:
      - alert: MMLPathTranslationMissSustained
        # mml_path_translation_miss_total 由 internal/mml/fanout.go 在 standardPath→
        # privatePath 翻译任一步骤 fallback 时累加，label `reason` ∈
        # {device_lookup | product_unresolved | translator_unavail | path_unmapped}。
        # 任何 reason 在 5min 内持续累加，意味着 ParamModel 字典 / discovered_param_mappings
        # 与设备实际不同步，CPE 收到的 SOAP body 是 IETF 标准 path 而非厂商私有 path，
        # 大概率被 CPE 拒为 Fault 9005。
        expr: sum(rate(mml_path_translation_miss_total[5m])) by (reason) > 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: mml
        annotations:
          summary: "MML 路径翻译持续 fallback（reason={{ $labels.reason }}）"
          description: |
            过去 5 分钟内 mml_path_translation_miss_total{reason="{{ $labels.reason }}"}
            速率持续 > 0，标准 path → 私有 path 翻译用 fallback 兜底下发。
            Reason 含义：
              · device_lookup       — 设备 SN 在 devices 表查不到（基站未注册）
              · product_unresolved  — productClass 未匹配任何 product_class_patterns 正则
              · translator_unavail  — Translator 构造失败（mapping 表数据异常）
              · path_unmapped       — 单条 path 在 discovered / default mapping 中均无映射
            Action:
              1. 跑 `omcctl mml migrate-device-params --dry-run` 看哪些 device_parameters
                 是 privatePath（说明历史脏数据未迁移）
              2. 看 `parammodel_intersect_*` 指标确认 discovered_param_mappings 是否被填充
              3. 必要时用 admin Tab 3 补充缺失映射并重试任务

      - alert: MMLPathTranslationOrphan
        # T-0168 激进路线告警。mml_path_translation_orphan_total 由 mml_adapters.go
        # 在 ProductRegistry.MatchProductClass 返 ErrOrphan 时累加，label
        # `product_class` 是触发 orphan 的设备 product_class 字符串。
        # 任务仍正常 fanout（原路径下发），但意味着：① 厂商把新 productClass
        # 接入了网络但没在 product_class_patterns 表登记；② 命令很可能因路径
        # 不匹配被 CPE 拒（Fault 9005）。运维应在 24h 内补 patterns。
        expr: increase(mml_path_translation_orphan_total[5m]) > 0
        for: 0s
        labels:
          severity: warning
          domain: omc
          subsystem: mml
        annotations:
          summary: "MML 野设备 productClass 未识别：{{ $labels.product_class }}"
          description: |
            过去 5 分钟内 product_class="{{ $labels.product_class }}" 的设备
            通过 MML 控制台执行命令，但该 productClass 未匹配 product_class_patterns
            表任何正则。激进路线（T-0168）让任务用 standardPath 原路径下发，
            CPE 可能因路径不匹配返 Fault 9005。
            Action:
              1. 用 omcctl 或 admin UI 查表确认 product_class_patterns 是否缺该 patterns
              2. 业务方提供该设备所属 product / param_model 后补 patterns + reload
              3. 历史 orphan 任务的执行结果可在任务记录页查看（详情展开 → 路径转换详情）
            Runbook: docs/operations/告警处置Runbook.md#MMLPathTranslationOrphan

      - alert: ParamModelBackupFailedSurge
        # T-0178 R-NEW-T0178-3 兑现。DELETE /param-models/:name 时若物理 rename
        # 失败(EACCES / ENOSPC / EROFS 等非 ENOENT errno)，handler 走保守回滚
        # 不删 DB 行，返 500 + ErrCodeParamModelBackupFailed=2031。worker
        # BackupCleanup 单文件 unlink 失败也累加 result=error。两路径共用
        # parammodel_backup_cleanup_total{result="error"} 指标。
        # 持续 > 0/10min 通常表示 host fs 真实问题(权限丢失 / 磁盘满 / 只读挂载)，
        # 用户反复点 DELETE 全部失败，运维需介入排障。
        expr: |
          increase(parammodel_backup_cleanup_total{result="error"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: parammodel
        annotations:
          summary: "ParamModel 自定义 XML 备份失败 surge(host fs 异常)"
          description: |
            过去 10 分钟内 parammodel_backup_cleanup_total{result="error"} 持续累加,
            表示 worker 清扫器 unlink 残留文件失败,或 DELETE handler 物理备份失败
            触发保守回滚(500 ErrCodeParamModelBackupFailed=2031)。
            可能原因(按概率排序):
              1. /opt/omc/data/(外置字典目录,Phase 2 后单目录 param-mappings 等) 磁盘满 — 跑 df -h /opt/omc
              2. 目录权限被运维误改(chown 10001:10001 /opt/omc/data 未生效)
              3. 挂载点变只读(ro remount) — 跑 mount | grep /opt/omc/data
              4. 容器内 UID 与 host 不对齐(K8s 部署后常见)
            Action:
              1. ssh 到对应 host,验证 customDir 的 mount / 权限 / 磁盘空间
              2. 查 worker 容器日志:docker logs <worker> | grep parammodel.backup-cleanup
              3. 查 app 容器日志:docker logs <app> | grep parammodel.delete.aborted_backup_failed
              4. 修复 fs 状态后告警自动消;若持久化故障,临时把 cron 间隔拉大
                 (backup_cleanup_cron: "0 3 * * 0" 改为每周一次)避免噪声
            Runbook: docs/operations/告警处置Runbook.md#ParamModelBackupFailedSurge

  - name: omc.kpi_router
    interval: 30s
    rules:
      - alert: KPIRouteInvalidationFailed
        # result=failure 只在统一失效器完成 3 次总尝试（或有界后台上下文超时）
        # 后累加；业务写入已经提交，不能回滚或向调用方伪装为写失败，但旧路由
        # 可能继续过滤新 counter，因此需要立即人工恢复。
        expr: increase(omc_kpi_router_invalidations_total{result="failure",scope="global"}[5m]) > 0
        for: 0s
        labels:
          severity: critical
          domain: omc
          subsystem: kpi_router
        annotations:
          summary: "KPI 路由全局失效最终失败（trigger={{ $labels.trigger }}）"
          description: |
            KPI 路由失效在有界后台上下文内完成 3 次总尝试后仍未能推进 Redis
            cache_version。当前 app 本进程 L1 已清理，但其他 app/worker 进程可能
            继续使用旧路由，导致新增 counter 在 PM 入库前被过滤。
            Action:
              1. 检查 Redis 可用性及 app 日志中的 "KPI route invalidation failed"
              2. Redis 恢复后，以 super_admin 调用 POST /api/v1/admin/kpi-routes/refresh
              3. 确认响应 cache_version 递增，随后观察 stale_evictions_total 增长

      - alert: KPIRouteVersionReadFailuresSustained
        # 单次读取失败按 fail-open 保留当前完整 L1 快照；持续失败则意味着 worker
        # 无法感知远端版本推进，新指标路由可能长期不生效。
        expr: rate(omc_kpi_router_cache_version_read_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: kpi_router
        annotations:
          summary: "KPI 路由 cache_version 持续读取失败（{{ $labels.job }} / {{ $labels.instance }}）"
          description: |
            过去 5 分钟 KPI Router 持续无法读取 Redis cache_version。查询会 fail-open
            使用当前 L1 完整快照，但该进程无法及时采用其他进程发布的新 KPI 路由。
            Action: 检查 Redis 连通性与 kpi.router 日志；恢复后确认
                    omc_kpi_router_stale_evictions_total 增长且本告警自动解除。

  - name: omc.param_sync
    interval: 30s
    rules:
      - alert: ParamSyncReadyRunNotFinalized
        expr: param_sync_runs_ready_but_not_finalized > 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: param_sync
        annotations:
          summary: "参数同步运行已具备完成条件但未收敛"
          description: |
            durable device task 与 result 数量均已完整，但运行仍停留在活跃状态。
            Action: 检查 param_sync_reconcile_duration_seconds、数据库锁和 app 日志；
                    维护收敛器正常时该值应在下一轮 30 秒扫描内恢复为 0。

      - alert: ParamSyncRunCounterDrift
        expr: |
          max(param_sync_run_counter_drift) > 0
          and on() (max(param_sync_run_counter_drift_oldest_idle_seconds) > 300)
        for: 2m
        labels:
          severity: warning
          domain: omc
          subsystem: param_sync
        annotations:
          summary: "参数同步运行计数与持久任务状态漂移"
          description: |
            parameter_sync_runs 的计数与 device_tasks/result 权威状态不一致。
            Action: 检查维护扫描错误和数据库写入；禁止人工修改计数或清理运行记录。

      - alert: ParamSyncRunBlockedWithoutActiveDeviceTask
        expr: |
          sum(max by (reason) (param_sync_runs_blocked{reason=~"plan_not_dispatched|terminal_task_missing_result"})) > 0
          and on() (max(param_sync_runs_blocked_oldest_idle_seconds{reason=~"plan_not_dispatched|terminal_task_missing_result"}) > 300)
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: param_sync
        annotations:
          summary: "参数同步运行被非设备执行原因阻塞"
          description: |
            存在任务计划未派发或终态任务缺少 durable result；这不是设备仍在执行。
            Action: 按 reason 检查 dispatcher、terminal bridge、result consumer 和 outbox。

      - alert: ParamSyncActiveRunOldestAgeHigh
        expr: |
          (max(param_sync_active_run_oldest_age_seconds) > 300)
          and on() (sum(max by (reason) (param_sync_runs_blocked{reason=~"plan_not_dispatched|terminal_task_missing_result"})) > 0)
          and on() (max(param_sync_runs_blocked_oldest_idle_seconds{reason=~"plan_not_dispatched|terminal_task_missing_result"}) > 300)
        for: 2m
        labels:
          severity: warning
          domain: omc
          subsystem: param_sync
        annotations:
          summary: "非设备执行原因导致参数同步活跃运行超过 5 分钟"
          description: |
            最老活跃运行已超过正常设备任务与维护收敛窗口。
            Action: 结合 param_sync_runs_blocked 区分真实设备执行、未派发和缺结果。

  - name: omc.pm_ingest
    interval: 30s
    rules:
      - alert: PMUploadStalledWarning
        expr: |
          (time() - max(acs_pm_upload_last_accepted_timestamp_seconds) > 1500)
          and (time() - max(acs_pm_upload_last_accepted_timestamp_seconds) <= 2400)
          and on () (sum(omc_pm_slot_expected_devices) > 0)
          and on () (time() - max(process_start_time_seconds{deployment_unit="acs"}) > 1500)
        for: 3m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "ACS 已超过 25 分钟未接收 PM 文件"
          description: "存在应上报 PM 的活动设备，但 ACS 最后一次成功持久化 PM 文件距今已超过 25 分钟；检查设备周期任务、ACS 会话/503、MinIO 和上传拒绝。"

      - alert: PMUploadStalledCritical
        expr: |
          (time() - max(acs_pm_upload_last_accepted_timestamp_seconds) > 2400)
          and on () (sum(omc_pm_slot_expected_devices) > 0)
          and on () (time() - max(process_start_time_seconds{deployment_unit="acs"}) > 2400)
        for: 3m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "ACS 已超过 40 分钟未接收 PM 文件"
          description: "存在应上报 PM 的活动设备，但 ACS 最后一次成功持久化 PM 文件距今已超过 40 分钟；业务数据已连续缺槽，立即检查设备周期任务、ACS、MinIO 和网络入口。"

      - alert: PMIngestLagBehindACS
        expr: |
          (max(acs_pm_upload_last_accepted_timestamp_seconds) > 0)
          and on ()
          (
            max(acs_pm_upload_last_accepted_timestamp_seconds)
            - (max(omc_pm_ingest_last_success_timestamp_seconds) or vector(0)) > 300
          )
          and on () (sum(omc_pm_slot_expected_devices) > 0)
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM Worker 入库落后 ACS 超过 5 分钟"
          description: "ACS 已持久化新 PM 文件，但 Worker 最近成功入库时间落后超过 5 分钟；检查 PM 主队列、registration-wait、死信、worker 资源和 TSDB 写入。"

      - alert: PMSlotObserverStalled
        expr: |
          (time() - omc_pm_slot_observer_last_success_timestamp_seconds{deployment_unit="worker"} > 180)
          or
          (
            absent(omc_pm_slot_observer_last_success_timestamp_seconds{deployment_unit="worker"})
            and on () (time() - max(process_start_time_seconds{deployment_unit="worker"}) > 180)
          )
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 槽位健康观察器停止更新"
          description: "PM 槽位健康快照已超过 3 分钟没有成功更新；首页覆盖率和槽位告警可能已经失真，检查 worker、主库和时序库。"

      - alert: PMQuarterSlotMissing
        expr: |
          (omc_pm_slot_coverage_ratio == 0)
          and on (carrier, technology) (omc_pm_slot_expected_devices > 0)
          and on (carrier, technology) (omc_pm_slot_alert_eligible == 1)
        for: 0m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 15 分钟槽位完全缺失（{{ $labels.carrier }}/{{ $labels.technology }}）"
          description: "最近一个已到 12 分钟关闭宽限的 PM 槽位应收设备数大于 0，但实际收到 0；检查上报入口、ACS 会话/拒绝、对象存储和消费链路。"

      - alert: PMQuarterSlotCoverageCritical
        expr: |
          (omc_pm_slot_coverage_ratio > 0 and omc_pm_slot_coverage_ratio < 0.95)
          and on (carrier, technology) (omc_pm_slot_expected_devices > 0)
          and on (carrier, technology) (omc_pm_slot_alert_eligible == 1)
        for: 1m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 15 分钟槽位覆盖率严重不足（{{ $labels.carrier }}/{{ $labels.technology }}）"
          description: "最近一个已到 12 分钟关闭宽限的 PM 槽位覆盖率低于 95%；检查 ACS 接收、MinIO、PM 主队列、registration-wait、worker 入库和设备上报状态。"

      - alert: PMQuarterSlotCoverageWarning
        expr: |
          (omc_pm_slot_coverage_ratio >= 0.95 and omc_pm_slot_coverage_ratio < 0.98)
          and on (carrier, technology) (omc_pm_slot_expected_devices > 0)
          and on (carrier, technology) (omc_pm_slot_alert_eligible == 1)
        for: 2m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 15 分钟槽位覆盖率偏低（{{ $labels.carrier }}/{{ $labels.technology }}）"
          description: "最近一个已到 12 分钟关闭宽限的 PM 槽位覆盖率低于 98%；检查迟到设备、ACS 接收和 PM 消费延迟。"

      - alert: PMReportKeysMissingFromLibrary
        expr: sum by (carrier, technology) (increase(omc_pm_whitelist_miss_values_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 厂家上报名未命中指标库（{{ $labels.carrier }}/{{ $labels.technology }}）"
          description: |
            最近 15 分钟持续出现制式全局指标库也未登记、且未被明确处置的厂家上报名。
            这些值因缺少完整指标元数据没有进入时序库；全局已知但未绑定当前产品的值只计入禁用指标。
            Action: 检查 worker 的 "PM report keys missing from indicator library" 日志，
                    按 report_key_sample 核对指标库 report_key、大小写和厂家版本。

      - alert: PMTechnologyMismatch
        expr: sum by (declared_technology, detected_technology) (increase(omc_pm_technology_mismatch_files_total[15m])) > 0
        for: 0s
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM XML 制式与设备身份不一致（{{ $labels.declared_technology }}→{{ $labels.detected_technology }}）"
          description: |
            PM XML 中多个独立指标家族表明其实际制式与设备元数据不一致。
            文件原件仍保留在 MinIO，隔离元数据已写入 pm_file_quarantines；
            该文件没有进入指标路由、KPI 计算或聚合 outbox。
            Action: 检查上游生成器、上传路由和设备产品/制式配置，修正后重新发布原文件。

      - alert: PMAggregationWatermarkBlocked
        expr: increase(omc_pm_aggregation_watermark_blocked_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 聚合窗口持续等待消费水位"
          description: |
            窗口已超过最小关闭宽限，但对应 15 分钟或上卷事件仍未消费。
            Action: 检查 outbox、NATS consumer pending 和 worker CPU/内存资源。

      - alert: PMAggregationRebuildFailed
        expr: increase(omc_pm_aggregation_rebuild_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 迟到事件修订重建失败"
          description: |
            迟到事件已进入持久重建队列但执行失败。
            Action: 检查 pm_aggregation_rebuilds.last_error、持久 outbox 保留和 Redis/TSDB 状态。

      - alert: PMFinalizeOldestDueHigh
        # warning > 30m。仅由有界关闭调度器维护；无 due 窗口时不会输出序列，
        # 因此不会空窗误报。
        expr: |
          (omc_pm_aggregation_finalize_oldest_due_seconds > 1800)
          and (omc_pm_aggregation_finalize_oldest_due_seconds <= 3600)
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 窗口关闭尾延迟持续超过 30 分钟"
          description: |
            最老已到关闭宽限的 PM 聚合窗口仍未完成关闭超过 30 分钟。
            Action: 对照 finalize inflight、claim conflict、worker CPU、NATS 水位和 TSDB 写入耗时；
                    不要通过缩短关闭宽限或跳过迟到重算掩盖积压。

      - alert: PMFinalizeOldestDueCritical
        # critical > 60m。
        expr: omc_pm_aggregation_finalize_oldest_due_seconds > 3600
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 窗口关闭尾延迟超过 60 分钟"
          description: |
            有 PM 聚合窗口在到达关闭宽限后超过 60 分钟仍未发布。
            Impact: 小时/天/周 KPI 新鲜度持续下降，迟到重算会继续放大数据库负载。
            Action: 立即检查 worker、TSDB、Redis 和 finalize lease；必要时扩资源后让有界调度器排空。

      - alert: PMRebuildSnapshotScanSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(omc_pm_aggregation_rebuild_snapshot_scan_seconds_bucket[10m]))) > 10
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 迟到重算只读快照扫描 P95 持续超过 10 秒"
          description: |
            repeatable-read keyset 快照扫描的 P95 超过 10 秒，说明重算数据库读取成本偏高。
            Action: 对照 rebuild batch 大小、扫描行数、分页数、coalesced 数和 TSDB CPU/I/O/temp bytes；
                    禁止恢复按 network/product/group 重复扫描的旧路径。

      - alert: PMDailyVersionExpectedSlotsMismatch
        expr: increase(omc_pm_aggregation_daily_version_expected_slots_mismatch_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "日聚合版本片段期望槽位与自然周期不一致"
          description: |
            已成功发布的规则日窗口中，version-calibrated expected slots 与自然日槽位不同。
            这是版本中途生效的可观测事实，不等同于数据缺失；检查结果中的 version_expected_slots、
            natural_expected_slots 和 period_complete，确认消费者没有把版本片段误判为完整自然日。

  - name: omc.meta
    interval: 30s
    rules:
      # DeadMansSwitch（T-0149）—— 常驻 firing 的心跳告警（expr 恒为真）。
      # 用途：解决「谁来监控监控系统」。外部看门狗应「持续收到」本告警经
      # AlertManager 转发的心跳；一旦在约定窗口（建议 ≤ AlertManager
      # repeat_interval 的 2 倍）内收不到，说明 Prometheus / AlertManager /
      # 整个监控栈已死 —— 由外部系统反向告警「监控失联」。
      # AlertManager 侧已配 alertname=DeadMansSwitch 专用路由 → deadmansswitch
      # receiver（webhook），repeat_interval=1m。
      - alert: DeadMansSwitch
        expr: vector(1)
        labels:
          severity: none
          domain: omc
        annotations:
          summary: "监控栈心跳 —— 此告警应始终 firing"
          description: |
            DeadMansSwitch 是常驻心跳信号，正常情况下永远处于 firing 状态。
            外部看门狗应持续收到本告警的转发；若在约定窗口内未收到，
            说明 Prometheus 或 AlertManager 已停止工作，监控链已失效，
            需人工立即介入检查监控栈本身。

  # 业务级告警（T-0153）—— 基于各模块已注册的 Prometheus 指标。
  # 阈值为初始经验值，须随真实运行基线调整。
  - name: omc.business
    interval: 30s
    rules:
      - alert: OMCDeviceBatchDropping
        # omc_device_batch_dropped_total：Periodic Inform 批量处理器因 worker
        # channel 满而丢弃的 Inform 事件 —— 任何丢弃都意味着设备上报数据丢失。
        expr: rate(omc_device_batch_dropped_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          domain: omc
          subsystem: device
        annotations:
          summary: "Periodic Inform 批量处理器正在丢弃事件"
          description: |
            omc_device_batch_dropped_total 在过去 5 分钟持续增长 —— 批量处理器
            的 worker 输入通道已满，设备 Inform 数据正在丢失。
            Impact: 设备心跳 / 参数变更上报丢失，设备状态与实际不一致。
            Action: 调大 batch_processor.workers / input_buffer（config.*.yaml）；
                    排查 DB 写入是否变慢导致 flush 跟不上。

      - alert: OMCDeviceBatchFlushFailing
        expr: rate(omc_device_batch_flush_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: device
        annotations:
          summary: "Periodic Inform 批量 flush 重试后仍失败"
          description: |
            omc_device_batch_flush_failed_total 持续增长，批量写库重试后仍失败。
            Impact: 部分设备状态更新未落库。
            Action: 检查 PostgreSQL 可用性与写入延迟（见 infra-alerts.yml）。

      - alert: OMCPMProcessingSlow
        # omc_pm_processing_duration_seconds 是 Histogram，按 le 桶统计 p95。
        expr: histogram_quantile(0.95, rate(omc_pm_processing_duration_seconds_bucket[10m])) > 60
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 文件处理 p95 耗时 > 60s"
          description: |
            PM 文件处理 p95 耗时持续 10 分钟超过 60 秒。
            Impact: KPI 计算与时序数据入库滞后，性能看板不实时。
            Action: 看 worker CPU / TimescaleDB 写入压力；评估 PM 文件体积与并发。

      - alert: OMCPMQueuePendingHigh
        expr: omc_pm_queue_pending{subject="pm.file.received",durable="pm-workers"} >= 5000
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 队列 pending 持续达到背压高水位"
          description: |
            PM durable consumer 的待投递消息持续 10 分钟不少于 5000。
            瞬时同步上报由 durable queue 吸收；若同时最老消息超过 2 分钟，
            ACS 上传背压会启动。检查 worker 吞吐、NATS durable 状态和 TimescaleDB 写入。

      - alert: OMCPMQueueOldestAgeHigh
        expr: omc_pm_queue_oldest_age_seconds{subject="pm.file.received",durable="pm-workers"} >= 600
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 队列最老消息持续超过 10 分钟"
          description: |
            最老待处理 PM 消息年龄达到背压高水位，说明处理延迟已影响数据时效。
            联查 pending、redelivery、delivery/ack rate 和 worker 错误日志。

      - alert: OMCPMQueueSampleStale
        expr: time() - omc_pm_queue_sample_timestamp_seconds{deployment_unit="acs",subject="pm.file.received",durable="pm-workers"} > 300
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 队列健康样本已陈旧"
          description: |
            ACS 背压超过 5 分钟没有消费到新鲜队列样本。若背压已经生效，
            watchdog 会保守保持拒收状态。检查 NATS 管理查询、采样器日志与连接状态。

      - alert: OMCPMQueueAckRateBelowDelivery
        expr: |
          max without (subject, durable) (
            omc_pm_queue_ack_pending{subject="pm.file.received",durable="pm-workers"}
          ) > 0
          and acs_pm_queue_ack_rate < acs_pm_queue_delivery_rate
          and acs_pm_queue_backlog_slope > 0
          and max without (subject, durable) (
            time() - omc_pm_queue_sample_timestamp_seconds{deployment_unit="acs",subject="pm.file.received",durable="pm-workers"}
          ) < 60
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 确认速率持续低于 consumer 投递速率"
          description: |
            durable consumer 存在未确认消息，且 ack rate 持续低于 delivery rate，
            backlog slope 同时为正。worker 已无法追平输入，需扩容或排查数据库瓶颈。

      - alert: OMCCommandConsumerAckFailures
        expr: increase(omc_eventbus_ack_failures_total{subject="command.get_parameters.response"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: command
        annotations:
          summary: "COMMAND/GPV consumer ACK 操作失败"
          description: |
            COMMAND/GPV consumer 的 Ack/Nak/Term/InProgress 操作持续失败。
            Impact: JetStream 可能重投已处理消息，或 ack floor 无法推进。
            Action: 按 durable/action/error_class 联查 NATS 连接、consumer 状态和应用日志。

      - alert: OMCCommandConsumerAckFloorStalled
        expr: |
          omc_eventbus_consumer_ack_pending{subject="command.get_parameters.response"} > 0
          and on (subject, durable)
          omc_eventbus_consumer_oldest_age_seconds{subject="command.get_parameters.response"} > 300
          and on (subject, durable)
          changes(omc_eventbus_consumer_ack_sequence{subject="command.get_parameters.response"}[10m]) == 0
        for: 10m
        labels:
          severity: critical
          domain: omc
          subsystem: command
        annotations:
          summary: "COMMAND/GPV durable ack floor 停滞"
          description: |
            durable consumer 存在未确认消息，最老消息超过 5 分钟，且 ack floor 10 分钟未推进。
            Impact: GPV 响应可能积压并触发重投，单设备慢处理可能拖累参数同步。
            Action: 联查 handler 耗时、本地队列深度、redelivery、ACK 失败和对应 durable 的 NATS ConsumerInfo。

      - alert: OMCCommandConsumerRedeliveryHigh
        expr: omc_eventbus_consumer_redelivered{subject="command.get_parameters.response"} > 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: command
        annotations:
          summary: "COMMAND/GPV durable 出现持续 redelivery"
          description: |
            COMMAND/GPV durable consumer 持续存在重投消息。
            Impact: 可能说明 handler 慢、ACK 失败或 NATS ack_wait 设置不足。
            Action: 检查 omc_eventbus_handler_duration_seconds、omc_eventbus_ack_failures_total 和 NATS consumer 配置。

      - alert: OMCCommandConsumerQueueSampleStale
        expr: time() - omc_eventbus_consumer_sample_timestamp_seconds{subject="command.get_parameters.response"} > 300
        for: 2m
        labels:
          severity: warning
          domain: omc
          subsystem: command
        annotations:
          summary: "COMMAND/GPV durable 健康样本已陈旧"
          description: |
            COMMAND/GPV consumer 超过 5 分钟没有新鲜 durable 健康样本。
            Impact: 运维无法确认 ack floor、pending 和 redelivery 是否仍在推进。
            Action: 检查采样器日志、NATS 管理查询和对应进程的 metrics 暴露。

      - alert: OMCPMStreamingAggregationNotReady
        expr: omc_pm_aggregation_ready == 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 在线聚合子系统未就绪"
          description: |
            原始 PM 入库进程仍可工作，但在线聚合启动检查未通过。
            检查 Redis AOF/noeviction、NATS PM_AGGREGATION stream 和 worker 日志。

      - alert: OMCPMStreamingAggregationOutboxErrors
        expr: increase(omc_pm_aggregation_outbox_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 聚合 Outbox 持续发布失败"
          description: |
            15 分钟原始数据已经提交，但标准聚合事件未能持续发布。
            检查 NATS 连接、PM_AGGREGATION stream 和 outbox 待发布行。

      - alert: OMCPMStreamingAggregationFinalizeErrors
        expr: increase(omc_pm_aggregation_finalize_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 聚合窗口持续落库失败"
          description: |
            Redis 窗口状态会保留并重试。检查 TimescaleDB、窗口 failed 状态和 Redis 内存；
            禁止通过查询原始 PM 表进行人工补算。

      - alert: OMCPMStreamingAggregationEventFailures
        expr: increase(omc_pm_aggregation_events_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          domain: omc
          subsystem: pm
        annotations:
          summary: "PM 聚合事件持续处理失败"
          description: |
            Worker 在确认消息前持续处理失败，可能导致 NATS 重投和聚合窗口延迟。
            检查 Redis maxmemory/OOM、TimescaleDB 写入、窗口恢复日志和 consumer redelivery。

      - alert: OMCParameterSyncAutomaticQueueStalled
        expr: |
          max(param_sync_automatic_admission_queued_requests) > 0
          and max(param_sync_automatic_admission_oldest_queue_age_seconds) > 7200
        for: 10m
        labels:
          severity: warning
          domain: omc
          subsystem: parameter_sync
        annotations:
          summary: "自动参数同步排队超过两小时"
          description: |
            全局准入保护仍在工作，但最老的自动同步请求已排队超过两小时。
            检查设备会话处理速率、参数同步任务完成率、PostgreSQL CPU 与自动准入占用量。
