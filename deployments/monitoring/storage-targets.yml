# OMC storage target contract.
#
# This file is deployment metadata, not a Prometheus scrape configuration. The
# application/OMC admission controller and the dashboard build consume it to
# give the same physical target a stable identity. Prometheus still obtains
# measured capacity from node-exporter/MinIO metrics; an absent target mapping
# must never be rendered as zero capacity.
version: 1

storage_targets:
  # Backward-compatible policy identity. Thresholds are still configured once
  # on filesystem/root with write_scope=all. At runtime OMC expands this global
  # policy to the protected write paths below and evaluates the highest-usage
  # host mountpoint among them.
  - target_type: filesystem
    target_id: root
    mountpoint: /
    source: node_exporter
    write_scope: [all]
    resolution: protected_write_mountpoints
    components: [application, pgdata, tsdbdata, redisdata, redispmdata, natsdata, miniodata, docker-root]

# Runtime path contract consumed by the storage-protection backend. If a
# *_DATA_PATH variable is empty, Docker named volume storage is resolved as:
#   ${OMCGO_DOCKER_ROOT_DIR:-/var/lib/docker}/volumes/${OMCGO_DOCKER_VOLUME_PREFIX:-omcgo}_<volume>/_data
# Multiple paths on the same host mountpoint are deduplicated before display
# and admission decisions.
protected_write_paths:
  - env: POSTGRES_DATA_PATH
    named_volume: pgdata
  - env: TSDB_DATA_PATH
    named_volume: tsdbdata
  - env: REDIS_DATA_PATH
    named_volume: redisdata
  - env: REDIS_PM_DATA_PATH
    named_volume: redispmdata
  - env: NATS_DATA_PATH
    named_volume: natsdata
  - env: MINIO_DATA_PATH
    named_volume: miniodata
  - path: /opt/omc/run/logs
    env: OMCGO_HOST_LOGS_PATH
  - path: /opt/omc/data
    env: OMCGO_HOST_DATA_PATH
  - path: /var/lib/docker
    env: OMCGO_DOCKER_ROOT_DIR

# These are logical ownership/retention classes on the same physical target.
# They are not storage-protection targets and must not receive independent
# capacity thresholds. Add a second storage_targets entry only for a future
# independently mounted disk or explicitly configured external storage.
logical_components:
  - id: application
    write_scope: [log, upload, report, trace]
  - id: database
    write_scope: [database, queue, pm, mr]
  - id: object
    write_scope: [upload, pm, mr, firmware, backup, report, trace]
  - id: monitoring
    write_scope: [monitoring, log, trace]

# Bucket labels are deliberately a fixed business taxonomy. The values are
# the default MinIO bucket names in cmd/{app,acs,worker}/etc/config.*.yaml;
# deployments may override the physical name without creating arbitrary
# Prometheus label values or exposing object paths.
minio_buckets:
  - category: pm
    bucket: pm-files
    write_scope: [pm]
  - category: mr
    bucket: mr-files
    write_scope: [mr]
  - category: firmware
    bucket: firmware
    write_scope: [firmware]
  - category: config-backup
    bucket: config-backup
    write_scope: [backup]
  - category: logs
    bucket: logs
    write_scope: [log]
  - category: reports
    bucket: reports
    write_scope: [report]
  - category: exchange
    bucket: omc-exchange
    write_scope: [exchange]
  - category: ui-assets
    bucket: ui-assets
    write_scope: [ui]
  - category: trace
    bucket: trace-bulk
    write_scope: [trace]
  - category: file-bundles
    bucket: file-bundles
    write_scope: [report, download]
  - category: config-snapshots
    bucket: config-snapshots
    write_scope: [backup]
  - category: device-licenses
    bucket: device-licenses
    write_scope: [firmware]
