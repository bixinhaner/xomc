# Loki 单节点配置 — local filesystem 存储
#
# 用途：作为 OMC 日志栈的存储 + 查询层，Grafana 通过 Loki datasource 查询日志。
# 数据流：promtail tail /run/logs/* → push HTTP API :3100 → Loki TSDB → Grafana
#
# 容量与保留：dev 默认保留 7 天。生产建议改 retention_period + 对象存储后端
# （s3/minio/gcs）替代 filesystem，并启用 compactor。
#
# 端口：
#   3100 HTTP API（Grafana datasource 走这个）
#   9096 gRPC（仅内部，组件间通信）

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h          # 7 天
  max_query_lookback: 168h
  deletion_mode: filter-and-delete # 允许容量清理器通过删除 API 删除日志
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 0         # 0 = 不限（dev）

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_cancel_period: 0s # 容量清理请求提交后立即进入处理队列
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://alertmanager:9093
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: false
