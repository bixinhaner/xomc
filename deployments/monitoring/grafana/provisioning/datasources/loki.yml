# Grafana datasource provisioning — 自动注册 Loki 数据源
#
# 容器内部网络中 loki 服务名为 loki，HTTP API 监听 3100。
# 查询入口：Grafana → Explore → 选 Loki → 写 LogQL。
#
# 推荐查询示例（service label 由 promtail-config.yml 注入）：
#   {service="omcgo-app"}                       # App 全量日志
#   {service="omcgo-acs", level="error"}        # ACS error 级
#   {service="omcgo-app"} |= "panic"            # 全文搜 panic
#   {service="omcgo-app"} | json | device_sn="120200024719AAB0039"   # 按设备过滤
#   sum by (service) (count_over_time({level="error"}[5m]))           # 各服务 5 min error 速率

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
