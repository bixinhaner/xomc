# Grafana datasource provisioning — 自动注册 Tempo 数据源
#
# 容器内部网络中 tempo 服务名为 tempo，HTTP API 监听 3200。
# 若改动 tempo 服务名或端口，请同步修改 url。
#
# 查询入口：Grafana → Explore → 选 Tempo → 输入 traceID 或用 TraceQL 搜索：
#   { resource.service.name = "omcgo-app" }
#   { resource.service.name = "omcgo-acs" && duration > 100ms }
#   { name =~ "POST /api/.+" }
#
# trace-to-logs 关联：traceID 已自动作为 zap 字段写入日志（待 T-0157 完成
# 真正注入；本期 datasource 端先把跳转链路配好），点 span → 自动跳 Loki 查
# 同 service 同时间窗口的日志。SDK 的 serviceName 与 Loki 的 service label
# 命名一致（omcgo-app / omcgo-acs / omcgo-worker），无需额外映射。

apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      # trace 内嵌跳转到 Loki 日志查询
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        # 用 service label 关联：trace 的 service.name 与 Loki 的 service label 同名
        tags:
          - key: service.name
            value: service
        filterByTraceID: false
        filterBySpanID: false
        # 没有 traceID 注入日志时，按 service + 时间窗口召回相关日志
        customQuery: true
        query: '{service="$${__span.tags["service.name"]}"} |= "$${__trace.traceId}"'
      # service map（自动从 span 关系图谱化）
      serviceMap:
        datasourceUid: prometheus
      # 查询节点搜索
      nodeGraph:
        enabled: true
      search:
        hide: false
      # 默认按 serviceName 维度展示 trace 列表
      lokiSearch:
        datasourceUid: loki
