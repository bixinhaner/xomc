# Prometheus 主配置 — OMC 三进程 + 自身
#
# 容器内端口（与 omcgo/cmd/{app,acs,worker}/etc/config.dev.yaml 保持一致）：
#   omcgo-app    metrics  :9091
#   omcgo-acs    metrics  :9090
#   omcgo-worker metrics  :9092
#
# scrape target 走 docker-compose 内部 hostname（service 名），不要写 localhost。
# 容器内部 prometheus 自身监听 :9090，宿主端口直接映射 9090:9090
# （acs metrics 宿主端口已让出，移到 9095:9090）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "omcgo-dev"

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "omc-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:9091"
        labels:
          service: "omcgo-app"
          deployment_unit: "app"

  - job_name: "omc-acs"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "acs:9090"
        labels:
          service: "omcgo-acs"
          deployment_unit: "acs"

  - job_name: "omc-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker:9092"
        labels:
          service: "omcgo-worker"
          deployment_unit: "worker"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"

  # ── 基础服务 exporter（T-0151 + T-0155 Phase 2b）─────────────────
  # pg / redis 指标改由 otelcol 原生 receiver 直连数据库采集，再经
  # prometheusremotewrite 推到本 Prometheus 的 /api/v1/write 端点
  # （需 --web.enable-remote-write-receiver flag，已在 docker-compose 启用）。
  # 指标命名由 otelcol metricstransform processor 保兼容（pg_* / redis_*）。
  #
  # nats / minio 暂留 scrape 模式：otelcol 0.103 contrib 无原生 receiver。
  - job_name: "nats"
    static_configs:
      - targets:
          - "nats-exporter:7777"
        labels:
          service: "nats"

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - "minio:9000"
        labels:
          service: "minio"

  # otelcol 自身的 telemetry（receiver/exporter/pipeline 自监控）
  - job_name: "otelcol"
    static_configs:
      - targets:
          - "otelcol:8888"
        labels:
          service: "otelcol"

  # ── nginx 入口流量（stub_status → nginx-prometheus-exporter）──────────
  # nginx_connections_active（并发）/ nginx_http_requests_total（rate=QPS）
  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx-exporter:9113"
        labels:
          service: "nginx"

  # ── 主机资源（node-exporter：CPU / 内存 / 磁盘 / 负载 / 网络）──────────
  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node"
    # Logical data-volume identity is maintained in storage-targets.yml. Do
    # not add target labels here: node-exporter already owns mountpoint/device
    # labels and missing mappings must remain visible as no-data, not zero.

  # ── 容器资源（cAdvisor：各容器 CPU / 内存 / 网络 / 磁盘）──────────────
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          service: "cadvisor"
    # cAdvisor 暴露的是 cgroup `id` 与 Docker Compose 原始标签；复制为
    # 稳定查询口径，不删除原始标签，便于过渡期排障和兼容旧序列。
    metric_relabel_configs:
      - source_labels: [id]
        regex: "(.+)"
        target_label: container_id
        replacement: "$1"
      - source_labels: [container_label_com_docker_compose_service]
        regex: "(.+)"
        target_label: service
        replacement: "$1"
