# Prometheus 主配置 — OMC 三进程 + 自身
#
# 容器内端口（与 omcgo/cmd/{app,acs,worker}/etc/config.dev.yaml 保持一致）：
#   omcgo-app    metrics  :9091
#   omcgo-acs    metrics  :9090
#   omcgo-worker metrics  :9092
#
# scrape target 走 docker-compose 内部 hostname（service 名），不要写 localhost。
# 容器内部 prometheus 自身监听 :9090，宿主端口直接映射 9090:9090
# （acs metrics 宿主端口已让出，移到 9095:9090）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "omcgo-dev"

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "omc-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:9091"
        labels:
          service: "omcgo-app"
          deployment_unit: "app"

  - job_name: "omc-acs"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "acs:9090"
        labels:
          service: "omcgo-acs"
          deployment_unit: "acs"

  - job_name: "omc-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker:9092"
        labels:
          service: "omcgo-worker"
          deployment_unit: "worker"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"
