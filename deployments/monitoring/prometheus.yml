# Prometheus 主配置 — OMC 三进程 + 自身
#
# 容器内端口（与 omcgo/cmd/{app,acs,worker}/etc/config.dev.yaml 保持一致）：
#   omcgo-app    metrics  :9091
#   omcgo-acs    metrics  :9090
#   omcgo-worker metrics  :9092
#
# scrape target 走 docker-compose 内部 hostname（service 名），不要写 localhost。
# 容器内部 prometheus 自身监听 :9090，宿主端口直接映射 9090:9090
# （acs metrics 宿主端口已让出，移到 9095:9090）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "omcgo-dev"

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "omc-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:9091"
        labels:
          service: "omcgo-app"
          deployment_unit: "app"

  - job_name: "omc-acs"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "acs:9090"
        labels:
          service: "omcgo-acs"
          deployment_unit: "acs"

  - job_name: "omc-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "worker:9092"
        labels:
          service: "omcgo-worker"
          deployment_unit: "worker"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"

  # ── 基础服务 exporter（T-0151 + T-0155 Phase 2b）─────────────────
  # pg / redis 指标改由 otelcol 原生 receiver 直连数据库采集，再经
  # prometheusremotewrite 推到本 Prometheus 的 /api/v1/write 端点
  # （需 --web.enable-remote-write-receiver flag，已在 docker-compose 启用）。
  # 指标命名由 otelcol metricstransform processor 保兼容（pg_* / redis_*）。
  #
  # nats / minio 暂留 scrape 模式：otelcol 0.103 contrib 无原生 receiver。
  - job_name: "nats"
    static_configs:
      - targets:
          - "nats-exporter:7777"
        labels:
          service: "nats"

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - "minio:9000"
        labels:
          service: "minio"

  # otelcol 自身的 telemetry（receiver/exporter/pipeline 自监控）
  - job_name: "otelcol"
    static_configs:
      - targets:
          - "otelcol:8888"
        labels:
          service: "otelcol"
