# omcgo-worker HorizontalPodAutoscaler
# Worker 主要瓶颈是 CPU（KPI 计算）和内存（PM 文件批处理）
# 双指标触发：CPU > 70% 或 内存 > 80% 时扩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omcgo-worker
  namespace: omc
  labels:
    app.kubernetes.io/name: omcgo-worker
    app.kubernetes.io/component: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omcgo-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
