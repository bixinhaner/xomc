apiVersion: apps/v1
kind: Deployment
metadata:
  name: omcgo-worker
  namespace: omcgo
  labels:
    app: omcgo-worker
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omcgo-worker
  template:
    metadata:
      labels:
        app: omcgo-worker
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: omcgo/worker:latest
          args: ["--config", "/etc/omcgo/worker.yaml"]
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: DB_DSN
            - name: TSDB_DSN
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: TSDB_DSN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: REDIS_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: MINIO_SECRET_KEY
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: NATS_URL
          volumeMounts:
            - name: config
              mountPath: /etc/omcgo
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: omcgo-config
            items:
              - key: worker.yaml
                path: worker.yaml
