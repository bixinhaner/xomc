apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omcgo-acs
  namespace: omcgo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omcgo-acs
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: acs_active_sessions
        target:
          type: AverageValue
          averageValue: "2000"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
