# omcgo-acs Secret（占位）
# ⚠️ 生产环境绝对禁止 commit 实际密钥！本文件仅为模板。
#
# 字段说明：
#   DB_PASSWORD            — PostgreSQL 密码
#   REDIS_PASSWORD         — Redis 密码（若启用）
#   MINIO_ACCESS_KEY       — MinIO Access Key
#   MINIO_SECRET_KEY       — MinIO Secret Key
#   CONN_REQ_SECRET        — TR-069 Connection Request 共享密钥（与 app 一致）
#   UPLOAD_USERNAME/PWD    — CPE 文件上传 HTTP Basic 凭据
#   DOWNLOAD_USERNAME/PWD  — CPE 文件下载 HTTP Basic 凭据
apiVersion: v1
kind: Secret
metadata:
  name: omcgo-acs-secret
  namespace: omc
  labels:
    app.kubernetes.io/name: omcgo-acs
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  DB_HOST: "postgres.omc.svc.cluster.local"
  DB_NAME: "omcgo"
  REDIS_HOST: "redis.omc.svc.cluster.local"
  REDIS_PASSWORD: ""
  NATS_HOST: "nats.omc.svc.cluster.local"
  MINIO_HOST: "minio.omc.svc.cluster.local"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  CONN_REQ_SECRET: "REPLACE_ME"
  UPLOAD_USERNAME: "REPLACE_ME"
  UPLOAD_PASSWORD: "REPLACE_ME"
  DOWNLOAD_USERNAME: "REPLACE_ME"
  DOWNLOAD_PASSWORD: "REPLACE_ME"
