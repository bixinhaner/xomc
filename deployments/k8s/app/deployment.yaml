# omcgo-app Deployment
# 主应用（F02-F10 模块化单体），暴露 REST API + gRPC + Prometheus metrics + 健康探针
# 端口对照（与 omcgo/cmd/app/etc/config.prod.yaml 对齐）：
#   8081  — HTTP REST API（业务 + Web 静态）
#   8444  — HTTPS（TLS，可选）
#   50051 — gRPC（ACS ↔ App）
#   9091  — Prometheus metrics + /healthz + /readyz
#   31232 — 北向 Socket CTCC 默认端口
#   31233 — 北向 Socket CUCC 默认端口
#   161/UDP — 北向 SNMP MIB 查询 Agent 默认端口
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omcgo-app
  namespace: omc
  labels:
    app.kubernetes.io/name: omcgo-app
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: omc
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: omcgo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omcgo-app
        app.kubernetes.io/component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: omcgo/app:${VERSION}
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/omcgo/config.yaml"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: https
              containerPort: 8444
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
            - name: nb-socket-ctcc
              containerPort: 31232
              protocol: TCP
            - name: nb-socket-cucc
              containerPort: 31233
              protocol: TCP
            - name: nb-snmp-agent
              containerPort: 161
              protocol: UDP
          envFrom:
            - secretRef:
                name: omcgo-app-secret
          env:
            - name: OMCGO_ENV
              value: "prod"
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: config
              mountPath: /etc/omcgo
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: config
          configMap:
            name: omcgo-app-config
            items:
              - key: config.yaml
                path: config.yaml
