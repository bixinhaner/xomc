apiVersion: apps/v1
kind: Deployment
metadata:
  name: omcgo-app
  namespace: omcgo
  labels:
    app: omcgo-app
    component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omcgo-app
  template:
    metadata:
      labels:
        app: omcgo-app
        component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: omcgo/app:latest
          args: ["--config", "/etc/omcgo/app.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: DB_DSN
            - name: TSDB_DSN
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: TSDB_DSN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: REDIS_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: MINIO_SECRET_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: JWT_SECRET
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: omcgo-secrets
                  key: NATS_URL
          volumeMounts:
            - name: config
              mountPath: /etc/omcgo
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: omcgo-config
            items:
              - key: app.yaml
                path: app.yaml
