# omcgo-app Secret（占位）
# ⚠️ 生产环境绝对禁止 commit 实际密钥！本文件仅为模板：
#   - 实际密钥应通过 sealed-secrets / external-secrets / vault 注入
#   - 或部署时 kubectl create secret generic --from-env-file
#   - 或 CI/CD pipeline 用 ${VAR} 替换占位后 apply
#
# 字段说明：
#   DB_PASSWORD            — PostgreSQL 密码
#   REDIS_PASSWORD         — Redis 密码（若启用）
#   MINIO_ACCESS_KEY       — MinIO Access Key
#   MINIO_SECRET_KEY       — MinIO Secret Key
#   JWT_SECRET             — JWT 签名密钥（必须 ≥32 字符）
#   CONN_REQ_SECRET        — TR-069 Connection Request 共享密钥
#   SMTP_USERNAME          — 告警邮件 SMTP 账户
#   SMTP_PASSWORD          — 告警邮件 SMTP 密码
apiVersion: v1
kind: Secret
metadata:
  name: omcgo-app-secret
  namespace: omc
  labels:
    app.kubernetes.io/name: omcgo-app
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  DB_HOST: "postgres.omc.svc.cluster.local"
  DB_NAME: "omcgo"
  REDIS_HOST: "redis.omc.svc.cluster.local"
  REDIS_PASSWORD: ""
  NATS_HOST: "nats.omc.svc.cluster.local"
  MINIO_HOST: "minio.omc.svc.cluster.local"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_AT_LEAST_32_CHARACTERS_LONG"
  CONN_REQ_SECRET: "REPLACE_ME"
  SMTP_USERNAME: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
