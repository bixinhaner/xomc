# RBAC — OMC 系统 K8s 权限配置
# 原则: 最小权限，每个部署单元独立 ServiceAccount
---
# 1. ServiceAccount 定义
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omcgo-app
  namespace: omcgo
  labels:
    app: omcgo-app
    app.kubernetes.io/part-of: omcgo

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omcgo-acs
  namespace: omcgo
  labels:
    app: omcgo-acs
    app.kubernetes.io/part-of: omcgo

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omcgo-worker
  namespace: omcgo
  labels:
    app: omcgo-worker
    app.kubernetes.io/part-of: omcgo

---
# 2. Role: 允许读取 ConfigMap 和 Secret（应用配置）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omcgo-config-reader
  namespace: omcgo
  labels:
    app.kubernetes.io/part-of: omcgo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["omcgo-config"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["omcgo-secrets"]
    verbs: ["get"]

---
# 3. RoleBinding: app → config-reader
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omcgo-app-config-reader
  namespace: omcgo
  labels:
    app: omcgo-app
    app.kubernetes.io/part-of: omcgo
subjects:
  - kind: ServiceAccount
    name: omcgo-app
    namespace: omcgo
roleRef:
  kind: Role
  name: omcgo-config-reader
  apiGroup: rbac.authorization.k8s.io

---
# 4. RoleBinding: acs → config-reader
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omcgo-acs-config-reader
  namespace: omcgo
  labels:
    app: omcgo-acs
    app.kubernetes.io/part-of: omcgo
subjects:
  - kind: ServiceAccount
    name: omcgo-acs
    namespace: omcgo
roleRef:
  kind: Role
  name: omcgo-config-reader
  apiGroup: rbac.authorization.k8s.io

---
# 5. RoleBinding: worker → config-reader
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omcgo-worker-config-reader
  namespace: omcgo
  labels:
    app: omcgo-worker
    app.kubernetes.io/part-of: omcgo
subjects:
  - kind: ServiceAccount
    name: omcgo-worker
    namespace: omcgo
roleRef:
  kind: Role
  name: omcgo-config-reader
  apiGroup: rbac.authorization.k8s.io
