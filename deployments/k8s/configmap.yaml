apiVersion: v1
kind: ConfigMap
metadata:
  name: omcgo-config
  namespace: omcgo
data:
  app.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      tls_port: 8443
      grpc_port: 50051
      tls:
        enabled: false
    db:
      dsn: "${DB_DSN}"
      max_conns: 50
      min_conns: 10
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
      health_check_interval: 30s
    tsdb:
      dsn: "${TSDB_DSN}"
      max_conns: 30
      min_conns: 5
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
      health_check_interval: 30s
    redis:
      addrs:
        - "redis-cluster:6379"
      password: "${REDIS_PASSWORD}"
      db: 0
      pool_size: 200
    nats:
      url: "${NATS_URL}"
      max_reconnect: -1
      reconnect_wait: 2s
    minio:
      endpoint: "minio:9000"
      access_key: "${MINIO_ACCESS_KEY}"
      secret_key: "${MINIO_SECRET_KEY}"
      use_ssl: false
      buckets:
        pm_files: "pm-files"
        mr_files: "mr-files"
        firmware: "firmware"
        config_backup: "config-backup"
        logs: "logs"
    jwt:
      secret: "${JWT_SECRET}"
      access_token_ttl: 30m
      refresh_token_ttl: 168h
    northbound:
      push_targets: []
    ne_direct:
      enabled: false
      host: "0.0.0.0"
      port: 7549
    metrics:
      port: 9091
    tracer:
      enabled: false
      endpoint: "jaeger-collector:4317"
      sample_rate: 0.1
    log:
      level: "info"
      format: "json"

  acs.yaml: |
    server:
      host: "0.0.0.0"
      port: 7547
      tls_port: 7548
      tls:
        enabled: false
    db:
      dsn: "${DB_DSN}"
      max_conns: 30
      min_conns: 5
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
      health_check_interval: 30s
    redis:
      addrs:
        - "redis-cluster:6379"
      password: "${REDIS_PASSWORD}"
      db: 0
      pool_size: 500
    nats:
      url: "${NATS_URL}"
      max_reconnect: -1
      reconnect_wait: 2s
    session:
      ttl: 5m
      max_concurrent: 5000
    admission:
      max_sessions: 5000
      rate_limit:
        per_device: 10
        global: 50000
    metrics:
      port: 9091
    log:
      level: "info"
      format: "json"

  worker.yaml: |
    db:
      dsn: "${DB_DSN}"
      max_conns: 20
      min_conns: 5
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
      health_check_interval: 30s
    tsdb:
      dsn: "${TSDB_DSN}"
      max_conns: 20
      min_conns: 5
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
      health_check_interval: 30s
    redis:
      addrs:
        - "redis-cluster:6379"
      password: "${REDIS_PASSWORD}"
      db: 0
      pool_size: 100
    nats:
      url: "${NATS_URL}"
      max_reconnect: -1
      reconnect_wait: 2s
    minio:
      endpoint: "minio:9000"
      access_key: "${MINIO_ACCESS_KEY}"
      secret_key: "${MINIO_SECRET_KEY}"
      use_ssl: false
      buckets:
        pm_files: "pm-files"
        mr_files: "mr-files"
        firmware: "firmware"
        config_backup: "config-backup"
        logs: "logs"
    worker:
      pm_workers: 4
      mr_workers: 4
      kpi_interval: 15m
    metrics:
      port: 9091
    log:
      level: "info"
      format: "json"
