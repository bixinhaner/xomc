# OMC 离线交付包 — 构建配置
# 被 build-images.sh 与 build-release.sh 共同以 `source` 读取（bash 语法）。

# ── 版本号（基础设施与项目各自独立，均为纯 semver，从 0.0.1 起步）──────────
# 项目与基础设施是【两个独立交付包】，各自维护版本号，互不耦合：
# · 基础设施版本 INFRA_VERSION —— 基础设施包（Docker 引擎 + 基础镜像）的版本。
#   基础设施不常变，手动维护；每次调整下方镜像清单或 Docker 版本后递增一次
#   （如 0.0.1 → 0.0.2）。build-images.sh 用它命名 omc-infra-<版本>-<架构> 包。
# · 项目基线版本 RELEASE_BASE_VERSION —— build-release.sh 不带 -v 时，自动版本
#   = ${RELEASE_BASE_VERSION}-<构建时间戳>（小版本）；发大版本用 -v 手动指定。
# 当前处于测试阶段，两者都从 0.0.1 起步，不从 1.0.0 起。
INFRA_VERSION="0.0.1"
RELEASE_BASE_VERSION="0.0.1"

# 发布渠道（阶段标识）：test = 测试阶段 / release = 正式发布。
# 决定项目交付包文件名前缀：
#   test    → omc-test-<版本>-<架构>.tar.xz
#   release → omc-release-<版本>-<架构>.tar.xz
# 命令行 build-release.sh --channel <test|release> 可临时覆盖本默认值。
RELEASE_CHANNEL="test"

# 目标架构：每个版本固定同时产出 amd64 与 arm64。可由命令行 --arch 覆盖。
ARCHES="amd64 arm64"

# 交付包压缩方式（减小文件体积）：
#   xz   —— 默认，压缩率最高、解压端通用（xz 几乎所有 Linux 自带）
#   gzip —— 压缩快、体积稍大
#   zstd —— 快且小，但解压端需安装 zstd
PKG_COMPRESS="xz"

# ── Docker 引擎离线包（由 download-docker.sh 下载 → docker-cache/）──────
# 运维侧用交付包内 install-docker.sh + 此包离线安装 Docker。不常变更。
# 模板中的 {arch} 由 download-docker.sh 替换为 Docker 官方静态目录名：
#   amd64 → x86_64    arm64 → aarch64
DOCKER_VERSION="29.5.0"

# 下载地址：按构建机所在网络环境，下面【只启用一行】，其余保持注释。
# （release.conf 由 bash source，多行未注释时以最后一行为准 —— 请确保只放开一行。）
#
#   国内（默认）—— 阿里云镜像，国内可直连：
DOCKER_URL_TEMPLATE="https://mirrors.aliyun.com/docker-ce/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
#   国外环境 —— Docker 官方源（国内常被网络干扰，国外/可直连环境用这个）：
# DOCKER_URL_TEMPLATE="https://download.docker.com/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
#   国内备选 —— 清华大学镜像：
# DOCKER_URL_TEMPLATE="https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
# 注意：先确认所选 DOCKER_VERSION 在该源确实存在（浏览目录页即可），否则会 404。

# ── 基础设施 Docker 镜像（由 build-images.sh 使用，不常变更）────────────
# ⚠️ 重要：发布前请把 latest / latest-pg16 固化为具体版本号，
#          避免不同批次镜像不一致（详见《构建手册》）。
#          这些值同时写入交付包 deploy/.env，供 docker-compose 引用。
#          每次改动这里的镜像版本，记得同步递增上面的 INFRA_VERSION。
IMAGE_POSTGRES="timescale/timescaledb:latest-pg16"
IMAGE_REDIS="redis:7-alpine"
IMAGE_NATS="nats:2.10-alpine"
IMAGE_MINIO="minio/minio:latest"
IMAGE_NGINX="nginx:alpine"

INFRA_IMAGES=(
  "$IMAGE_POSTGRES"
  "$IMAGE_REDIS"
  "$IMAGE_NATS"
  "$IMAGE_MINIO"
  "$IMAGE_NGINX"
)

# ── 监控栈镜像（可选，build-images.sh --with-monitoring 时导出）──────────
MONITORING_IMAGES=(
  "prom/prometheus:v2.51.0"
  "prom/alertmanager:v0.27.0"
  "grafana/grafana:10.4.0"
  "grafana/loki:3.0.0"
  "grafana/promtail:3.0.0"
)
