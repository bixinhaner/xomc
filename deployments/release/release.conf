# OMC 离线交付包 — 构建配置
# 被 build-release.sh 以 `source` 方式读取（bash 语法）。

# 目标架构：每个版本固定同时产出 amd64 与 arm64（部署方案 §4.2）。
# 可由 build-release.sh 的 --arch 参数覆盖。
ARCHES="amd64 arm64"

# ── 基础设施 Docker 镜像 ────────────────────────────────────────────────
# ⚠️ 重要：发布前请把 latest / latest-pg16 固化为具体版本号，
#          避免不同批次交付包镜像不一致（部署方案 §9 #12）。
#          这些值会同时写入交付包 deploy/.env，供 docker-compose 引用，
#          保证 docker save 的镜像与 compose 引用的标签一致。
IMAGE_POSTGRES="timescale/timescaledb:latest-pg16"
IMAGE_REDIS="redis:7-alpine"
IMAGE_NATS="nats:2.10-alpine"
IMAGE_MINIO="minio/minio:latest"
IMAGE_NGINX="nginx:alpine"

INFRA_IMAGES=(
  "$IMAGE_POSTGRES"
  "$IMAGE_REDIS"
  "$IMAGE_NATS"
  "$IMAGE_MINIO"
  "$IMAGE_NGINX"
)

# ── 监控栈镜像（可选，--with-monitoring 时打包）────────────────────────
MONITORING_IMAGES=(
  "prom/prometheus:v2.51.0"
  "prom/alertmanager:v0.27.0"
  "grafana/grafana:10.4.0"
  "grafana/loki:3.0.0"
  "grafana/promtail:3.0.0"
)
