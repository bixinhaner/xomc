# OMC 离线交付包 — 构建配置
# 被 build-images.sh 与 build-release.sh 共同以 `source` 读取（bash 语法）。

# ── 版本号（基础设施与项目各自独立，均为纯 semver，从 0.0.1 起步）──────────
# 项目与基础设施是【两个独立交付包】，各自维护版本号，互不耦合：
# · 基础设施版本 INFRA_VERSION —— 基础设施包（Docker 引擎 + 基础镜像）的版本。
#   基础设施不常变，手动维护；每次调整下方镜像清单或 Docker 版本后递增一次
#   （如 0.0.1 → 0.0.2）。build-images.sh 用它命名 omc-infra-<版本>-<架构> 包。
# · 项目基线版本 RELEASE_BASE_VERSION —— build-release.sh 不带 -v 时，自动版本
#   = ${RELEASE_BASE_VERSION}-<构建时间戳>（小版本）；发大版本用 -v 手动指定。
# 当前处于测试阶段，两者都从 0.0.1 起步，不从 1.0.0 起。
INFRA_VERSION="0.0.1"
RELEASE_BASE_VERSION="0.0.1"

# 发布渠道（阶段标识）：test = 测试阶段 / release = 正式发布。
# 决定项目交付包文件名前缀：
#   test    → omc-test-<版本>-<架构>.tar.xz
#   release → omc-release-<版本>-<架构>.tar.xz
# 命令行 build-release.sh --channel <test|release> 可临时覆盖本默认值。
RELEASE_CHANNEL="test"

# 目标架构（仅 amd64）。
#
# ⚠️ 当前发布工具链【只支持 amd64】。原因：
#   1. 交付目标设备全为 amd64 服务器（运营商内网常见硬件型号）
#   2. arm64 跨架构构建在 amd64 host 上要额外拉镜像 + 占双倍磁盘
#      （双架构全栈 ~40GB，与紧凑 /var 分区频繁冲突）
#   3. 运维侧未对 arm64 交付包做过验证
#
# build-images.sh / build-release.sh / download-docker.sh 已加 amd64-only 校验。
# 若未来要重启 arm64 支持：
#   a) 改本行回 ARCHES="amd64 arm64"
#   b) 移除三个脚本里 "仅支持 amd64" 的 die 校验
#   c) 准备 ≥ 40GB Docker 数据盘
#   d) 在 arm64 目标设备上完整跑一次 deploy.sh + healthcheck.sh 验证
ARCHES="amd64"

# 交付包压缩方式（减小文件体积）：
#   xz   —— 默认，压缩率最高、解压端通用（xz 几乎所有 Linux 自带）
#   gzip —— 压缩快、体积稍大
#   zstd —— 快且小，但解压端需安装 zstd
PKG_COMPRESS="xz"

# ── Docker 引擎离线包（由 download-docker.sh 下载 → docker-cache/）──────
# 运维侧用交付包内 install-docker.sh + 此包离线安装 Docker。不常变更。
# 模板中的 {arch} 由 download-docker.sh 替换为 Docker 官方静态目录名：
#   amd64 → x86_64    arm64 → aarch64
DOCKER_VERSION="29.5.0"

# Docker Compose v2 离线版本 —— 静态二进制（github.com/docker/compose 项目），
# 与 Docker 引擎独立维护。download-docker.sh 下载到 docker-cache/<arch>/，
# build-images.sh 拷入交付包 docker/；install-docker.sh 已自动检测同目录
# docker-compose 二进制并安装到 /usr/local/lib/docker/cli-plugins/，
# 之后 `docker compose ...` 子命令即可用。
# 国内代理：ghproxy 网关（github raw 国内常被墙）。模板中的 {arch} 替换为：
#   amd64 → x86_64    arm64 → aarch64
COMPOSE_VERSION="v2.27.0"
# 下载镜像源列表——download-docker.sh 会依次尝试，第一个联通并下载成功的就采用。
# 如果全部失败 → 脚本报错退出。
# {arch} 替换： amd64 → x86_64 ； arm64 → aarch64
# 调整顺序：把你环境下最稳的源置顶即可。
COMPOSE_URL_TEMPLATES=(
  # DaoCloud 的 GitHub 加速，国内带宽充足、近期稳定
  "https://files.m.daocloud.io/github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # GitMirror 社区节点
  "https://hub.gitmirror.com/https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # ghproxy 官方域（原 mirror.ghproxy.com 已不稳）
  "https://ghproxy.com/https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # kkgithub 镜像（逆向代理 github.com 资源路径不变）
  "https://kkgithub.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # GitHub 原站（可直连环境兑底）
  "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
)
# 兼容旧名：老脚本仍读 COMPOSE_URL_TEMPLATE（单条）
COMPOSE_URL_TEMPLATE="${COMPOSE_URL_TEMPLATES[0]}"

# 下载地址：按构建机所在网络环境，下面【只启用一行】，其余保持注释。
# （release.conf 由 bash source，多行未注释时以最后一行为准 —— 请确保只放开一行。）
#
#   国内（默认）—— 阿里云镜像，国内可直连：
DOCKER_URL_TEMPLATE="https://mirrors.aliyun.com/docker-ce/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
#   国外环境 —— Docker 官方源（国内常被网络干扰，国外/可直连环境用这个）：
# DOCKER_URL_TEMPLATE="https://download.docker.com/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
#   国内备选 —— 清华大学镜像：
# DOCKER_URL_TEMPLATE="https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
# 注意：先确认所选 DOCKER_VERSION 在该源确实存在（浏览目录页即可），否则会 404。

# ── 基础设施 Docker 镜像（由 build-images.sh 使用，不常变更）────────────
# ⚠️ 重要：发布前请把 latest / latest-pg16 固化为具体版本号，
#          避免不同批次镜像不一致（详见《构建手册》）。
#          这些值同时写入交付包 deploy/.env，供 docker-compose 引用。
#          每次改动这里的镜像版本，记得同步递增上面的 INFRA_VERSION。
IMAGE_POSTGRES="timescale/timescaledb:latest-pg16"
IMAGE_REDIS="redis:7-alpine"
IMAGE_NATS="nats:2.10-alpine"
IMAGE_MINIO="minio/minio:latest"
IMAGE_NGINX="nginx:alpine"

INFRA_IMAGES=(
  "$IMAGE_POSTGRES"
  "$IMAGE_REDIS"
  "$IMAGE_NATS"
  "$IMAGE_MINIO"
  "$IMAGE_NGINX"
)

# ── 监控栈镜像（build-images.sh 默认即含；--infra-only 可关闭）──────────
# 含监控栈本体 + 基础服务 exporter。
# v2 起 build-images.sh 默认拉取并打包本组镜像；运维侧若不启用监控栈，可在
# 构建侧用 --infra-only 关闭；老调用方传 --with-monitoring 仍兼容（no-op + 提示）。
# T-0155 Phase 2b: postgres-exporter / redis-exporter 已下线，由 otelcol
# 原生 postgresqlreceiver / redisreceiver 直连数据库采集替代。
# nats-exporter 保留（otelcol 无原生 NATS receiver）；minio 自带 /metrics。
# exporter tag 发布前同样需固化校验。
MONITORING_IMAGES=(
  "prom/prometheus:v2.51.0"
  "prom/alertmanager:v0.27.0"
  "grafana/grafana:10.4.0"
  "grafana/loki:3.0.0"
  # promtail 已由 otelcol filelog receiver 替代（T-0155 Phase 3），下线
  "grafana/tempo:2.5.0"
  "otel/opentelemetry-collector-contrib:0.103.0"
  "natsio/prometheus-nats-exporter:0.15.0"
)

# 监控栈各镜像的独立变量（build-release.sh 写 deploy/.env 供 compose 引用，与
# 上方 MONITORING_IMAGES 保持一致）
IMAGE_PROMETHEUS="prom/prometheus:v2.51.0"
IMAGE_ALERTMANAGER="prom/alertmanager:v0.27.0"
IMAGE_GRAFANA="grafana/grafana:10.4.0"
IMAGE_LOKI="grafana/loki:3.0.0"
IMAGE_TEMPO="grafana/tempo:2.5.0"
IMAGE_OTELCOL="otel/opentelemetry-collector-contrib:0.103.0"
IMAGE_NATS_EXPORTER="natsio/prometheus-nats-exporter:0.15.0"

# ── 业务镜像（项目交付包专属，build-release.sh docker build + docker save）─
# 镜像 tag 形如 omcgo/<svc>:<project_version>，与项目版本一一对应；
# 每次发版重打入 omc-<channel>-<version>-<arch>.tar.xz 内的 images/ 目录，
# 不复用基础设施包。BUSINESS_IMAGES 用 Dockerfile.<svc> 在仓库根 build。
PROJECT_IMAGE_PREFIX="omcgo"
BUSINESS_IMAGES=( app acs worker web )
