# OMC 离线交付包 — 构建配置
# 被 build-images.sh 与 build-release.sh 共同以 `source` 读取（bash 语法）。

# ── 版本号（基础设施与项目各自独立，均为纯 semver，从 0.0.1 起步）──────────
# 项目与基础设施是【两个独立交付包】，各自维护版本号，互不耦合：
# · 基础设施版本 INFRA_VERSION —— 基础设施包（Docker 引擎 + 基础镜像）的版本。
#   基础设施不常变，手动维护；每次调整下方镜像清单或 Docker 版本后递增一次
#   （如 0.0.1 → 0.0.2）。build-images.sh 用它命名 omc-infra-<版本>-<架构> 包。
# · 项目基线版本 RELEASE_BASE_VERSION —— build-release.sh 不带 -v 时，自动版本
#   = ${RELEASE_BASE_VERSION}-<构建时间戳>（小版本）；发大版本用 -v 手动指定。
# 当前处于测试阶段，两者都从 0.0.1 起步，不从 1.0.0 起。
INFRA_VERSION="100.0.0"   # 0.2.2: 基础镜像全部固化精确版本（postgres 16.14 / redis 7.4.9 / nats 2.12.11 / nginx 1.31.2 / MinIO 改 alpine/minio 固定 RELEASE），消除 latest/滚动 tag 漂版；改镜像必重建 infra 包
RELEASE_BASE_VERSION="100.0.0"

# 发布渠道（阶段标识）：test = 测试阶段 / release = 正式发布。
# 决定项目交付包文件名前缀：
#   test    → omc-test-<版本>-<架构>.tar.xz
#   release → omc-release-<版本>-<架构>.tar.xz
# 命令行 build-release.sh --channel <test|release> 可临时覆盖本默认值。
RELEASE_CHANNEL="test"

# 目标架构（仅 amd64）。
#
# ⚠️ 当前发布工具链【只支持 amd64】。原因：
#   1. 交付目标设备全为 amd64 服务器（运营商内网常见硬件型号）
#   2. arm64 跨架构构建在 amd64 host 上要额外拉镜像 + 占双倍磁盘
#      （双架构全栈 ~40GB，与紧凑 /var 分区频繁冲突）
#   3. 运维侧未对 arm64 交付包做过验证
#
# build-images.sh / build-release.sh / download-docker.sh 已加 amd64-only 校验。
# 若未来要重启 arm64 支持：
#   a) 改本行回 ARCHES="amd64 arm64"
#   b) 移除三个脚本里 "仅支持 amd64" 的 die 校验
#   c) 准备 ≥ 40GB Docker 数据盘
#   d) 在 arm64 目标设备上完整跑一次 deploy.sh + healthcheck.sh 验证
ARCHES="amd64"

# Docker 默认网桥规划。只有现场业务网与该地址冲突时，才需要在 deploy/.env
# 或安装命令环境中填写客户自定义的 DOCKER_BIP。
DOCKER_BIP_DEFAULT="10.240.0.1/16"

# 交付包压缩方式（减小文件体积）：
#   xz   —— 默认，压缩率最高、解压端通用（xz 几乎所有 Linux 自带）
#   gzip —— 压缩快、体积稍大
#   zstd —— 快且小，但解压端需安装 zstd
PKG_COMPRESS="xz"

# ── Docker 引擎离线包（由 download-docker.sh 下载 → docker-cache/）──────
# 运维侧用交付包内 install-docker.sh + 此包离线安装 Docker。不常变更。
# 模板中的 {arch} 由 download-docker.sh 替换为 Docker 官方静态目录名：
#   amd64 → x86_64    arm64 → aarch64
DOCKER_VERSION="29.5.0"

# Docker Compose v2 离线版本 —— 静态二进制（github.com/docker/compose 项目），
# 与 Docker 引擎独立维护。download-docker.sh 下载到 docker-cache/<arch>/，
# build-images.sh 拷入交付包 docker/；install-docker.sh 已自动检测同目录
# docker-compose 二进制并安装到 /usr/local/lib/docker/cli-plugins/，
# 之后 `docker compose ...` 子命令即可用。
# 国内代理：ghproxy 网关（github raw 国内常被墙）。模板中的 {arch} 替换为：
#   amd64 → x86_64    arm64 → aarch64
COMPOSE_VERSION="v2.27.0"
# 下载镜像源列表——download-docker.sh 会依次尝试，第一个联通并下载成功的就采用。
# 如果全部失败 → 脚本报错退出。
# {arch} 替换： amd64 → x86_64 ； arm64 → aarch64
# 调整顺序：把你环境下最稳的源置顶即可。
COMPOSE_URL_TEMPLATES=(
  # DaoCloud 的 GitHub 加速，国内带宽充足、近期稳定
  "https://files.m.daocloud.io/github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # GitMirror 社区节点
  "https://hub.gitmirror.com/https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # ghproxy 官方域（原 mirror.ghproxy.com 已不稳）
  "https://ghproxy.com/https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # kkgithub 镜像（逆向代理 github.com 资源路径不变）
  "https://kkgithub.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
  # GitHub 原站（可直连环境兑底）
  "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-{arch}"
)
# 兼容旧名：老脚本仍读 COMPOSE_URL_TEMPLATE（单条）
COMPOSE_URL_TEMPLATE="${COMPOSE_URL_TEMPLATES[0]}"

# Docker Buildx v0.x 离线版 —— 静态二进制（github.com/docker/buildx 项目）。
# Docker 23+ 起 BuildKit 被拆出 docker 并以 buildx CLI 插件形式提供，
# 不装 buildx 则 docker build 在 BuildKit 开启时报：“buildx component is missing”。
# 交付包内以固定名 docker-buildx 存放，install-docker.sh 同目录检测即装。
# {arch} 替换： amd64 → amd64 ；arm64 → arm64 （注意：buildx 资产名各架构字段为
#   linux-amd64 / linux-arm64，与 Docker tgz 的 x86_64/aarch64 不同）
BUILDX_VERSION="v0.18.0"
BUILDX_URL_TEMPLATES=(
  # DaoCloud GitHub 加速
  "https://files.m.daocloud.io/github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-{arch}"
  # GitMirror
  "https://hub.gitmirror.com/https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-{arch}"
  # ghproxy
  "https://ghproxy.com/https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-{arch}"
  # kkgithub
  "https://kkgithub.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-{arch}"
  # GitHub 原站兑底
  "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-{arch}"
)

# 下载地址：按构建机所在网络环境，下面【只启用一行】，其余保持注释。
# （release.conf 由 bash source，多行未注释时以最后一行为准 —— 请确保只放开一行。）
#
#   国内（默认）—— 阿里云镜像，国内可直连：
DOCKER_URL_TEMPLATE="https://mirrors.aliyun.com/docker-ce/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
#   国外环境 —— Docker 官方源（国内常被网络干扰，国外/可直连环境用这个）：
# DOCKER_URL_TEMPLATE="https://download.docker.com/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
#   国内备选 —— 清华大学镜像：
# DOCKER_URL_TEMPLATE="https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/static/stable/{arch}/docker-${DOCKER_VERSION}.tgz"
#
# 注意：先确认所选 DOCKER_VERSION 在该源确实存在（浏览目录页即可），否则会 404。

# ── 基础设施 Docker 镜像（由 build-images.sh 使用，不常变更）────────────
# ⚠️ 重要：下方镜像【已全部固化到精确版本】，请勿改回 latest 或滚动 tag（如 redis:7-alpine、
#          nginx:alpine）——滚动 tag 会让不同时间/不同机器构建拉到不同实际镜像，交付包不可复现
#          （体积、image ID 都不一致，曾踩坑）。需升级时只改成另一个精确版本，别用浮动 tag。
#          这些值同时写入交付包 deploy/.env，供 docker-compose 引用。
#          每次改动这里的镜像版本，记得同步递增上面的 INFRA_VERSION。
#
# ── 两个 PostgreSQL 实例的镜像（KPI/时序物理分离，与 dev compose 一致）──────
# · IMAGE_POSTGRES      —— 主库（业务数据：设备/RBAC/配置/字典…）。时序分离后主库
#   【无超表、不建 timescaledb 扩展】，consolidated seed 也已 timescaledb-free（已核：
#   migrations/seed/ 无任何 timescaledb 引用），故主库用纯 PostgreSQL【更轻】（272MB vs 1.15GB）。
# · IMAGE_POSTGRES_TSDB —— 时序库 postgres-tsdb（PM/KPI 超表/告警历史/MR/trace）。
#   【必须】是 TimescaleDB，且【固定精确版本】不用 latest-pg16 浮动 tag：migrations/tsdb
#   的超表 catalog 与该版本绑定，浮动 tag 漂版会导致 catalog schema 不一致报错。
#   重新生成 tsdb schema/dump 时同步改本行 tag。
# ⚠️ 升级注意：存量【用 timescaledb 镜像初始化过】的主库卷（本次拆分前的老 release）
#    直接换 postgres:16-alpine 会因卷内 shared_preload_libraries='timescaledb' 启动 FATAL；
#    需先剥离 timescaledb（DROP EXTENSION + 清 conf）或重建主库卷。详见运维手册。
# 每次改动这里的镜像版本，记得同步递增上面的 INFRA_VERSION。
IMAGE_POSTGRES="postgres:16.14-alpine3.23"
IMAGE_POSTGRES_TSDB="timescale/timescaledb:2.25.2-pg16"
IMAGE_REDIS="redis:7.4.9-alpine"
IMAGE_NATS="nats:2.12.11-alpine3.22"
# ⚠️ MinIO 用第三方仓库 alpine/minio（非官方 minio/minio）：官方社区版 2025 起移除 Web Console，
#    alpine/minio 保留 console（install.sh 提示运维访问 :9001）。RELEASE tag 已固化，勿改回 latest。
IMAGE_MINIO="alpine/minio:RELEASE.2025-10-15T17-29-55Z"
IMAGE_NGINX="nginx:1.31.2-alpine"

INFRA_IMAGES=(
  "$IMAGE_POSTGRES"
  "$IMAGE_POSTGRES_TSDB"
  "$IMAGE_REDIS"
  "$IMAGE_NATS"
  "$IMAGE_MINIO"
  "$IMAGE_NGINX"
)

# ── 监控栈各镜像的独立变量（单一真值源）────────────────────────────────
# 下方 MONITORING_IMAGES 数组（build-images.sh 打包拉取）与 build-release.sh 写入
# deploy/.env（compose 模板引用）均取这一组变量，无需再手工两处保持一致。
# 用 ${VAR:-默认} 支持环境覆盖：国内构建机直连 gcr.io 超时时（registry-mirrors 仅代理
# docker.io，不管 gcr.io），构建前 export 覆盖为可达镜像，对打包与 compose 同时生效，例如：
#   export IMAGE_CADVISOR=gcr.m.daocloud.io/cadvisor/cadvisor:v0.55.1
#   bash build-images.sh   # / build-release.sh
IMAGE_PROMETHEUS="${IMAGE_PROMETHEUS:-prom/prometheus:v2.51.0}"
IMAGE_ALERTMANAGER="${IMAGE_ALERTMANAGER:-prom/alertmanager:v0.27.0}"
IMAGE_GRAFANA="${IMAGE_GRAFANA:-grafana/grafana:10.4.0}"
IMAGE_LOKI="${IMAGE_LOKI:-grafana/loki:3.0.0}"
IMAGE_TEMPO="${IMAGE_TEMPO:-grafana/tempo:2.5.0}"
IMAGE_OTELCOL="${IMAGE_OTELCOL:-otel/opentelemetry-collector-contrib:0.103.0}"
IMAGE_NATS_EXPORTER="${IMAGE_NATS_EXPORTER:-natsio/prometheus-nats-exporter:0.15.0}"
IMAGE_NGINX_EXPORTER="${IMAGE_NGINX_EXPORTER:-nginx/nginx-prometheus-exporter:1.3.0}"
IMAGE_NODE_EXPORTER="${IMAGE_NODE_EXPORTER:-prom/node-exporter:v1.8.2}"
# cAdvisor 默认使用 DaoCloud 镜像站，构建机和目标机需使用同一完整引用。
IMAGE_CADVISOR="${IMAGE_CADVISOR:-gcr.m.daocloud.io/cadvisor/cadvisor:v0.55.1}"

# ── 监控栈镜像（build-images.sh 默认即含；--infra-only 可关闭）──────────
# 含监控栈本体 + 基础服务 exporter。
# v2 起 build-images.sh 默认拉取并打包本组镜像；运维侧若不启用监控栈，可在
# 构建侧用 --infra-only 关闭；老调用方传 --with-monitoring 仍兼容（no-op + 提示）。
# T-0155 Phase 2b: postgres-exporter / redis-exporter 已下线，由 otelcol
# 原生 postgresqlreceiver / redisreceiver 直连数据库采集替代。
# nats-exporter 保留（otelcol 无原生 NATS receiver）；minio 自带 /metrics。
# exporter tag 发布前同样需固化校验。
MONITORING_IMAGES=(
  "$IMAGE_PROMETHEUS"
  "$IMAGE_ALERTMANAGER"
  "$IMAGE_GRAFANA"
  "$IMAGE_LOKI"
  # promtail 已由 otelcol filelog receiver 替代（T-0155 Phase 3），下线
  "$IMAGE_TEMPO"
  "$IMAGE_OTELCOL"
  "$IMAGE_NATS_EXPORTER"
  # nginx 入口指标 + 主机/容器资源指标 exporter
  "$IMAGE_NGINX_EXPORTER"
  "$IMAGE_NODE_EXPORTER"
  "$IMAGE_CADVISOR"
)

# ── 业务镜像（项目交付包专属，build-release.sh docker build + docker save）─
# 镜像 tag 形如 omcgo/<svc>:<project_version>，与项目版本一一对应；
# 每次发版重打入 omc-<channel>-<version>-<arch>.tar.xz 内的 images/ 目录，
# 不复用基础设施包。BUSINESS_IMAGES 用 Dockerfile.<svc> 在仓库根 build。
PROJECT_IMAGE_PREFIX="omcgo"
BUSINESS_IMAGES=( app acs worker web )
