# OMC 业务容器 —— 内网离线部署用（migrate / seed / app / acs / worker）
#
# 镜像 tag 来自同目录 .env（由 build-release.sh 依 release.conf 生成）；交付包
# 内 images/business-images-<版本>-<架构>.tar 由 install.sh 一次性 docker load。
#
# 与 docker-compose.infra.yml 共用同一个 docker compose project（install.sh 用
# `-p omcgo -f docker-compose.infra.yml -f docker-compose.app.yml ...` 拉起），
# 走 docker network 内部 service 名互联（postgres / redis / nats / minio / acs）。
#
# 实例配置 /opt/omc/etc/{svc}.prod.yaml 以 bind mount 方式覆盖镜像内 /etc/omcgo/
# 的同名默认 yaml；运维改密 / TLS / SMTP 等修改 /opt/omc/etc/ 下文件即可，无需
# 重打镜像。日志写到 /opt/omc/run/logs/<svc>/。

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge

services:
  # ── 数据库迁移（首次部署 + 每次升级都跑；幂等）────────────────────────
  #   使用 network_mode: "service:postgres" 共享 postgres 网络命名空间，
  #   127.0.0.1:5432 即 postgres 进程本身——不经 DNS、不经 NAT、零跳转。
  migrate-schema:
    image: ${IMAGE_APP}
    restart: "no"
    network_mode: "service:postgres"
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
    entrypoint: ["omcgo-migrate"]
    command:
      - "--dsn"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}?sslmode=disable"
      - "--path"
      - "/etc/omcgo/migrations"
      - "up"
    # 一次性迁移任务：限额防失控，无需 stop_grace_period（自行退出）
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── 种子数据迁移（goose SQL seed，migrations/seed/，70 个 .sql）─────────
  #   独立 GOOSE_TABLE=goose_db_version_seed 避免与主 DDL 撞号
  #   （两个目录都有 000001/000002...，但版本表分开追踪不冲突）。
  #   覆盖：内置角色/admin 用户/role_menus/role_api_permissions/菜单 seed/
  #         KPI 字典/告警库/MML 命令树/standard_params 等 70 条种子。
  #   必须在 migrate-schema 之后跑（依赖 DDL 已建表）。
  migrate-seed-sql:
    image: ${IMAGE_APP}
    restart: "no"
    network_mode: "service:postgres"
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
      GOOSE_TABLE: "goose_db_version_seed"
    entrypoint: ["omcgo-migrate"]
    command:
      - "--dsn"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}?sslmode=disable"
      - "--path"
      - "/etc/omcgo/migrations/seed"
      - "up"
    # 一次性 seed 任务：限额防失控，无需 stop_grace_period（自行退出）
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-schema:
        condition: service_completed_successfully

  # 注：旧 migrate-seed (omcgo-seed JSON) 容器已下线，所有种子数据收敛进
  #     migrations/seed/，由上方 migrate-seed-sql 统一应用。详见 commit 日志
  #     "fix(release): 接通 migrations/seed/" + "refactor(seed): 下线 JSON 双轨"。

  # ── 业务进程：app（HTTP API + gRPC）───────────────────────────────────
  app:
    image: ${IMAGE_APP}
    restart: unless-stopped
    # 与 Go 端 shutdown_timeout(30s) 对齐：留足 GracefulShutdown 关 HTTP/gRPC/连接池
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_ENV: ${OMCGO_ENV}
      OMCGO_SERVICE: app
      # 配置凭据单一真值源 = deploy/.env；app.prod.yaml 用 ${VAR} 引用，Load() 解析前展开。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OMCGO_JWT_SECRET: ${OMCGO_JWT_SECRET}
      OMC_SHARED_SECRET: ${OMC_SHARED_SECRET}   # TR-069 ConnReq/STUN 共享密钥，见 deploy/.env
      OMC_PUBLIC_HOST: ${OMC_PUBLIC_HOST}   # 本机对外 IP（基站可达），见 deploy/.env
    ports:
      - "127.0.0.1:9091:9091"        # metrics（Prometheus 经 docker network 抓取，外网不暴露）
    volumes:
      # 宿主实例配置覆盖镜像内默认值（/etc/omcgo/app.prod.yaml）
      - /opt/omc/etc/app.prod.yaml:/etc/omcgo/app.prod.yaml:ro
      # 日志卷（promtail / otelcol filelog 同样路径采集）
      - /opt/omc/run/logs/app:/run/logs/app
      # 三库导入XML重构 Phase 2(D1/D2):整个 data 目录外置到宿主 /opt/omc/data,
      # bind-mount(RW)进容器;镜像不再 COPY data。install.sh 首次播种随包 builtin 基线,
      # 升级"现网赢、新版补充"反向合并 —— 运维上传的自定义 XML + .custom sidecar 不丢。
      - /opt/omc/data:/etc/omcgo/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-seed-sql:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - omcgo-net

  # ── 业务进程：acs（TR-069 长连接）──────────────────────────────────────
  acs:
    image: ${IMAGE_ACS}
    restart: unless-stopped
    # 与 Go 端 shutdown_timeout(30s) 对齐
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_ENV: ${OMCGO_ENV}
      OMCGO_SERVICE: acs
      # 配置凭据单一真值源 = deploy/.env；acs.prod.yaml 用 ${VAR} 引用，Load() 解析前展开。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OMC_SHARED_SECRET: ${OMC_SHARED_SECRET}   # TR-069 ConnReq/STUN 共享密钥，见 deploy/.env
      OMC_PUBLIC_HOST: ${OMC_PUBLIC_HOST}   # 本机对外 IP（基站可达），见 deploy/.env
    ports:
      - "7547:7547"                  # CPE → ACS（HTTP，TR-069 标准端口）
      - "7557:7557"                  # 内部 connection-request 接口
      - "127.0.0.1:9095:9090"        # metrics（容器内 9090，宿主侧 9095 让出 9090 给 prometheus）
    volumes:
      - /opt/omc/etc/acs.prod.yaml:/etc/omcgo/acs.prod.yaml:ro
      - /opt/omc/run/logs/acs:/run/logs/acs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-seed-sql:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - omcgo-net

  # ── 业务进程：worker（异步任务消费者）──────────────────────────────────
  worker:
    image: ${IMAGE_WORKER}
    restart: unless-stopped
    # 与 Go 端 shutdown_timeout(30s) 对齐
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768m
        reservations:
          cpus: "0.5"
          memory: 384m
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_ENV: ${OMCGO_ENV}
      OMCGO_SERVICE: worker
      # 配置凭据单一真值源 = deploy/.env；worker.prod.yaml 用 ${VAR} 引用，Load() 解析前展开。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OMC_PUBLIC_HOST: ${OMC_PUBLIC_HOST}   # 本机对外 IP（基站可达）：worker 据此生成 PM 上传 URL，见 deploy/.env
    ports:
      - "127.0.0.1:9092:9092"        # metrics
    volumes:
      - /opt/omc/etc/worker.prod.yaml:/etc/omcgo/worker.prod.yaml:ro
      - /opt/omc/run/logs/worker:/run/logs/worker
      # 三库导入XML重构 Phase 2:整个 data 目录外置 bind-mount(RW),与 app 文件视图一致
      # (worker 跑 backup_cleanup 清孤儿 sidecar / 过期备份,需可写)。
      - /opt/omc/data:/etc/omcgo/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-seed-sql:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - omcgo-net
