# OMC 业务容器 —— 内网离线部署用（migrate / seed / app / acs / worker）
#
# 镜像 tag 来自同目录 .env（由 build-release.sh 依 release.conf 生成）；交付包
# 内 images/business-images-<版本>-<架构>.tar 由 install.sh 一次性 docker load。
#
# 与 docker-compose.infra.yml 共用同一个 docker compose project（install.sh 用
# `-p omcgo -f docker-compose.infra.yml -f docker-compose.app.yml ...` 拉起），
# 走 docker network 内部 service 名互联（postgres / redis / nats / minio / acs）。
#
# 实例配置 /opt/omc/etc/{svc}.prod.yaml 以 bind mount 方式覆盖镜像内 /etc/omcgo/
# 的同名默认 yaml；运维改密 / TLS / SMTP 等修改 /opt/omc/etc/ 下文件即可，无需
# 重打镜像。日志写到 /opt/omc/run/logs/<svc>/。

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge

x-omc-json-log: &omc-json-log
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  # ── GPV RPC 无损升级接力（升级/重启 app 前一次性运行）────────────────
  gpv-handoff:
    image: ${IMAGE_APP}
    restart: "no"
    logging: *omc-json-log
    profiles: ["operations"]
    entrypoint: ["omcgo-gpv-handoff"]
    command: ["--config", "/etc/omcgo/app.prod.yaml"]
    environment:
      GPV_PROVISION_QUEUE: "${GPV_PROVISION_QUEUE:-provision-gpv}"
      GPV_RPC_DURABLE: "${GPV_RPC_DURABLE:-device-rpc-gpv}"
      GPV_RPC_SOURCE_CONSUMER: "${GPV_RPC_SOURCE_CONSUMER:-}"
      GPV_ACK_WAIT: "${GPV_ACK_WAIT:-30s}"
      GPV_MAX_DELIVER: "${GPV_MAX_DELIVER:-5}"
      GPV_MAX_ACK_PENDING: "${GPV_MAX_ACK_PENDING:-2000}"
    volumes:
      - /opt/omc/etc/app.prod.yaml:/etc/omcgo/app.prod.yaml:ro
    networks:
      - omcgo-net

  # ── 数据库迁移（首次部署 + 每次升级都跑；幂等）────────────────────────
  #   使用 network_mode: "service:postgres" 共享 postgres 网络命名空间，
  #   127.0.0.1:5432 即 postgres 进程本身——不经 DNS、不经 NAT、零跳转。
  migrate-schema:
    image: ${IMAGE_APP}
    restart: "no"
    logging: *omc-json-log
    network_mode: "service:postgres"
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
    entrypoint: ["omcgo-migrate"]
    command:
      - "--dsn"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}?sslmode=disable"
      - "--path"
      - "/etc/omcgo/migrations"
      - "up"
    # 一次性迁移任务：限额防失控，无需 stop_grace_period（自行退出）
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── 种子数据迁移（goose SQL seed，migrations/seed/，70 个 .sql）─────────
  #   独立 GOOSE_TABLE=goose_db_version_seed 避免与主 DDL 撞号
  #   （两个目录都有 000001/000002...，但版本表分开追踪不冲突）。
  #   覆盖：内置角色/admin 用户/role_menus/role_api_permissions/菜单 seed/
  #         KPI 字典/告警库/MML 命令树/standard_params 等 70 条种子。
  #   必须在 migrate-schema 之后跑（依赖 DDL 已建表）。
  migrate-seed-sql:
    image: ${IMAGE_APP}
    restart: "no"
    logging: *omc-json-log
    network_mode: "service:postgres"
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
      GOOSE_TABLE: "goose_db_version_seed"
    entrypoint: ["omcgo-migrate"]
    command:
      - "--dsn"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}?sslmode=disable"
      - "--path"
      - "/etc/omcgo/migrations/seed"
      - "up"
    # 一次性 seed 任务：限额防失控，无需 stop_grace_period（自行退出）
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-schema:
        condition: service_completed_successfully

  # ── 时序库 schema 迁移（postgres-tsdb 实例，#347）─────────────────────────
  #   把 migrations/tsdb/ 刷到独立 TimescaleDB 实例：建 PM/KPI 超表 + 告警历史 +
  #   MR/trace 时序表 + 影子维度表 + matview。独立 GOOSE_TABLE=goose_db_version_tsdb，
  #   与主库 migrate-schema/seed（不同实例 + 不同版本表）互不影响。
  #   时序库无业务种子（matview 在 schema 内建），故无 migrate-tsdb-seed。
  #   network_mode: service:postgres-tsdb 共享其网络命名空间，127.0.0.1:5432 直连本实例。
  migrate-tsdb-schema:
    image: ${IMAGE_APP}
    restart: "no"
    logging: *omc-json-log
    network_mode: "service:postgres-tsdb"
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
      GOOSE_TABLE: "goose_db_version_tsdb"
    entrypoint: ["omcgo-migrate"]
    command:
      - "--dsn"
      - "postgres://${POSTGRES_TSDB_USER}:${POSTGRES_TSDB_PASSWORD}@127.0.0.1:5432/${POSTGRES_TSDB_DB}?sslmode=disable"
      - "--path"
      - "/etc/omcgo/migrations/tsdb"
      - "up"
    # 一次性迁移任务：限额防失控，无需 stop_grace_period（自行退出）
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres-tsdb:
        condition: service_healthy

  # 注：旧 migrate-seed (omcgo-seed JSON) 容器已下线，所有种子数据收敛进
  #     migrations/seed/，由上方 migrate-seed-sql 统一应用。详见 commit 日志
  #     "fix(release): 接通 migrations/seed/" + "refactor(seed): 下线 JSON 双轨"。

  # ── 业务进程：app（HTTP API + gRPC）───────────────────────────────────
  app:
    image: ${IMAGE_APP}
    restart: unless-stopped
    logging: *omc-json-log
    # 与 Go 端 shutdown_timeout(30s) 对齐：留足 GracefulShutdown 关 HTTP/gRPC/连接池
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # 资源限额由 plan-resources.sh 生成的 resources.env 经 --env-file 注入；
          # 缺省对齐 plan-resources.sh medium 档（32核/32G 目标机型），未跑脚本的
          # 部署也有合理开箱起点；机型差异较大仍建议实跑 plan-resources.sh 精确适配。
          cpus: "${APP_CPUS:-2}"
          memory: "${APP_MEM:-1536m}"
        reservations:
          cpus: "0.5"
          memory: 512m
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_ENV: ${OMCGO_ENV}
      OMCGO_SERVICE: app
      # 默认完整生产栈启用 tracing；install/svc --skip-monitoring 会显式置 false，
      # 保证没有 otelcol 时回到 Go 端 no-op provider。
      OMCGO_TRACER_ENABLED: "${OMCGO_TRACER_ENABLED:-}"
      OMCGO_API_ENDPOINT_SYNC_TIMEOUT_SECONDS: "${OMCGO_API_ENDPOINT_SYNC_TIMEOUT_SECONDS:-120}"
      # Go 运行时上限（resources.env 注入）。缺省：GOMEMLIMIT off→1382MiB(≈0.9×1536m 内存
      # 默认,软限须 < limits.memory)，把硬 OOM-kill 换成 GC 背压(纯安全网)。GOMAXPROCS 空则
      # Go 1.25 自动按 cgroup CPU 配额推导。
      GOMEMLIMIT: "${APP_GOMEMLIMIT:-1382MiB}"
      GOMAXPROCS: "${APP_GOMAXPROCS:-}"
      # command.get_parameters.response 两条消费链独立限流。显式 start_sequence
      # 用于从旧 consumer AckFloor+1 无损切换；0 表示新 durable 从当前流尾开始。
      GPV_PROVISION_QUEUE: "${GPV_PROVISION_QUEUE:-provision-gpv}"
      GPV_PROVISION_CONCURRENCY: "${GPV_PROVISION_CONCURRENCY:-2}"
      GPV_PROVISION_QUEUE_DEPTH: "${GPV_PROVISION_QUEUE_DEPTH:-256}"
      GPV_RPC_DURABLE: "${GPV_RPC_DURABLE:-device-rpc-gpv}"
      GPV_RPC_START_SEQUENCE: "${GPV_RPC_START_SEQUENCE:-0}"
      GPV_RPC_CONCURRENCY: "${GPV_RPC_CONCURRENCY:-2}"
      GPV_RPC_QUEUE_DEPTH: "${GPV_RPC_QUEUE_DEPTH:-1000}"
      GPV_ACK_WAIT: "${GPV_ACK_WAIT:-30s}"
      GPV_MAX_DELIVER: "${GPV_MAX_DELIVER:-5}"
      GPV_MAX_ACK_PENDING: "${GPV_MAX_ACK_PENDING:-2000}"
      # 配置凭据单一真值源 = deploy/.env；app.prod.yaml 用 ${VAR} 引用，Load() 解析前展开。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 时序库（TsPool）凭据/主机：app dashboard 直查 PM 聚合表 / 影子维度表（#347）。
      POSTGRES_TSDB_USER: ${POSTGRES_TSDB_USER}
      POSTGRES_TSDB_PASSWORD: ${POSTGRES_TSDB_PASSWORD}
      POSTGRES_TSDB_DB: ${POSTGRES_TSDB_DB}
      TSDB_HOST: ${TSDB_HOST}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OMCGO_JWT_SECRET: ${OMCGO_JWT_SECRET}
      OMC_SHARED_SECRET: ${OMC_SHARED_SECRET}   # TR-069 ConnReq/STUN 共享密钥，见 deploy/.env
      OMC_PUBLIC_HOST: ${OMC_PUBLIC_HOST}   # 本机对外 IP（基站可达），见 deploy/.env
      POSTGRES_DATA_PATH: "${POSTGRES_DATA_PATH:-}"
      TSDB_DATA_PATH: "${TSDB_DATA_PATH:-}"
      REDIS_DATA_PATH: "${REDIS_DATA_PATH:-}"
      REDIS_PM_DATA_PATH: "${REDIS_PM_DATA_PATH:-}"
      NATS_DATA_PATH: "${NATS_DATA_PATH:-}"
      MINIO_DATA_PATH: "${MINIO_DATA_PATH:-}"
      OMCGO_DOCKER_ROOT_DIR: "${OMCGO_DOCKER_ROOT_DIR:-/var/lib/docker}"
      OMCGO_DOCKER_VOLUME_PREFIX: "${OMCGO_DOCKER_VOLUME_PREFIX:-omcgo}"
      OMCGO_HOST_LOGS_PATH: "${OMCGO_HOST_LOGS_PATH:-/opt/omc/run/logs}"
      OMCGO_HOST_DATA_PATH: "${OMCGO_HOST_DATA_PATH:-/opt/omc/data}"
    ports:
      - "127.0.0.1:9091:9091"        # metrics（Prometheus 经 docker network 抓取，外网不暴露）
    volumes:
      # 宿主实例配置覆盖镜像内默认值（/etc/omcgo/app.prod.yaml）
      - /opt/omc/etc/app.prod.yaml:/etc/omcgo/app.prod.yaml:ro
      # 日志卷（promtail / otelcol filelog 同样路径采集）
      - /opt/omc/run/logs/app:/run/logs/app
      # 三库导入XML重构 Phase 2(D1/D2):整个 data 目录外置到宿主 /opt/omc/data,
      # bind-mount(RW)进容器;镜像不再 COPY data。install.sh 首次播种随包 builtin 基线,
      # 升级"现网赢、新版补充"反向合并 —— 运维上传的自定义 XML + .custom sidecar 不丢。
      - /opt/omc/data:/etc/omcgo/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-seed-sql:
        condition: service_completed_successfully
      # app 连时序库（TsPool）读影子维度 / PM 聚合表；等时序库 schema 就绪。
      migrate-tsdb-schema:
        condition: service_completed_successfully
      redis-core:
        condition: service_healthy
      redis-pm:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - omcgo-net

  # ── 业务进程：acs（TR-069 长连接）──────────────────────────────────────
  acs: &acs-service
    image: ${IMAGE_ACS}
    restart: unless-stopped
    logging: *omc-json-log
    # 2 万设备同步 Inform 波峰会瞬时建立数千条 Nginx→ACS 连接。默认
    # somaxconn=4096 / SYN backlog=2048 会让连接在代理侧超时；显式扩大
    # 容器网络命名空间内的监听队列，与 session.max_concurrent=30000 对齐。
    sysctls:
      net.core.somaxconn: "32768"
      net.ipv4.tcp_max_syn_backlog: "32768"
    # 与 Go 端 shutdown_timeout(30s) 对齐
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # 缺省对齐 plan-resources.sh medium 档（32核/32G 目标机型）；ACS 是 TR-069
          # 长连接最热的组件，2 核在万级并发会话下富余很小。
          cpus: "${ACS_CPUS:-5}"
          memory: "${ACS_MEM:-4g}"
        reservations:
          cpus: "0.5"
          memory: 1g
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_ENV: ${OMCGO_ENV}
      OMCGO_SERVICE: acs
      OMCGO_TRACER_ENABLED: "${OMCGO_TRACER_ENABLED:-}"
      # Go 运行时上限（resources.env 注入）；ACS 堆压力最大，GOMEMLIMIT 价值最高。
      # 缺省(#167) off→3600MiB(≈0.9×4g)。压测实测 1g 在 max_inflight 调大后并发
      # PM 上传缓冲内存需求上升，触发 cgroup OOMKilled 循环重启（RestartCount 短时间
      # 内飙升上百次），故默认下限提到 4g（2026-07-21）。
      GOMEMLIMIT: "${ACS_GOMEMLIMIT:-3600MiB}"
      GOMAXPROCS: "${ACS_GOMAXPROCS:-}"
      # 配置凭据单一真值源 = deploy/.env；acs.prod.yaml 用 ${VAR} 引用，Load() 解析前展开。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 时序库（TsPool）凭据/主机：acs 写 trace_messages 到时序库（#347）。
      POSTGRES_TSDB_USER: ${POSTGRES_TSDB_USER}
      POSTGRES_TSDB_PASSWORD: ${POSTGRES_TSDB_PASSWORD}
      POSTGRES_TSDB_DB: ${POSTGRES_TSDB_DB}
      TSDB_HOST: ${TSDB_HOST}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OMC_SHARED_SECRET: ${OMC_SHARED_SECRET}   # TR-069 ConnReq/STUN 共享密钥，见 deploy/.env
      OMC_PUBLIC_HOST: ${OMC_PUBLIC_HOST}   # 本机对外 IP（基站可达），见 deploy/.env
      POSTGRES_DATA_PATH: "${POSTGRES_DATA_PATH:-}"
      TSDB_DATA_PATH: "${TSDB_DATA_PATH:-}"
      REDIS_DATA_PATH: "${REDIS_DATA_PATH:-}"
      REDIS_PM_DATA_PATH: "${REDIS_PM_DATA_PATH:-}"
      NATS_DATA_PATH: "${NATS_DATA_PATH:-}"
      MINIO_DATA_PATH: "${MINIO_DATA_PATH:-}"
      OMCGO_DOCKER_ROOT_DIR: "${OMCGO_DOCKER_ROOT_DIR:-/var/lib/docker}"
      OMCGO_DOCKER_VOLUME_PREFIX: "${OMCGO_DOCKER_VOLUME_PREFIX:-omcgo}"
      OMCGO_HOST_LOGS_PATH: "${OMCGO_HOST_LOGS_PATH:-/opt/omc/run/logs}"
      OMCGO_HOST_DATA_PATH: "${OMCGO_HOST_DATA_PATH:-/opt/omc/data}"
    ports:
      - "7547:7547"                  # CPE → ACS（HTTP，TR-069 标准端口）
      - "7557:7557"                  # 内部 connection-request 接口
      - "127.0.0.1:9095:9090"        # metrics（容器内 9090，宿主侧 9095 让出 9090 给 prometheus）
    volumes:
      - /opt/omc/etc/acs.prod.yaml:/etc/omcgo/acs.prod.yaml:ro
      - /opt/omc/run/logs/acs:/run/logs/acs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-seed-sql:
        condition: service_completed_successfully
      # acs 写 trace_messages → 时序库；等时序库 schema 就绪后再起。
      migrate-tsdb-schema:
        condition: service_completed_successfully
      redis-core:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      omcgo-net:
        aliases:
          - acs-primary

  # ── ACS 发布接力实例 ────────────────────────────────────────────────────
  # 与正式 acs 同时常驻，并共享 Docker DNS 别名 `acs`。Nginx 的动态 upstream
  # 因而始终至少看到一个可用实例：升级时先把本实例更新并等 /readyz，通过后
  # 才替换正式 acs，消除单实例 stop→start 期间的南向请求超时。
  #
  # 候选实例不发布任何宿主端口（ACS_CANDIDATE_INTERNAL_ONLY），只接收 web
  # 容器经 omcgo-net 转发的请求；7547/7557/9095 仍由正式实例持有，避免端口冲突。
  acs-candidate:
    <<: *acs-service
    ports: []
    volumes:
      - /opt/omc/etc/acs.prod.yaml:/etc/omcgo/acs.prod.yaml:ro
      - /opt/omc/run/logs/acs-candidate:/run/logs/acs
      - /etc/localtime:/etc/localtime:ro
    networks:
      omcgo-net:
        aliases:
          - acs

  # ── 业务进程：worker（异步任务消费者）──────────────────────────────────
  worker:
    image: ${IMAGE_WORKER}
    restart: unless-stopped
    logging: *omc-json-log
    # 与 Go 端 shutdown_timeout(30s) 对齐
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # 缺省 8 核，对齐 plan-resources.sh medium 档（32核/32G 目标机型的 1/4）。
          # 2026-07-23 10000 基站压测：3→5 核使 backlog 峰值下降约31%、排空提升
          # 约35%-45%；继续用 8 核并把 TSDB 提到16核后，预热后吞吐约45-56条/s。
          cpus: "${WORKER_CPUS:-8}"
          memory: "${WORKER_MEM:-1024m}"
        reservations:
          cpus: "0.5"
          memory: 384m
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_ENV: ${OMCGO_ENV}
      OMCGO_SERVICE: worker
      OMCGO_TRACER_ENABLED: "${OMCGO_TRACER_ENABLED:-}"
      # Go 运行时上限（resources.env 注入）；worker PM/MR 解析吃内存，GOMEMLIMIT 兜底 OOM。
      # 缺省 off→921MiB(≈0.9×1024m)。
      GOMEMLIMIT: "${WORKER_GOMEMLIMIT:-921MiB}"
      GOMAXPROCS: "${WORKER_GOMAXPROCS:-}"
      PM_AGGREGATION_ENABLED: "${PM_AGGREGATION_ENABLED:-true}"
      PM_AGGREGATION_CLOSE_GRACE: "${PM_AGGREGATION_CLOSE_GRACE:-12m}"
      PM_AGGREGATION_OUTBOX_BATCH: "${PM_AGGREGATION_OUTBOX_BATCH:-100}"
      PM_AGGREGATION_CONSUMER_CONCURRENCY: "${PM_AGGREGATION_CONSUMER_CONCURRENCY:-16}"
      PM_AGGREGATION_FINALIZE_CONCURRENCY: "${PM_AGGREGATION_FINALIZE_CONCURRENCY:-32}"
      PM_AGGREGATION_MAX_EVENT_BYTES: "${PM_AGGREGATION_MAX_EVENT_BYTES:-8388608}"
      PM_AGGREGATION_WINDOW_TTL: "${PM_AGGREGATION_WINDOW_TTL:-1080h}"
      PM_AGGREGATION_REDIS_V2_WRITE_ENABLED: "${PM_AGGREGATION_REDIS_V2_WRITE_ENABLED:-true}"
      # 传输 Outbox 仅保留短期；可重算源进入 Timescale 压缩超表独立保留。
      PM_AGGREGATION_OUTBOX_RETENTION: "${PM_AGGREGATION_OUTBOX_RETENTION:-24h}"
      PM_AGGREGATION_REPLAY_RETENTION: "${PM_AGGREGATION_REPLAY_RETENTION:-1080h}"
      # 配置凭据单一真值源 = deploy/.env；worker.prod.yaml 用 ${VAR} 引用，Load() 解析前展开。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 时序库（TsPool）凭据/主机：worker PM copy 入库 / KPI 聚合 / 影子维度同步 /
      # 告警历史 retention / trace 写入全部走时序库（#347）。
      POSTGRES_TSDB_USER: ${POSTGRES_TSDB_USER}
      POSTGRES_TSDB_PASSWORD: ${POSTGRES_TSDB_PASSWORD}
      POSTGRES_TSDB_DB: ${POSTGRES_TSDB_DB}
      TSDB_HOST: ${TSDB_HOST}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OMC_PUBLIC_HOST: ${OMC_PUBLIC_HOST}   # 本机对外 IP（基站可达）：worker 据此生成 PM 上传 URL，见 deploy/.env
      POSTGRES_DATA_PATH: "${POSTGRES_DATA_PATH:-}"
      TSDB_DATA_PATH: "${TSDB_DATA_PATH:-}"
      REDIS_DATA_PATH: "${REDIS_DATA_PATH:-}"
      REDIS_PM_DATA_PATH: "${REDIS_PM_DATA_PATH:-}"
      NATS_DATA_PATH: "${NATS_DATA_PATH:-}"
      MINIO_DATA_PATH: "${MINIO_DATA_PATH:-}"
      OMCGO_DOCKER_ROOT_DIR: "${OMCGO_DOCKER_ROOT_DIR:-/var/lib/docker}"
      OMCGO_DOCKER_VOLUME_PREFIX: "${OMCGO_DOCKER_VOLUME_PREFIX:-omcgo}"
      OMCGO_HOST_LOGS_PATH: "${OMCGO_HOST_LOGS_PATH:-/opt/omc/run/logs}"
      OMCGO_HOST_DATA_PATH: "${OMCGO_HOST_DATA_PATH:-/opt/omc/data}"
    ports:
      - "127.0.0.1:9092:9092"        # metrics
    volumes:
      - /opt/omc/etc/worker.prod.yaml:/etc/omcgo/worker.prod.yaml:ro
      - /opt/omc/run/logs/worker:/run/logs/worker
      # 三库导入XML重构 Phase 2:整个 data 目录外置 bind-mount(RW),与 app 文件视图一致
      # (worker 跑 backup_cleanup 清孤儿 sidecar / 过期备份,需可写)。
      - /opt/omc/data:/etc/omcgo/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-seed-sql:
        condition: service_completed_successfully
      # worker 连时序库（TsPool）：PM copy 入库 / KPI 聚合 / 影子维度同步 / 告警历史
      # retention / trace 写入，等时序库 schema 就绪。
      migrate-tsdb-schema:
        condition: service_completed_successfully
      redis-core:
        condition: service_healthy
      redis-pm:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - omcgo-net

  # 一次性运维入口。默认 dry-run；仅在停 worker 并核对报告后显式用
  # `docker compose --profile operations run --rm pm-redis-migrate --replace`
  # 执行冲突覆盖。profile 防止正常 install/up 自动启动。
  pm-redis-migrate:
    image: ${IMAGE_WORKER}
    profiles: ["operations"]
    restart: "no"
    logging: *omc-json-log
    entrypoint: ["omcctl", "pm-redis", "migrate"]
    command: ["--dry-run"]
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-8}"
          memory: "${WORKER_MEM:-1024m}"
    depends_on:
      redis-core:
        condition: service_healthy
      redis-pm:
        condition: service_healthy
    networks:
      - omcgo-net
