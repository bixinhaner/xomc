# OMC 监控栈 —— 内网离线部署用（prometheus / alertmanager / grafana / loki /
# tempo / otelcol / nats-exporter）
#
# 与 docker-compose.{infra,app,web}.yml 共用同一 docker compose project（install.sh
# 用 `-p omcgo -f ... -f docker-compose.monitoring.yml ...` 一次性拉起），走
# docker network 内 service 名互联（从 app/acs/worker 容器的 OTel SDK 连
# otelcol:4317；prometheus 从各容器 :9091/:9090/:9092 抓 metrics）。
#
# 监控配置文件（prometheus.yml / alertmanager.yml / grafana provisioning /
# loki / tempo / otelcol）由 build-release.sh 从 deployments/monitoring/ 拷入
# 同目录 monitoring/，本 compose 以 bind mount 方式挂入对应容器。
#
# Grafana 默认账号 admin/admin —— 部署前请改 .env 的 GRAFANA_ADMIN_PASSWORD。

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.18.0.0/16
          gateway: 173.18.0.1

x-omc-json-log: &omc-json-log
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  prometheus:
    image: ${IMAGE_PROMETHEUS}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheusdata:/prometheus
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      # T-0155 Phase 2b: 接收 otelcol prometheusremotewrite 推送的 pg/redis 指标
      - "--web.enable-remote-write-receiver"
    # TSDB head WAL 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      # 预算对齐 loki/tempo（start_period 30s + retries 10）：升级窗口 10 个监控容器
      # 同时 --force-recreate 叠加 cadvisor 启动抖动，宿主负载尖峰下 5s 的 wget 探针
      # 可能连续超时；预算过紧会把正常启动误判为 unhealthy，连锁拖死 grafana/otelcol
      # 依赖并使 install 中止（线上事故：prometheus 实际 16s 就绪却被判死）。
      retries: 10
      start_period: 30s
    networks:
      - omcgo-net

  alertmanager:
    image: ${IMAGE_ALERTMANAGER}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      # 单实例部署：禁用 HA 集群(gossip mesh)。否则启动时推断不到私有 advertise IP
      # 会 "unable to initialize gossip mesh" 崩溃重启。空值 = 关闭 HA。
      - "--cluster.listen-address="
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omcgo-net

  grafana:
    image: ${IMAGE_GRAFANA}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3030:3000"   # 宿主 3030 → 容器 3000；避开常见 :3000 占用
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - omcgo-net

  # ── 日志栈：Loki（存储 + 查询）；采集由 otelcol filelog receiver 接管 ──
  loki:
    image: ${IMAGE_LOKI}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
      - /etc/localtime:/etc/localtime:ro
    command: ["-config.file=/etc/loki/loki-config.yml"]
    # chunk flush 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - omcgo-net

  loki-size-retention:
    image: ${IMAGE_LOKI}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      LOKI_URL: http://loki:3100
      LOKI_MAX_BYTES: "${LOKI_MAX_BYTES:-10737418240}"
      LOKI_RETENTION_SECONDS: "${LOKI_RETENTION_SECONDS:-604800}"
      LOKI_CHECK_INTERVAL_SECONDS: "${LOKI_CHECK_INTERVAL_SECONDS:-600}"
      LOKI_DELETE_COOLDOWN_SECONDS: "${LOKI_DELETE_COOLDOWN_SECONDS:-7200}"
      LOKI_TIMEZONE_FILE: /var/lib/omcgo/timezone/system-timezone
    volumes:
      - lokidata:/loki
      - omcgo-timezone:/var/lib/omcgo/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ./monitoring/loki/loki-size-retention.sh:/usr/local/bin/loki-size-retention.sh:ro
    entrypoint: ["sh"]
    command: ["/usr/local/bin/loki-size-retention.sh"]
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64m
        reservations:
          cpus: "0.05"
          memory: 16m
    networks:
      - omcgo-net

  # ── Trace 栈：OpenTelemetry Collector + Grafana Tempo（T-0155）──────────
  # 数据流：app/acs/worker (OTel SDK, OTLP gRPC) → otelcol:4317 → tempo:4317
  #         同时 otelcol filelog 采集 /run/logs → loki，pg/redisreceiver → prometheus
  otelcol:
    image: ${IMAGE_OTELCOL}
    # otel-contrib 镜像默认以非 root(UID 10001)运行；而业务进程(root)经 lumberjack
    # 写的 /run/logs/<svc>/<svc>.log 是 0600(仅 root 可读)。非 root 的 otelcol 读不了
    # 业务日志 → Loki 里只有 nginx(其日志 0644 可读)。以 root 跑即可读全部业务日志，
    # 让 Grafana 的 service_name 出现 omcgo-app/acs/worker。
    user: "0:0"
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
      # postgresqlreceiver 连主库/tsdb 库用的凭据（config.yaml 里用 ${env:VAR} 引用）；
      # 之前 config.yaml 硬编码了 dev 默认密码 omcgo123，生产环境走随机强密码时
      # 每 30s scrape 一次全部认证失败（线上巡检发现），必须从 .env 同源注入。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TSDB_PASSWORD: ${POSTGRES_TSDB_PASSWORD}
    ports:
      # Collector 镜像是 distroless；由宿主 healthcheck.sh 通过 health_check
      # extension 外部探测，只绑定回环，不对生产网络暴露。
      - "127.0.0.1:13133:13133"
    volumes:
      - ./monitoring/otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # 采集业务容器的日志：与 app/acs/worker 容器 /run/logs 挂载源同路径
      - /opt/omc/run/logs:/run/logs:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    # otelcol-contrib 是 distroless 镜像，无 shell/wget；不配置容器内 CMD
    # healthcheck。deploy/healthcheck.sh 从宿主探测 :13133 health extension。
    depends_on:
      tempo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      redis-pm:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - omcgo-net

  tempo:
    image: ${IMAGE_TEMPO}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
      # 块压缩峰值受 Go 软限约束；硬限额另留 mmap、栈和内核记账余量。
      GOMEMLIMIT: "768MiB"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
      - /etc/localtime:/etc/localtime:ro
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # trace block flush 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - omcgo-net

  # ── 基础服务 exporter：nats-exporter（minio 自带 /metrics；pg/redis 由 otelcol 直采）
  nats-exporter:
    image: ${IMAGE_NATS_EXPORTER}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    command: ["-varz", "-jsz=all", "-connz", "http://nats:8222"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 32m
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - omcgo-net

  # ── nginx 指标：抓 web:8090/stub_status，暴露并发 / QPS（prometheus job=nginx）─
  # 不 depends_on web（web 在 docker-compose.web.yml，--skip-web 时不存在）：
  # web 未起时 exporter 仅抓取失败，web 起来后自动恢复，不阻塞监控栈。
  nginx-exporter:
    image: ${IMAGE_NGINX_EXPORTER}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    command: ["--nginx.scrape-uri=http://web:8090/stub_status"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 32m
    networks:
      - omcgo-net

  # ── 主机资源指标：node-exporter（CPU / 内存 / 磁盘 / 负载，job=node :9100）──
  node-exporter:
    image: ${IMAGE_NODE_EXPORTER}
    restart: unless-stopped
    logging: *omc-json-log
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /opt/omc/run/monitoring:/textfile:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 32m
    networks:
      - omcgo-net

  # ── 容器资源指标：cAdvisor（各容器 CPU / 内存 / 网络 / 磁盘，job=cadvisor :8080）─
  cadvisor:
    image: ${IMAGE_CADVISOR}
    restart: unless-stopped
    logging: *omc-json-log
    # Keep only the bounded Compose service label for Prometheus service-level
    # panels; do not export arbitrary container labels.
    command:
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m
    networks:
      - omcgo-net

volumes:
  prometheusdata:
  alertmanagerdata:
  grafanadata:
  lokidata:
  tempodata:
