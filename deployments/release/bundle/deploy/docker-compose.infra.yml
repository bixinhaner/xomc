# OMC 基础设施 —— 内网离线部署用（postgres / redis / nats / minio）
#
# 镜像由 `docker load` 离线导入；镜像标签来自同目录 .env（由 build-release.sh
# 依 release.conf 生成，与 docker save 的镜像一致，勿手改成不一致的值）。
#
# 【全 docker compose 部署】：业务容器（app / acs / worker / web）与本文件中
# 的基础服务同处一个 docker compose project（install.sh -p omcgo 拉起），
# 走 docker network 内部 service 名互联（postgres / redis / nats / minio）。
#
# 【端口绑定策略】2026-05-29 用户决策：基础服务对内网开放(0.0.0.0)而非仅
# 本机回环(127.0.0.1)。受影响端口：postgres 5432 / redis 6379 / nats 4222 /
# minio 9000+9001。原因：内网其它服务器需要直接访问这些服务（数据中台
# 拉数据 / 监控集成 / 备份回填 / 容灾切换 / 跨机调试）。
# NATS 监控端口 8222 保持 127.0.0.1（运维 HTTP 仪表盘，无客户端通信需求）。
#
# ⚠️ 安全要求：以 0.0.0.0 绑定后,内网任何主机均可触达,**必须**：
#    1. 部署前修改 POSTGRES_PASSWORD / MINIO_ROOT_USER /
#       MINIO_ROOT_PASSWORD 为强口令,并与 /opt/omc/etc/*.prod.yaml 同步
#    2. Redis 当前无密码 — 仅在受信任内网部署可接受；公网 / DMZ 必须
#       配 `--requirepass` 并同步 etc/*.prod.yaml 的 redis.password
#    3. 防火墙 / 安全组在出公网前 deny 这些端口（5432 / 6379 / 4222 /
#       9000 / 9001）

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge
    # 公司内网约定:Docker 网络落在 173.x,避开公司 172.x 内网(172.17/172.24… 仍在扩张)。
    # omcgo-net 固定锁 173.18.0.0/16;docker0=173.17、自动池=173.19 由 install-docker.sh
    # 写入 daemon.json,三段互不重叠。不锁 subnet 时 docker 会自动分配到 172.x,撞内网。
    # ★ 本网段在 infra.yml 统一锁定;app/web/monitoring 三个 compose 文件不重复声明
    #   subnet(它们与本文件一起 -f 传入,compose 合并后以此处为准)。换段改这一处即可。
    ipam:
      driver: default
      config:
        - subnet: 173.18.0.0/16
          gateway: 173.18.0.1

x-omc-json-log: &omc-json-log
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: ${IMAGE_POSTGRES}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                        # 内网开放(0.0.0.0),供其它服务器直连
    # 调优参数由 resources.env 注入（plan-resources.sh 据 POSTGRES_MEM 联动派生）；缺省值(#167 Step 0)
    # 已按 max_connections=300 同源调到安全档，使不跑 plan-resources.sh 的部署也默认不 OOM：
    # max_connections 300（= main #131 修复）覆盖 app(db60+tsdb40)+worker(db25+tsdb25)+acs(db30)
    # 池总和 ~180 + exporter + psql + 余量；POSTGRES_MEM 缺省 7g（下方）容 300 连接×~10MB+余量；
    # shared_buffers≈25%、effective_cache_size≈70% 按 7g 配。多副本横扩前应前置 pgbouncer。
    command:
      - "postgres"
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-300}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-1792MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-5GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "max_wal_size=${PG_MAX_WAL_SIZE:-1GB}"
      - "-c"
      - "wal_compression=on"
    # 有状态服务给足 60s：checkpoint flush + WAL 落盘，避免被 SIGKILL 截断触发 recovery。
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # resources.env 注入。缺省(#167 Step 0)：mem 2g→7g 容 max_connections=300(每连接
          # ~8-10MB,300×~10MB=3g + shared_buffers 1.8g + 余量)，与上方 -c 调优同源。
          # CPU 缺省 10 核，对齐 plan-resources.sh medium 档（32核/32G 目标机型，约总核数
          # 1/3）。2026-07-23 10000 基站压测中，4 核配额时主库约 406% 持续触顶；
          # 调至 10 核后与 TSDB/worker 配合，PM 队列约一分钟清零。
          cpus: "${POSTGRES_CPUS:-10}"
          memory: "${POSTGRES_MEM:-7g}"
        reservations:
          cpus: "0.5"
          memory: 512m
    volumes:
      - ${POSTGRES_DATA_PATH:-pgdata}:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # postgres-tsdb：第二个 TimescaleDB 实例 —— 物理隔离的时序库（TsPool）。承载 PM/KPI
  # 超表、告警历史、MR/trace 时序表 + pm_files + 影子维度表；业务数据仍留主库 postgres。
  # 用【独立】镜像 ${IMAGE_POSTGRES_TSDB}（TimescaleDB，pin 2.25.2-pg16，超表 catalog 绑版）——
  # 主库已降级纯 PG ${IMAGE_POSTGRES}(postgres:16-alpine) 更轻，时序库才需 timescaledb。
  # 独立 volume tsdbdata、独立凭据 POSTGRES_TSDB_*（口令由 install.sh ensure_secrets 强随机
  # 生成，与主库口令独立，见 #347）。宿主端口 5433 避开主库 5432。
  # 调优旋钮 TSDB_* 由 resources.env(plan-resources.sh) 注入；缺省档保守（两 PG 同机不互挤 OOM）。
  postgres-tsdb:
    image: ${IMAGE_POSTGRES_TSDB}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: ${POSTGRES_TSDB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TSDB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TSDB_DB}
    ports:
      - "5433:5432"                        # 内网开放(0.0.0.0)，避开主库 5432，供数据中台直连时序库
    command:
      - "postgres"
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "max_connections=${TSDB_MAX_CONNECTIONS:-300}"
      - "-c"
      # PM copy 入库走本库，写压力主要在此 → work_mem / max_wal 比主库略大；缺省档与主库同量级，
      # 防未跑 plan-resources.sh 的部署在两 PG 同机时 OOM。生产经 resources.env 按内存重配。
      - "shared_buffers=${TSDB_SHARED_BUFFERS:-1792MB}"
      - "-c"
      - "effective_cache_size=${TSDB_EFFECTIVE_CACHE_SIZE:-5GB}"
      - "-c"
      - "work_mem=${TSDB_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${TSDB_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "max_wal_size=${TSDB_MAX_WAL_SIZE:-4GB}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "shared_preload_libraries=timescaledb,pg_stat_statements"
      - "-c"
      - "track_io_timing=${TSDB_TRACK_IO_TIMING:-on}"
      - "-c"
      - "log_min_duration_statement=${TSDB_LOG_MIN_DURATION_STATEMENT:-1000}"
      - "-c"
      - "log_temp_files=${TSDB_LOG_TEMP_FILES:-0}"
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # CPU 缺省 16 核，对齐 plan-resources.sh medium 档（32核/32G 目标机型的
          # 1/2）。2026-07-23 10000 基站压测中，10 核配额仍会在 PM 波峰触顶；
          # 16 核配合 8 核 worker 后实际使用约 13-15 核，排空吞吐继续提升。
          cpus: "${TSDB_CPUS:-16}"
          memory: "${TSDB_MEM:-7g}"
        reservations:
          cpus: "0.5"
          memory: 512m
    volumes:
      - ${TSDB_DATA_PATH:-tsdbdata}:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    # PostgreSQL parallel worker 的动态共享内存使用 /dev/shm；Docker 默认 64 MiB
    # 容易在并行查询扩容时触发 SQLSTATE 53100。查询侧已轻量化，此处作为兜底。
    shm_size: ${TSDB_SHM_SIZE:-512m}
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TSDB_USER} -d ${POSTGRES_TSDB_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-core:
    image: ${IMAGE_REDIS}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "6379:6379"                        # 内网开放(0.0.0.0),供其它服务器直连
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_CORE_MAXMEMORY:-3gb} --maxmemory-policy noeviction --no-appendfsync-on-rewrite yes --save "" --auto-aof-rewrite-min-size 1gb --auto-aof-rewrite-percentage 500
    # AOF rewrite/fsync 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # CPU 1→2核对齐 plan-resources.sh medium 档（32核/32G 目标机型）。
          cpus: "${REDIS_CORE_CPUS:-2}"
          memory: "${REDIS_CORE_MEM:-4g}"
        reservations:
          cpus: "0.25"
          memory: 256m
    volumes:
      - ${REDIS_DATA_PATH:-redisdata}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      omcgo-net:
        aliases:
          - redis
          - redis-core
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-pm:
    image: ${IMAGE_REDIS}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_PM_MAXMEMORY:-6gb} --maxmemory-policy noeviction --no-appendfsync-on-rewrite yes --save "" --auto-aof-rewrite-min-size 2gb --auto-aof-rewrite-percentage 500
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_PM_CPUS:-2}"
          memory: "${REDIS_PM_MEM:-8g}"
        reservations:
          cpus: "0.25"
          memory: 512m
    volumes:
      - ${REDIS_PM_DATA_PATH:-redispmdata}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: ${IMAGE_NATS}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "4222:4222"                        # NATS 客户端,内网开放(0.0.0.0)
      - "127.0.0.1:8222:8222"              # NATS HTTP 监控,仅本机回环(运维 dashboard)
    # Path B 需要允许 DeviceGSM.Bts. 等对象一次返回全部实例。
    # PM 标准事件上限 8MiB，预留 envelope 余量。
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat >/tmp/nats-server.conf <<'EOF'
        jetstream {
          store_dir: "/data"
          max_memory_store: ${NATS_MAX_MEMORY_STORE:-134217728}
        }
        http_port: 8222
        max_payload: 10485760
        EOF
        exec nats-server -c /tmp/nats-server.conf
    # JetStream store 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # 内存 512m→1024m 对齐 plan-resources.sh medium 档（32核/32G 目标机型）。
          cpus: "${NATS_CPUS:-1}"
          memory: "${NATS_MEM:-1024m}"
        reservations:
          cpus: "0.25"
          memory: 256m
    volumes:
      - ${NATS_DATA_PATH:-natsdata}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      # 百万级 JetStream backlog 恢复实测可接近 3 分钟；宽限期内保持 starting，
      # 避免安装器把正常恢复误判为 unhealthy。
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${IMAGE_MINIO}
    # alpine/minio 以非 root 用户 minio(uid 100) 运行，而命名卷 miniodata 首次创建为 root 属主，
    # 非 root 写 /data 会 FATAL "file access denied"。官方 minio/minio 默认即 root，这里显式 root
    # 对齐官方行为（无安全回退），让 root 属主的卷可写。换回官方 minio 时本行保留亦无害。
    user: "0:0"
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      TZ: "Asia/Shanghai"
      # PM/KPI 批量上报场景下会有成百上千个设备在同一 15min 窗口边界集中上传，
      # 短时并发远超日常均值。MinIO 未显式配置时按容器可见 CPU 配额自动估算
      # 并发请求上限，CPU 配额较小时该上限会保守到不足以扛住这种突发，进而对
      # 超出部分返回 503 "Please reduce your request rate"（PM 文件因此丢失，
      # 上报端通常不重试）。这里显式拉高上限，不再依赖按 CPU 配额的保守自动估算。
      MINIO_API_REQUESTS_MAX: "${MINIO_API_REQUESTS_MAX:-6000}"
      MINIO_API_REQUESTS_DEADLINE: "${MINIO_API_REQUESTS_DEADLINE:-2m}"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # 海量小对象场景降低后台 scanner 对随机读 IOPS 的持续争抢；生命周期仍正常执行。
      MINIO_SCANNER_SPEED: "slowest"
      # MinIO 自带 Prometheus 指标端点 /minio/v2/metrics/*；public 模式免 token 抓取（T-0151）。
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"                        # MinIO S3 API,内网开放(0.0.0.0);Console 浏览器上传/下载依赖此端口
      - "9001:9001"                        # MinIO Console UI,内网开放(0.0.0.0)
    command: server /data --console-address ":9001"
    # 进行中的 multipart upload / 元数据落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # CPU 1→4核对齐 plan-resources.sh medium 档（32核/32G 目标机型）。
          cpus: "${MINIO_CPUS:-4}"
          memory: "${MINIO_MEM:-6g}"
        reservations:
          cpus: "0.25"
          memory: 1g
    volumes:
      - ${MINIO_DATA_PATH:-miniodata}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  tsdbdata:
  redisdata:
  redispmdata:
  natsdata:
  miniodata:
