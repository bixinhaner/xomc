# OMC 基础设施 —— 内网离线部署用（postgres / redis / nats / minio）
#
# 镜像由 `docker load` 离线导入；镜像标签来自同目录 .env（由 build-release.sh
# 依 release.conf 生成，与 docker save 的镜像一致，勿手改成不一致的值）。
#
# 【全 docker compose 部署】：业务容器（app / acs / worker / web）与本文件中
# 的基础服务同处一个 docker compose project（deploy.sh -p omcgo 拉起），
# 走 docker network 内部 service 名互联（postgres / redis / nats / minio）。
#
# 【端口绑定策略】2026-05-29 用户决策：基础服务对内网开放(0.0.0.0)而非仅
# 本机回环(127.0.0.1)。受影响端口：postgres 5432 / redis 6379 / nats 4222 /
# minio 9000+9001。原因：内网其它服务器需要直接访问这些服务（数据中台
# 拉数据 / 监控集成 / 备份回填 / 容灾切换 / 跨机调试）。
# NATS 监控端口 8222 保持 127.0.0.1（运维 HTTP 仪表盘，无客户端通信需求）。
#
# ⚠️ 安全要求：以 0.0.0.0 绑定后,内网任何主机均可触达,**必须**：
#    1. 部署前修改 POSTGRES_PASSWORD / MINIO_ROOT_USER /
#       MINIO_ROOT_PASSWORD 为强口令,并与 /opt/omc/etc/*.prod.yaml 同步
#    2. Redis 当前无密码 — 仅在受信任内网部署可接受；公网 / DMZ 必须
#       配 `--requirepass` 并同步 etc/*.prod.yaml 的 redis.password
#    3. 防火墙 / 安全组在出公网前 deny 这些端口（5432 / 6379 / 4222 /
#       9000 / 9001）

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge

services:
  postgres:
    image: ${IMAGE_POSTGRES}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                        # 内网开放(0.0.0.0),供其它服务器直连
    command: ["postgres", "-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai"]
    volumes:
      - pgdata:/var/lib/postgresql/data    # 生产建议改为数据盘 bind mount，如 /data/omc/pg
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${IMAGE_REDIS}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "6379:6379"                        # 内网开放(0.0.0.0),供其它服务器直连
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: ${IMAGE_NATS}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "4222:4222"                        # NATS 客户端,内网开放(0.0.0.0)
      - "127.0.0.1:8222:8222"              # NATS HTTP 监控,仅本机回环(运维 dashboard)
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - natsdata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${IMAGE_MINIO}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MinIO 自带 Prometheus 指标端点 /minio/v2/metrics/*；public 模式免 token 抓取（T-0151）。
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"                        # MinIO S3 API,内网开放(0.0.0.0);Console 浏览器上传/下载依赖此端口
      - "9001:9001"                        # MinIO Console UI,内网开放(0.0.0.0)
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
