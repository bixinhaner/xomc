# OMC 基础设施 —— 内网离线部署用（postgres / redis / nats / minio）
#
# 镜像由 `docker load` 离线导入；镜像标签来自同目录 .env（由 build-release.sh
# 依 release.conf 生成，与 docker save 的镜像一致，勿手改成不一致的值）。
#
# 【全 docker compose 部署】：业务容器（app / acs / worker / web）与本文件中
# 的基础服务同处一个 docker compose project（install.sh -p omcgo 拉起），
# 走 docker network 内部 service 名互联（postgres / redis / nats / minio）。
#
# 【端口绑定策略】2026-05-29 用户决策：基础服务对内网开放(0.0.0.0)而非仅
# 本机回环(127.0.0.1)。受影响端口：postgres 5432 / redis 6379 / nats 4222 /
# minio 9000+9001。原因：内网其它服务器需要直接访问这些服务（数据中台
# 拉数据 / 监控集成 / 备份回填 / 容灾切换 / 跨机调试）。
# NATS 监控端口 8222 保持 127.0.0.1（运维 HTTP 仪表盘，无客户端通信需求）。
#
# ⚠️ 安全要求：以 0.0.0.0 绑定后,内网任何主机均可触达,**必须**：
#    1. 部署前修改 POSTGRES_PASSWORD / MINIO_ROOT_USER /
#       MINIO_ROOT_PASSWORD 为强口令,并与 /opt/omc/etc/*.prod.yaml 同步
#    2. Redis 当前无密码 — 仅在受信任内网部署可接受；公网 / DMZ 必须
#       配 `--requirepass` 并同步 etc/*.prod.yaml 的 redis.password
#    3. 防火墙 / 安全组在出公网前 deny 这些端口（5432 / 6379 / 4222 /
#       9000 / 9001）

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge
    # 公司内网约定:Docker 网络落在 173.x,避开公司 172.x 内网(172.17/172.24… 仍在扩张)。
    # omcgo-net 固定锁 173.18.0.0/16;docker0=173.17、自动池=173.19 由 install-docker.sh
    # 写入 daemon.json,三段互不重叠。不锁 subnet 时 docker 会自动分配到 172.x,撞内网。
    # ★ 本网段在 infra.yml 统一锁定;app/web/monitoring 三个 compose 文件不重复声明
    #   subnet(它们与本文件一起 -f 传入,compose 合并后以此处为准)。换段改这一处即可。
    ipam:
      driver: default
      config:
        - subnet: 173.18.0.0/16
          gateway: 173.18.0.1

services:
  postgres:
    image: ${IMAGE_POSTGRES}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                        # 内网开放(0.0.0.0),供其它服务器直连
    # 调优参数由 resources.env 注入（plan-resources.sh 据 POSTGRES_MEM 联动派生）；缺省 = 历史等价值。
    # max_connections 缺省 300（= main #131 的修复）：app(db60+tsdb40)+worker(db25+tsdb25)+acs(db30)
    # 池上限合计 ~180，远超 PG 默认 100，否则最后启动的 acs 报 "too many clients already" 崩溃；
    # 300 覆盖全部池 + exporter + 手动 psql + 余量。其余 -c 缺省取 PG 原生默认值。
    # 注意：增大 max_connections 必须同步增大 POSTGRES_MEM（每连接 ~8-10MB），否则 PG 自身 OOM；
    # 多副本横扩前应前置 pgbouncer（见 app.prod.yaml）。
    command:
      - "postgres"
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "log_timezone=Asia/Shanghai"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-300}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "max_wal_size=${PG_MAX_WAL_SIZE:-1GB}"
    # 有状态服务给足 60s：checkpoint flush + WAL 落盘，避免被 SIGKILL 截断触发 recovery。
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # resources.env 注入；缺省 = 历史字面量。与上方 -c 调优同源（plan-resources.sh）。
          cpus: "${POSTGRES_CPUS:-2}"
          memory: "${POSTGRES_MEM:-2g}"
        reservations:
          cpus: "0.5"
          memory: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data    # 生产建议改为数据盘 bind mount，如 /data/omc/pg
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${IMAGE_REDIS}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "6379:6379"                        # 内网开放(0.0.0.0),供其它服务器直连
    # maxmemory 2gb + allkeys-lru：Redis 无上限增长会撞 cgroup 触发 OOM。曾因数据集 2.36GB
    # 远超 512m 限额，启动 load 即被 kill → 死循环、永不 healthy，拖垮 app/acs/worker。设
    # maxmemory 上限 + LRU 淘汰（队列/会话等丢失可从 PG 双写或重新上报恢复）；容器 limit 抬到
    # 3g（> maxmemory，给 AOF rewrite 的 fork COW 留余量）。
    # maxmemory / 淘汰策略由 resources.env 注入；缺省 = 历史值（2gb / allkeys-lru）。
    # 约束：limits.memory 须 ≥ maxmemory + 1GiB（AOF rewrite 的 fork COW 余量）。
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    # AOF rewrite/fsync 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-1}"
          memory: "${REDIS_MEM:-3g}"
        reservations:
          cpus: "0.25"
          memory: 256m
    volumes:
      - redisdata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: ${IMAGE_NATS}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "4222:4222"                        # NATS 客户端,内网开放(0.0.0.0)
      - "127.0.0.1:8222:8222"              # NATS HTTP 监控,仅本机回环(运维 dashboard)
    command: --jetstream --store_dir /data --http_port 8222
    # JetStream store 落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${NATS_CPUS:-1}"
          memory: "${NATS_MEM:-512m}"
        reservations:
          cpus: "0.25"
          memory: 256m
    volumes:
      - natsdata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${IMAGE_MINIO}
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MinIO 自带 Prometheus 指标端点 /minio/v2/metrics/*；public 模式免 token 抓取（T-0151）。
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"                        # MinIO S3 API,内网开放(0.0.0.0);Console 浏览器上传/下载依赖此端口
      - "9001:9001"                        # MinIO Console UI,内网开放(0.0.0.0)
    command: server /data --console-address ":9001"
    # 进行中的 multipart upload / 元数据落盘窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS:-1}"
          memory: "${MINIO_MEM:-1g}"
        reservations:
          cpus: "0.25"
          memory: 512m
    volumes:
      - miniodata:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - omcgo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
