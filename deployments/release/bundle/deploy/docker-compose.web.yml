# OMC 前端 —— 内网离线部署用（nginx 提供静态资源 + 反向代理）
#
# 直接用官方 nginx 镜像 + 绑定挂载已编译好的 web/dist 与 nginx 配置，
# 无需 docker build。镜像标签来自同目录 .env。
#
# ⚠️ default.conf 的反向代理 upstream 默认指向 docker 服务名（app/acs）。
#    本方案中 OMC 三进程跑宿主机，需把 default.conf 内的 upstream 改为
#    `host.docker.internal:8081`（已配 extra_hosts）或宿主机实际 IP。
#    详见部署方案 §5 步骤 8。

services:
  web:
    image: ${IMAGE_NGINX}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内经此主机名回连宿主机上的 OMC
    ulimits:
      nofile:
        soft: 20480
        hard: 40960
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../run/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
