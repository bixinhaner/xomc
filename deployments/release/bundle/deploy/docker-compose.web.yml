# OMC 前端 —— 内网离线部署用（业务镜像 IMAGE_WEB，含 nginx + 已构建前端）
#
# 镜像由 build-release.sh 经 Dockerfile.web 多阶段构建产出（npm workspace 三阶
# 段：deps / builder / nginx:alpine + COPY dist + nginx 配置），随项目交付包发
# 布；运维侧 docker load 即用，无需再做前端构建。
#
# 镜像内已 COPY nginx.conf / default.conf；本 compose 仍把同目录两个 conf 文件
# 以 bind mount 方式覆盖进容器，便于运维就地改 server_name / TLS / 自定义路由
# 而不重打镜像。upstream 名（app / acs-primary）依赖与 docker-compose.app.yml
# 同 project 共享 docker network 内 service 名；acs-candidate 仅用于独立预检和监控。

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge

x-omc-json-log: &omc-json-log
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  web:
    image: ${IMAGE_WEB}
    restart: unless-stopped
    logging: *omc-json-log
    environment:
      OPENSSL_CONF: /etc/nginx/openssl-legacy.cnf
    # ACS 代理目标是单一 4-tuple；即使 upstream keepalive 异常退化，也要给
    # 短连接/TIME_WAIT 留足端口余量，避免默认 32768-60999 在波峰期耗尽。
    sysctls:
      net.ipv4.ip_local_port_range: "10240 65535"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8443:8443"
    ulimits:
      nofile:
        soft: 20480
        hard: 40960
    # nginx 优雅停机（quit 信号 drain 在途连接）窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # resources.env 注入；缺省 = 历史字面量（plan-resources.sh 生成 WEB_CPUS/WEB_MEM）。
          cpus: "${WEB_CPUS:-1}"
          memory: "${WEB_MEM:-512m}"
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      # 镜像内已含 nginx 配置；这里挂载允许运维就地改而不重打镜像（可选）
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./openssl-legacy.cnf:/etc/nginx/openssl-legacy.cnf:ro
      - /etc/nginx/cert:/etc/nginx/cert:ro
      - /opt/omc/run/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - app
      - acs
    networks:
      - omcgo-net
