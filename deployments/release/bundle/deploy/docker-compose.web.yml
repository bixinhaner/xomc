# OMC 前端 —— 内网离线部署用（业务镜像 IMAGE_WEB，含 nginx + 已构建前端）
#
# 镜像由 build-release.sh 经 Dockerfile.web 多阶段构建产出（npm workspace 三阶
# 段：deps / builder / nginx:alpine + COPY dist + nginx 配置），随项目交付包发
# 布；运维侧 docker load 即用，无需再做前端构建。
#
# 镜像内已 COPY nginx.conf / default.conf；本 compose 仍把同目录两个 conf 文件
# 以 bind mount 方式覆盖进容器，便于运维就地改 server_name / TLS / 自定义路由
# 而不重打镜像。upstream 名（app / acs）依赖与 docker-compose.app.yml 同 project
# 共享 docker network 内 service 名。

networks:
  omcgo-net:
    name: omcgo-net
    driver: bridge

services:
  web:
    image: ${IMAGE_WEB}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    ulimits:
      nofile:
        soft: 20480
        hard: 40960
    # nginx 优雅停机（quit 信号 drain 在途连接）窗口
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # resources.env 注入；缺省 = 历史字面量（plan-resources.sh 生成 WEB_CPUS/WEB_MEM）。
          cpus: "${WEB_CPUS:-1}"
          memory: "${WEB_MEM:-512m}"
        reservations:
          cpus: "0.25"
          memory: 128m
    volumes:
      # 镜像内已含 nginx 配置；这里挂载允许运维就地改而不重打镜像（可选）
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/omc/run/logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - app
      - acs
    networks:
      - omcgo-net
