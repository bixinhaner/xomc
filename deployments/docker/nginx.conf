# OMC Nginx 主配置
# 挂载到 /etc/nginx/nginx.conf，替换镜像默认配置
#
# 并发容量 = worker_processes × worker_connections
# 默认 auto × 10240 = 在 4 核机器上支持 ~40960 并发连接

user  nginx;
worker_processes  auto;                  # 自动匹配 CPU 核数
worker_rlimit_nofile 20480;              # 单 worker 文件描述符上限（≥ 2 × worker_connections）

# 全局错误日志（仅捕获 worker 启动等非请求错误，请求级错误在 server 块中按端口分文件）
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;            # 单 worker 最大并发连接（默认 512 远不够）
    multi_accept        on;              # 一次 accept 多个连接，减少 epoll_wait 调用
    use                 epoll;           # Linux 高效事件模型
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 真实客户端 IP 还原：
    # 当 nginx 前面还有 LB / Ingress / 反代时，优先从其注入的转发链里恢复原始来源 IP。
    # 这里仅信任常见的内网/回环网段；如果你的上游代理使用了其它地址段，需要在此补充。
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;
    set_real_ip_from   127.0.0.1;
    set_real_ip_from   ::1;
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    set_real_ip_from   fc00::/7;
    set_real_ip_from   fe80::/10;

    # --- 日志格式 ---
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    # 全局 access_log 关闭，由各 server 块按端口分文件配置
    access_log off;

    # --- 基础性能 ---
    sendfile        on;                  # 内核级文件传输（静态文件）
    tcp_nopush      on;                  # 配合 sendfile，减少小包发送
    tcp_nodelay     on;                  # 禁用 Nagle 算法，降低延迟
    server_tokens   off;                 # 隐藏 Nginx 版本号

    # --- 连接管理 ---
    keepalive_timeout   65;              # 客户端空闲连接保持时间
    keepalive_requests  1000;            # 单连接最大请求数（默认 100 太低）
    reset_timedout_connection on;        # 超时连接直接 RST，释放资源

    # --- 缓冲区 ---
    client_body_buffer_size    128k;     # 请求体缓冲（小于此值不写临时文件）
    proxy_buffer_size          16k;      # 代理响应头缓冲
    proxy_buffers              8 32k;    # 代理响应体缓冲
    proxy_busy_buffers_size    64k;      # 忙碌时可用缓冲

    # --- Gzip（仅前端静态资源，ACS 的 SOAP/XML 不压缩） ---
    gzip             on;
    gzip_min_length  1024;
    gzip_comp_level  2;
    gzip_types       text/plain text/css application/json application/javascript text/xml;
    gzip_vary        on;

    # --- 上游动态解析（按服务名，每 10s 重新解析容器 IP） ---
    #
    # 为什么不用 `upstream { server app:8081; }`：
    #   OSS nginx 的 upstream 块只在 worker 启动时解析一次并缓存 IP。容器一旦被
    #   recreate（docker compose up -d --build app/acs、整栈重启、down/up 等），
    #   Docker 会重新分配 IP，nginx 仍连旧 IP → 全量 502 connection refused，且
    #   不会自愈，必须手动 reload。2026-06-10 生产事故即由此触发：整栈重启后
    #   app/acs 的容器 IP 互换，nginx 把管理面 API 打到了现在是 ACS 的旧 IP 上。
    #
    # 解决：用 Docker 内嵌 DNS（127.0.0.11）。普通管理面 API 继续使用变量式
    # proxy_pass；高频 ACS 路径使用 NGINX 1.27.3+ 开源版支持的
    # `upstream { zone ...; server acs-primary:7557 resolve; keepalive ...; }`。
    # web 的正式 ACS 入口必须只指向稳定明确的 primary；candidate 不进入
    # upstream，只保留独立 ready/metrics，避免 HTTPS ACS 入口在接力实例上抖动。
    #
    # 注意：proxy_socket_keepalive 只设置 TCP keepalive 探测，不会创建 HTTP
    # upstream 连接池；ACS 必须显式使用 upstream keepalive，防止同步 Inform
    # 波峰把临时端口耗在 TIME_WAIT。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # 加载 server 块配置
    include /etc/nginx/conf.d/*.conf;
}
