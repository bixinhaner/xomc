# OMC Server Blocks 配置
# 挂载到 /etc/nginx/conf.d/default.conf
# upstream 定义在主 nginx.conf 中

# ============================================================
# Frontend + REST API Gateway (port 8081)
# ============================================================
server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    # 管理面日志（按端口独立文件）
    access_log /var/log/nginx/app_access.log main;
    error_log  /var/log/nginx/app_error.log warn;

    # 文件上传体积上限：固件包（IMG/EXT/Patch/FPGA）实测可达 400+ MB，
    # license / config 备份 / 厂商基线包同走 /api/v1/firmware 类上传端点。
    # nginx 默认 1MB 会直接 413 → 前端报 software.firmware.importFailed 等。
    # 500m 给单文件留足够余量，与 :8080 ACS server block 保持一致。
    client_max_body_size 500m;

    # --- 安全响应头（#3 前端安全加固）---
    # 这些是零运行风险的加固头，对所有响应生效（always）。XSS 影响面收敛主要靠
    # 删除前端 localStorage 明文密码（见 webcode login）+ 下面的 CSP。
    add_header X-Content-Type-Options "nosniff" always;        # 禁止 MIME 嗅探
    add_header X-Frame-Options "DENY" always;                  # 防点击劫持（本管理面不应被 iframe 内嵌）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 先以 Report-Only 上线：仅上报违规、不拦截，零破坏风险。Vite 产物无内联
    # 脚本（index.html 仅 1 个外链 module script），script-src 'self' 已可行；但地图瓦片
    # （OpenLayers 跨源 tile）、个别依赖的 eval 等需先观察 report 再切强制（去掉 -Report-Only）。
    # style-src 含 'unsafe-inline' 因 AntD 大量注入内联样式。
    set $omc_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
    add_header Content-Security-Policy-Report-Only $omc_csp always;

    # App 后端地址：web 服务跑在 Docker bridge 网络内，使用服务名解析。
    set $app_upstream app:8081;

    # --- SSE 长连接（MML 任务状态推送等）---
    # 必须放在 /api/ 通用代理之前（exact match `=` 优先于 prefix match）。
    # 关键设置：
    #   - proxy_buffering off：禁用响应缓冲，事件 chunk 立即透传给浏览器
    #     （不设这条，nginx 默认 8KB 缓冲，SSE 永远阻塞）
    #   - proxy_read_timeout 24h：SSE 是长连接，按业务最长会话长度给上限
    #   - chunked_transfer_encoding on：保持 Transfer-Encoding: chunked
    #     （Content-Length 必须不出现）
    location = /api/v1/events/stream {
        # 变量式 proxy_pass（无 URI 部分）原样透传 $request_uri。
        proxy_pass http://$app_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- REST API 代理到 App ---
    location /api/ {
        # 变量式 proxy_pass（无 URI 部分）原样透传 $request_uri。
        proxy_pass http://$app_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        # API 超时。批量下载(文件管理 4 Tab)流式 zip GB 级可能数分钟,从 60s 调到 30min。
        # 其他常规请求毫秒级返回不受影响。
        proxy_connect_timeout 5s;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
    }

    # --- 第三方位置兼容入口（Redmine #105820）---
    # 老调用方契约固定为根路径，必须在统一 Web 入口透传；不能要求客户绕过
    # 网关直连 app 容器的宿主映射端口。
    location = /fence/batchUpdateDeviceLocation {
        proxy_pass http://$app_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $http_x_request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
    }

    # --- 离线地图元数据（使用 Maperitive 生成的 tiles.json）---
    # 注意：如果 tiles.json 不存在，前端会使用 DEFAULT_METADATA 兜底
    location /tiles-metadata {
        alias /usr/share/nginx/tiles/tiles.json;
        add_header Content-Type application/json;
        add_header Cache-Control "public, max-age=3600";
        default_type application/json;
    }

    # --- 离线地图瓦片服务 ---
    # 使用 alias 直接从本地文件系统读取瓦片
    location /tiles/ {
        alias /usr/share/nginx/tiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # V2/V3 前端已移除；旧书签统一临时重定向到 V1 根路径。
    location ~ ^/(v2|v3)(/.*)?$ {
        return 302 /;
    }

    # --- 前端 SPA fallback（v1 主皮肤，根路径）---
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # index.html 永不缓存：每次部署都需要拿到最新 hash 指向的 JS chunks，
        # 否则浏览器即使 hard reload 拿到的也是旧 index.html 引用已删除的 chunk
        # → "线上更新了但用户看到旧 UI" / "下载等行为走旧路径失败"。
        # 注意：不能用 `expires 0;` — 它会自动设 max-age=0 覆盖 add_header；
        # 必须用纯 add_header always 确保所有响应状态码都带这俩头。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            # nginx 的 add_header 不向带有自己 add_header 的子 location 继承，
            # 这里必须重复安全头，否则最关键的 HTML 文档响应反而没有 CSP / 加固头。
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy-Report-Only $omc_csp always;
        }
    }
}

# ============================================================
# ACS Gateway (port 8080) - TR-069 CWMP
# ============================================================
#
# 设计要点：
# - 高并发：10K-100K 设备周期性 Inform
# - 长会话：单次 TR069 会话可持续数秒到数分钟（多轮 RPC 交互）
# - 大请求体：PM/MR 文件上传可达 100MB
# - 关闭访问日志：高频请求由 ACS 引擎内部记录结构化日志
#
# NGINX 1.27.3+ 的开源版 upstream 支持 resolve。zone 保存动态 DNS 状态，
# Docker recreate 后会自动采用 ACS 新 IP；keepalive 则复用 Nginx→ACS 连接。
# 现场 2 万设备压测曾因变量式 proxy_pass 每请求新建连接，积累 1.8 万
# TIME_WAIT 并逼近临时端口上限，最终出现 upstream connect timeout。
upstream acs_backend {
    zone acs_backend 64k;
    server acs:7557 resolve;
    keepalive 4096;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

server {
    listen 8080;

    # CPE 直接连接本边缘网关；本 server 不接受客户端自报的转发链。
    real_ip_header X-OMC-Direct-Transport-Peer;

    # ACS 日志（按端口独立文件）
    # 注意：ACS 高频请求量大，access_log 可按需关闭以减少磁盘 IO
    access_log off; # ACS 高频请求由应用指标观测，避免与数据盘竞争 IO
    error_log  /var/log/nginx/app_error.log warn;

    location / {
        # 无 URI 部分的 upstream proxy_pass 原样透传 $request_uri。
        proxy_pass http://acs_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        # TR-069 会话超时（匹配 ACS 的 session_ttl=5min）
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # PM/MR 文件上传体积限制
        # 设备日志文件包动辄 50-300 MB，PM/MR 文件可能上百 MB，原 100m 卡 LOG 收集
        # （设备报 FaultCode 9015 + "HTTP error: 413"）。500m 给单文件足够余量。
        client_max_body_size 500m;

        # 大 SOAP 请求体缓冲（避免频繁写临时文件）
        client_body_buffer_size 256k;

        # 关闭代理缓冲：TR069 是同步请求-响应模式，不需要缓冲
        # 请求体必须直接流给 ACS，确保 PM 背压能在读取完整大文件前快速返回 503，
        # 同时避免 Nginx 把超过 client_body_buffer_size 的上传写入同一块数据盘。
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

# ============================================================
# Nginx 自身指标 (stub_status, port 8090)
# ============================================================
# 仅 docker 网络内可达——8090 未在 compose ports 发布到宿主，外部访问不到。
# nginx-prometheus-exporter 抓 http://web:8090/stub_status 转 Prometheus 指标：
#   nginx_connections_active   当前活跃连接（≈ 实时并发）
#   nginx_http_requests_total  累计请求（rate() = QPS / 每秒请求数）
#   nginx_connections_{reading,writing,waiting}  连接状态分解
server {
    listen 8090;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    # 该端口仅供 exporter 抓 stub_status，其余路径一律 404。
    location / {
        return 404;
    }
}
