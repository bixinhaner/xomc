# OMC Server Blocks 配置
# 挂载到 /etc/nginx/conf.d/default.conf
# upstream 定义在主 nginx.conf 中

# ============================================================
# Frontend + REST API Gateway (port 8081)
# ============================================================
server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    # 管理面日志（按端口独立文件）
    access_log /var/log/nginx/app_access.log main;
    error_log  /var/log/nginx/app_error.log warn;

    # --- REST API 代理到 App ---
    location /api/ {
        proxy_pass http://app_backend/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复用 upstream keepalive 连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # API 超时
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # --- 前端 SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # index.html 永不缓存：每次部署都需要拿到最新 hash 指向的 JS chunks，
        # 否则浏览器即使 hard reload 拿到的也是旧 index.html 引用已删除的 chunk
        # → "线上更新了但用户看到旧 UI" / "下载等行为走旧路径失败"。
        # 注意：不能用 `expires 0;` — 它会自动设 max-age=0 覆盖 add_header；
        # 必须用纯 add_header always 确保所有响应状态码都带这俩头。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }
    }
}

# ============================================================
# ACS Gateway (port 8080) - TR-069 CWMP
# ============================================================
#
# 设计要点：
# - 高并发：10K-100K 设备周期性 Inform
# - 长会话：单次 TR069 会话可持续数秒到数分钟（多轮 RPC 交互）
# - 大请��体：PM/MR 文件上传可达 100MB
# - 关闭访问日志：高频请求由 ACS 引擎内部记录结构化日志
#
server {
    listen 8080;

    # ACS 日志（按端口独立文件）
    # 注意：ACS 高频请求量大，access_log 可按需关闭以减少磁盘 IO
    access_log /var/log/nginx/acs_access.log main;
    error_log  /var/log/nginx/acs_error.log warn;

    location / {
        proxy_pass http://acs_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复用 upstream keepalive 连接（关键：减少 Nginx → ACS 连接开销）
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # TR-069 会话超时（匹配 ACS 的 session_ttl=5min）
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # PM/MR 文件上传体积限制
        client_max_body_size 100m;

        # 大 SOAP 请求体缓冲（避免频繁写临时文件）
        client_body_buffer_size 256k;

        # 关闭代理缓冲：TR069 是同步请求-响应模式，不需要缓冲
        # 这样 ACS 响应可以直接流式传输给 CPE，降低内存占用
        proxy_buffering off;
    }
}
