# docker-compose.test.yml — Lightweight test infrastructure
#
# Only infrastructure services (no app/acs/worker/web).
# Uses different ports to avoid conflicts with local dev environment.
# Uses tmpfs for PostgreSQL to maximize test speed.
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.test.yml up -d --wait
#   docker compose -f deployments/docker/docker-compose.test.yml down -v

services:
  postgres-test:
    # 单实例集成测试库：同时充当主库与时序库（要建超表），故【必须】TimescaleDB；
    # 固定 2.25.2-pg16 与 dev/release 时序库一致，弃用 latest-pg16 浮动 tag（避免漂版）。
    image: timescale/timescaledb:2.25.2-pg16
    environment:
      POSTGRES_USER: omcgo_test
      POSTGRES_PASSWORD: omcgo_test
      POSTGRES_DB: omcgo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omcgo_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction --auto-aof-rewrite-min-size 1gb --auto-aof-rewrite-percentage 500
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /data

  nats-test:
    image: nats:2.10-alpine
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat >/tmp/nats-server.conf <<'EOF'
        jetstream {
          store_dir: "/tmp/nats"
        }
        http_port: 8222
        max_payload: 10485760
        EOF
        exec nats-server -c /tmp/nats-server.conf
    ports:
      - "4223:4222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp/nats

  migrate-schema-test:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
    restart: on-failure:3
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
    entrypoint: ["omcgo-migrate"]
    command: ["--dsn", "postgres://omcgo_test:omcgo_test@postgres-test:5432/omcgo_test?sslmode=disable", "--path", "/etc/omcgo/migrations", "up"]
    volumes:
      - ../../omcgo/migrations:/etc/omcgo/migrations:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres-test:
        condition: service_healthy

  migrate-seed-test:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
    restart: on-failure:3
    environment:
      TZ: "Asia/Shanghai"
      GOOSE_VERBOSITY: "1"
      GOOSE_TABLE: "goose_db_version_seed"
    entrypoint: ["omcgo-migrate"]
    command: ["--dsn", "postgres://omcgo_test:omcgo_test@postgres-test:5432/omcgo_test?sslmode=disable", "--path", "/etc/omcgo/migrations/seed", "up"]
    volumes:
      - ../../omcgo/migrations:/etc/omcgo/migrations:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate-schema-test:
        condition: service_completed_successfully

networks:
  default:
    # 测试网络独立命名，避免复用历史项目默认 bridge 网络。
    name: omcgo-test-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.20.0.0/16
          gateway: 173.20.0.1
