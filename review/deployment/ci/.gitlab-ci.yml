stages:
  - validate
  - quality
  - security
  - package

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$/'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never

include:
  - local: review/deployment/ci/basic-ci.yml
  - local: review/deployment/ci/dev-tag-ci.yml
    rules:
      - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$/'
  - local: review/deployment/ci/release-tag-ci.yml
    rules:
      - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
