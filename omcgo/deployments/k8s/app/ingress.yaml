apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omcgo-app
  namespace: omcgo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: api.omc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omcgo-app
                port:
                  number: 8080
  tls:
    - hosts:
        - api.omc.example.com
      secretName: omcgo-tls
