# OMC Docker Compose Configuration
#
# Log files are mounted to project directory on the host:
#   run/logs/acs/acs.log     - ACS service logs
#   run/logs/app/app.log     - App service logs
#   run/logs/worker/worker.log - Worker service logs
#
# View logs:
#   tail -f run/logs/acs/acs.log
#   tail -f run/logs/app/app.log
#   tail -f run/logs/worker/worker.log
#
# Log rotation is handled by lumberjack (configured in config.yaml):
#   - Max file size: 20MB
#   - Max age: 7 days
#   - Max backups: 100 files
#   - Compress: enabled

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: omcgo
      POSTGRES_PASSWORD: omcgo123
      POSTGRES_DB: omcgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omcgo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "4222:4222"
      - "8222:8222"
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - natsdata:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      TZ: "Asia/Shanghai"
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
      - /etc/localtime:/etc/localtime:ro
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
    environment:
      TZ: "Asia/Shanghai"
    entrypoint: ["omcgo-migrate"]
    command: ["--dsn", "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable", "--path", "/etc/omcgo/migrations", "up"]
    volumes:
      - ../../migrations:/etc/omcgo/migrations:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy

  acs:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.acs
    ports:
      - "9090:9090"
      - "7547:7547"
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_SERVER_HOST: "0.0.0.0"
      OMCGO_SERVER_PORT: "7547"
      OMCGO_REDIS_ADDRS: "redis:6379"
      OMCGO_NATS_URL: "nats://nats:4222"
      OMCGO_DB_DSN: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
      OMCGO_MINIO_ENDPOINT: "minio:9000"
      OMCGO_MINIO_ACCESS_KEY: "minioadmin"
      OMCGO_MINIO_SECRET_KEY: "minioadmin"
      OMCGO_MINIO_USE_SSL: "false"
      OMCGO_METRICS_PORT: "9090"
      OMCGO_LOG_LEVEL: "info"
      OMCGO_LOG_FORMAT: "json"
      OMCGO_LOG_OUTPUT_PATHS: "stdout,/run/logs/acs/acs.log"
    volumes:
      - ../../../run/logs/acs:/run/logs/acs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.app
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_SERVER_HOST: "0.0.0.0"
      OMCGO_SERVER_PORT: "8081"
      OMCGO_DB_DSN: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
      OMCGO_TSDB_DSN: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
      OMCGO_REDIS_ADDRS: "redis:6379"
      OMCGO_NATS_URL: "nats://nats:4222"
      OMCGO_MINIO_ENDPOINT: "minio:9000"
      OMCGO_MINIO_ACCESS_KEY: "minioadmin"
      OMCGO_MINIO_SECRET_KEY: "minioadmin"
      OMCGO_MINIO_USE_SSL: "false"
      OMCGO_METRICS_PORT: "9091"
      OMCGO_LOG_LEVEL: "info"
      OMCGO_LOG_FORMAT: "json"
      OMCGO_LOG_OUTPUT_PATHS: "stdout,/run/logs/app/app.log"
    volumes:
      - ../../../run/logs/app:/run/logs/app
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    ports:
      - "9092:9092"
    environment:
      TZ: "Asia/Shanghai"
      OMCGO_DB_DSN: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
      OMCGO_TSDB_DSN: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
      OMCGO_REDIS_ADDRS: "redis:6379"
      OMCGO_NATS_URL: "nats://nats:4222"
      OMCGO_MINIO_ENDPOINT: "minio:9000"
      OMCGO_MINIO_ACCESS_KEY: "minioadmin"
      OMCGO_MINIO_SECRET_KEY: "minioadmin"
      OMCGO_MINIO_USE_SSL: "false"
      OMCGO_METRICS_PORT: "9092"
      OMCGO_LOG_LEVEL: "info"
      OMCGO_LOG_FORMAT: "json"
      OMCGO_LOG_OUTPUT_PATHS: "stdout,/run/logs/worker/worker.log"
    volumes:
      - ../../../run/logs/worker:/run/logs/worker
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:8080"
    environment:
      TZ: "Asia/Shanghai"
      NGINX_WORKER_PROCESSES: "10"
    volumes:
      - ../../../omcmb/webcode/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - app
      - acs

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
