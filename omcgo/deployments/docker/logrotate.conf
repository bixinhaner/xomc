# OMC Logrotate Configuration (Optional - lumberjack handles rotation internally)
#
# This file is provided as a backup option if you prefer system-level logrotate
# over lumberjack's built-in rotation.
#
# Install: sudo cp logrotate.conf /etc/logrotate.d/omcgo
# Test: sudo logrotate -d /etc/logrotate.d/omcgo
#
# Note: If using lumberjack (default), set rotation.enabled: true in config.yaml
# and you don't need this file.

/data/logs/omcgo/*/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    dateext
    dateformat -%Y%m%d
}
