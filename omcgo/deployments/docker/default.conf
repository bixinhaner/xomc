# OMC Server Blocks 配置
# 挂载到 /etc/nginx/conf.d/default.conf
# upstream 定义在主 nginx.conf 中

# ============================================================
# Frontend + REST API Gateway (port 8081)
# ============================================================
server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    # --- REST API 代理到 App ---
    location /api/ {
        proxy_pass http://app_backend/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复用 upstream keepalive 连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # API 超时
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # --- 前端 SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

# ============================================================
# ACS Gateway (port 8080) - TR-069 CWMP
# ============================================================
#
# 设计要点：
# - 高并发：10K-100K 设备周期性 Inform
# - 长会话：单次 TR069 会话可持续数秒到数分钟（多轮 RPC 交互）
# - 大请��体：PM/MR 文件上传可达 100MB
# - 关闭访问日志：高频请求由 ACS 引擎内部记录结构化日志
#
server {
    listen 8080;

    # ACS 高频请求不写 Nginx 访问日志，减少磁盘 IO
    access_log off;

    location / {
        proxy_pass http://acs_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 复用 upstream keepalive 连接（关键：减少 Nginx → ACS 连接开销）
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # TR-069 会话超时（匹配 ACS 的 session_ttl=5min）
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # PM/MR 文件上传体积限制
        client_max_body_size 100m;

        # 大 SOAP 请求体缓冲（避免频繁写临时文件）
        client_body_buffer_size 256k;

        # 关闭代理缓冲：TR069 是同步请求-响应模式，不需要缓冲
        # 这样 ACS 响应可以直接流式传输给 CPE，降低内存占用
        proxy_buffering off;
    }
}
