# OMC Nginx 主配置
# 挂载到 /etc/nginx/nginx.conf，替换镜像默认配置
#
# 并发容量 = worker_processes × worker_connections
# 默认 auto × 10240 = 在 4 核机器上支持 ~40960 并发连接

user  nginx;
worker_processes  auto;                  # 自动匹配 CPU 核数
worker_rlimit_nofile 20480;              # 单 worker 文件描述符上限（≥ 2 × worker_connections）

# 全局错误日志（仅捕获 worker 启动等非请求错误，请求级错误在 server 块中按端口分文件）
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;            # 单 worker 最大并发连接（默认 512 远不够）
    multi_accept        on;              # 一次 accept 多个连接，减少 epoll_wait 调用
    use                 epoll;           # Linux 高效事件模型
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- 日志格式 ---
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    # 全局 access_log 关闭，由各 server 块按端口分文件配置
    access_log off;

    # --- 基础性能 ---
    sendfile        on;                  # 内核级文件传输（静态文件）
    tcp_nopush      on;                  # 配合 sendfile，减少小包发送
    tcp_nodelay     on;                  # 禁用 Nagle 算法，降低延迟
    server_tokens   off;                 # 隐藏 Nginx 版本号

    # --- 连接管理 ---
    keepalive_timeout   65;              # 客户端空闲连接保持时间
    keepalive_requests  1000;            # 单连接最大请求数（默认 100 太低）
    reset_timedout_connection on;        # 超时连接直接 RST，释放资源

    # --- 缓冲区 ---
    client_body_buffer_size    128k;     # 请求体缓冲（小于此值不写临时文件）
    proxy_buffer_size          16k;      # 代理响应头缓冲
    proxy_buffers              8 32k;    # 代理响应体缓冲
    proxy_busy_buffers_size    64k;      # 忙碌时可用缓冲

    # --- Gzip（仅前端静态资源，ACS 的 SOAP/XML 不压缩） ---
    gzip             on;
    gzip_min_length  1024;
    gzip_comp_level  2;
    gzip_types       text/plain text/css application/json application/javascript text/xml;
    gzip_vary        on;

    # --- Upstream 定义（启用连接池复用） ---

    # ACS 后端：TR069 设备通信，高并发长连接
    upstream acs_backend {
        server acs:7547;
        keepalive 5120;                   # 保持 5120 个到 ACS 的长连接
    }

    # App 后端：管理面 REST API
    upstream app_backend {
        server app:8081;
        keepalive 64;                    # 管理面并发较低
    }

    # 加载 server 块配置
    include /etc/nginx/conf.d/*.conf;
}
