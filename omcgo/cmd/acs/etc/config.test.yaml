server:
  host: "0.0.0.0"
  port: 7547
  tls_port: 7548
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

session:
  timeout: 5m
  max_concurrent: 10000

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 100000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "none"
  username: ""
  password: ""

redis:
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://localhost:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@localhost:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

metrics:
  port: 9090

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/var/log/omcgo/worker.log"
  rotation:
    enabled: true
    max_size_mb: 20
    max_age_days: 7
    max_backups: 100
    compress: true
    local_time: true
