server:
  host: "0.0.0.0"
  port: 7557
  tls_port: 7558
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

session:
  timeout: 5m
  max_concurrent: 10000

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 100000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "none"
  username: ""
  password: ""

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

upload:
  base_url: "http://acs:7557"
  path: "/smallcell/FileUploadService"
  username: "upload_user"
  password: "test_upload_password"
  max_file_size: 104857600  # 100MB

download:
  base_url: "http://acs:7557"
  path: "/smallcell/FileDownloadService"
  username: "download_user"
  password: "test_download_password"

metrics:
  port: 9090

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

protocol_log:
  enabled: true
  file_path: "/run/logs/acs/protocol.log"
  max_body_size: 0
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 7
    max_backups: 30
    compress: true
    local_time: true

request_id_prefix: "acs"

# 测试功能：启用随机 RPC 任务注入
# 当 CPE 发送 Inform 时，自动为设备生成 3-10 个随机 RPC 任务
# 仅用于测试，生产环境应设置为 false
enable_test_task_injection: false
