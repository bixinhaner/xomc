server:
  host: "0.0.0.0"
  port: 7557
  tls_port: 7558
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  # 入站 SOAP 请求体上限（bytes），防止超大 POST 导致 ACS OOM。0=默认 50MB。
  max_request_body_size: 52428800   # 50MB
  # HTTP 头部上限（bytes）。0=默认 1MB。
  max_header_bytes: 1048576         # 1MB
  trusted_proxy_cidrs: ["${DOCKER_COMPOSE_SUBNET}"]

session:
  timeout: 5m
  max_concurrent: 10000

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 100000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "none"
  username: ""
  password: ""

redis:
  addrs:
    - "172.19.1.73:6379"
  password: ""
  db: 0
  pool_size: 100

task:
  terminal_redis_ttl: 15m

nats:
  url: "nats://172.19.1.73:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@172.19.1.73:5432/omcgo?sslmode=disable"
  # 连接池核定（#24）：与 prod 对齐，ACS PG 池 20→30。聚合预算见 app/config.prod.yaml。
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

# KPI/时序库物理分离：ACS 写 trace_messages（已迁时序库）所需的第二个连接池，指向 postgres-tsdb。
tsdb:
  dsn: "postgres://omcgo:omcgo123@postgres-tsdb:5432/omcgo?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "172.19.1.73:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

upload:
  base_url: "http://acs:7557"
  path: "/smallcell/FileUploadService"
  # 产品线明确要求 Upload 不走 Basic Auth（详见 config.dev.yaml 同名说明 +
  # internal/software/executor.go）。username 非空会让 handler 401 拒绝 CPE PUT。
  username: ""
  password: ""
  max_file_size: 524288000  # 500MB (设备日志包动辄 50-300MB)
  pm_dedup_ttl: 4h          # 覆盖短时重投，降低 Redis 历史键数量

download:
  base_url: "http://acs:7557"
  path: "/smallcell/FileDownloadService"
  username: ""
  password: ""

metrics:
  port: 9090

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

protocol_log:
  enabled: true
  file_path: "/run/logs/acs/protocol.log"
  max_body_size: 0
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # T-0134 compactor 模式接入：最新 N 个不压缩，其余 .log → .log.gz

request_id_prefix: "acs"

# 测试功能：启用随机 RPC 任务注入
# 当 CPE 发送 Inform 时，自动为设备生成 3-10 个随机 RPC 任务
# 仅用于测试，生产环境应设置为 false
enable_test_task_injection: false
