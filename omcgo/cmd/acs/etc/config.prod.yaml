server:
  host: "0.0.0.0"
  port: 7547
  tls_port: 7548
  tls:
    enabled: true
    cert_file: "${TLS_CERT_FILE}"
    key_file: "${TLS_KEY_FILE}"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

session:
  timeout: 5m
  max_concurrent: 10000

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 200000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "digest"
  username: "${ACS_AUTH_USERNAME}"
  password: "${ACS_AUTH_PASSWORD}"

redis:
  addrs:
    - "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 100

nats:
  url: "${NATS_URL}"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "${DB_DSN}"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "minio:9000"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  use_ssl: true
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"

upload:
  base_url: "${ACS_BASE_URL}"  # e.g. https://acs.example.com
  path: "/smallcell/FileUploadService"
  username: "${UPLOAD_USERNAME}"
  password: "${UPLOAD_PASSWORD}"
  max_file_size: 104857600  # 100MB

metrics:
  port: 9090

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true
    max_size_mb: 5
    max_age_days: 7
    max_backups: 20
    compress: true
    local_time: true

request_id_prefix: "acs"

# 测试功能：启用随机 RPC 任务注入
# 当 CPE 发送 Inform 时，自动为设备生成 3-10 个随机 RPC 任务
# 仅用于测试，生产环境应设置为 false
enable_test_task_injection: false

