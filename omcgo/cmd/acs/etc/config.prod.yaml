server:
  host: "0.0.0.0"
  port: 7557
  tls_port: 7558
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

session:
  timeout: 5m
  max_concurrent: 10000
  max_rpc_per_session: 50

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 200000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "none"
  username: ""
  password: ""

stun:
  enabled: true
  listen_addr: ":3478"
  worker_size: 4
  buffer_size: 2048
  cache_ttl: 30m
  shared_secret: "dps"

post_session_wake:
  enabled: true
  delay_after: 1s
  max_continuous: 200
  cooldown_ttl: 5m

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

upload:
  base_url: "http://acs:7557"
  path: "/smallcell/FileUploadService"
  username: "upload_user"
  password: "secure_upload_password_123"
  max_file_size: 104857600

download:
  base_url: "http://acs:7557"
  path: "/smallcell/FileDownloadService"
  username: "download_user"
  password: "secure_download_password_123"

metrics:
  port: 9090

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 0.1

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

protocol_log:
  # 生产默认关闭 — TR-069 SOAP 报文含 CPE 凭据敏感字段，等保/安全审计要求不长期落盘。
  # 排障时由 admin 显式开启（建议同步加限时计划任务关闭，避免遗忘）。
  enabled: false
  file_path: "/run/logs/acs/protocol.log"
  max_body_size: 0
  rotation:
    # rotation 配置在 enabled=false 时不生效；保留供 admin 临时启用时使用。
    # T-0134 切 compactor 模式：与主 acs.log 一致，自动 gzip 压缩 + max_age 删旧。
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # T-0134 compactor 模式接入

request_id_prefix: "acs"

enable_test_task_injection: false
