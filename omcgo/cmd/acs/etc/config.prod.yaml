server:
  host: "0.0.0.0"
  port: 7547
  tls_port: 7548
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

session:
  timeout: 5m
  max_concurrent: 10000
  max_rpc_per_session: 50

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 200000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "none"
  username: ""
  password: ""

stun:
  enabled: true
  listen_addr: ":3478"
  worker_size: 4
  buffer_size: 2048
  cache_ttl: 30m
  shared_secret: "dps"

post_session_wake:
  enabled: true
  delay_after: 1s
  max_continuous: 200
  cooldown_ttl: 5m

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"

upload:
  base_url: "http://acs:7547"
  path: "/smallcell/FileUploadService"
  username: "upload_user"
  password: "secure_upload_password_123"
  max_file_size: 104857600

metrics:
  port: 9090

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true
    max_size_mb: 20
    max_age_days: 30
    max_backups: 50
    compress: true
    local_time: true

request_id_prefix: "acs"

enable_test_task_injection: false
