server:
  host: "0.0.0.0"
  port: 7557
  tls_port: 7558
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  # 入站 SOAP 请求体上限（bytes），防止超大 POST 导致 ACS OOM。0=默认 50MB。
  max_request_body_size: 52428800   # 50MB
  # HTTP 头部上限（bytes）。0=默认 1MB。
  max_header_bytes: 1048576         # 1MB
  trusted_proxy_cidrs: ["${DOCKER_COMPOSE_SUBNET}"] # bundled Web ACS gateway network, derived from DOCKER_BIP

session:
  timeout: 5m
  max_concurrent: 30000
  max_rpc_per_session: 50

rate_limit:
  per_device: 10
  burst: 5
  max_devices: 200000
  cleanup_interval: 5m
  cleanup_timeout: 10m

auth:
  mode: "none"
  username: ""
  password: ""

stun:
  enabled: true
  listen_addr: ":3478"
  worker_size: 4
  buffer_size: 2048
  cache_ttl: 30m
  shared_secret: "${OMC_SHARED_SECRET}"  # TR-069 ConnReq/STUN 共享密钥，由 deploy/.env 注入 ${OMC_SHARED_SECRET}（与 app conn_req 同值）

post_session_wake:
  enabled: true
  delay_after: 1s
  max_continuous: 200
  cooldown_ttl: 5m

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

task:
  terminal_redis_ttl: 15m

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  # 【全 docker compose 部署】使用 service 名 postgres（容器间 docker network 解析）
  dsn: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"  # 凭据由 deploy/.env 经 compose 注入 ${POSTGRES_*}，Load() 解析前展开（单一真值源）
  # 连接池核定（#24）：ACS 承载高并发 CWMP 会话（全局 max_concurrent 30000），PG 池 20→30。
  # ACS 水平扩展时按副本数累加，逼近 PG max_connections 前必须前置 pgbouncer。
  # 聚合预算见 app/config.prod.yaml 与 migrations/README.md「连接池核定（#24）」。
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

# KPI/时序库物理分离：ACS 写 trace_messages（已迁独立时序库实例 postgres-tsdb）所需的第二个连接池。
# 凭据/主机由 deploy/.env 经 compose 注入 ${POSTGRES_TSDB_*}/${TSDB_HOST}，Load() 解析前展开。
tsdb:
  dsn: "postgres://${POSTGRES_TSDB_USER}:${POSTGRES_TSDB_PASSWORD}@${TSDB_HOST}:5432/${POSTGRES_TSDB_DB}?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "minio:9000"
  access_key: "${MINIO_ROOT_USER}"    # 由 deploy/.env 注入 ${MINIO_ROOT_USER}
  secret_key: "${MINIO_ROOT_PASSWORD}"  # 由 deploy/.env 注入 ${MINIO_ROOT_PASSWORD}
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

upload:
  base_url: "http://acs:7557"
  path: "/smallcell/FileUploadService"
  # 产品线明确要求 Upload 不走 Basic Auth（详见 config.dev.yaml 同名说明 +
  # internal/software/executor.go）。username 非空会让 handler 401 拒绝 CPE PUT。
  # 若 prod 环境后续要重新启用 Basic Auth，需要同步改 Upload SOAP 渲染逻辑、
  # 让设备 PUT 带 Authorization header。
  username: ""
  password: ""
  max_file_size: 524288000   # 500MB (设备日志包动辄 50-300MB)
  pm_dedup_ttl: 4h           # 覆盖短时重投，降低 Redis 历史键数量

backpressure:
  queue_pending_high: 5000
  queue_pending_low: 1000
  queue_oldest_high: 10m
  queue_oldest_low: 2m
  queue_slope_window: 5m

download:
  base_url: "http://acs:7557"
  path: "/smallcell/FileDownloadService"
  username: ""
  password: ""

metrics:
  port: 9090
  # pprof 性能剖析（默认关）。线上排查 CPU/内存时改 enabled: true 并重启 acs，
  # 即可访问 :9090/debug/pprof/*（go tool pprof -seconds=30 ...）。排查完务必改回 false。
  # 等价环境变量：OMCGO_METRICS_PPROF_ENABLED=true（或临时强开 OMCGO_PPROF=1）。
  pprof:
    enabled: false
    contention: false   # 额外开 block/mutex 采样（有开销，定位锁/连接池争用时才开）

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 0.1

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

protocol_log:
  # 生产默认关闭 — TR-069 SOAP 报文含 CPE 凭据敏感字段，等保/安全审计要求不长期落盘。
  # 排障时由 admin 显式开启（建议同步加限时计划任务关闭，避免遗忘）。
  enabled: false
  # issue #218：临时开启抓包时，level 仍默认 warn（抑制每报文整段 XML 编码）；
  # 需逐报文全量 XML 时再调 info/debug。max_body_size 默认非 0 截断（0/缺省回退 4096）。
  level: "warn"
  file_path: "/run/logs/acs/protocol.log"
  max_body_size: 4096
  rotation:
    # rotation 配置在 enabled=false 时不生效；保留供 admin 临时启用时使用。
    # T-0134 切 compactor 模式：与主 acs.log 一致，自动 gzip 压缩 + max_age 删旧。
    enabled: true
    max_size_mb: 50
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # T-0134 compactor 模式接入

request_id_prefix: "acs"

enable_test_task_injection: false
