server:
  host: "0.0.0.0"
  port: 7557
  tls_port: 7558
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  # 入站 SOAP 请求体上限（bytes），防止超大 POST 导致 ACS OOM。0=默认 50MB。
  max_request_body_size: 52428800   # 50MB
  # HTTP 头部上限（bytes）。0=默认 1MB。
  max_header_bytes: 1048576         # 1MB

session:
  timeout: 5m
  max_concurrent: 10000
  max_rpc_per_session: 50   # 单次会话最大 RPC 交互次数（避免触发基站单会话限制）

rate_limit:
  per_device: 50            # 每设备每分钟最大 Inform 数
  burst: 50                 # token bucket 突发容量
  max_devices: 100000       # 限流器追踪的最大设备数
  cleanup_interval: 5m      # 不活跃设备清理扫描间隔
  cleanup_timeout: 10m      # 设备不活跃淘汰超时

auth:
  mode: "none"
  username: ""
  password: ""

stun:
  enabled: true
  listen_addr: ":3478"
  worker_size: 4
  buffer_size: 2048
  cache_ttl: 30m
  shared_secret: "dps"

# 会话结束续唤：当会话结束时命令队列仍有积压命令，立即发送 CR 触发设备重新连接
# 避免等待设备下一次周期性 Inform（通常 60 秒），大幅提升命令下发效率
post_session_wake:
  enabled: true
  delay_after: 1s          # 会话结束后等待时间（给 CPE 喘息时间）
  max_continuous: 200       # 单设备最大连续续唤次数（安全阀，防止无限循环）
  cooldown_ttl: 5m          # 连续续唤计数冷却时间（过期后重置计数）

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

task:
  terminal_redis_ttl: 15m

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

# KPI/时序库物理分离：ACS 写 trace_messages（已迁时序库）所需的第二个连接池，指向 postgres-tsdb。
tsdb:
  dsn: "postgres://omcgo:omcgo123@postgres-tsdb:5432/omcgo?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"
    trace_bulk: "trace-bulk"

upload:
  base_url: "http://localhost:8080"   # CPE 可访问的 ACS 地址
  path: "/smallcell/FileUploadService"
  # 产品线明确要求 Upload 不走 HTTP Basic Auth：Upload SOAP 给设备的
  # <Username></Username><Password></Password> 都是空标签，设备 PUT 时不会带
  # Authorization header；如果这里配了非空 username，ACS upload handler 会启用
  # Basic Auth 校验 → 直接 401 拒绝设备 PUT → 设备本地报 "httpUpload OM Http Put
  # Upload stat file error" / "Download fail with exit status 1" 兜底错误。
  # 详见 internal/software/executor.go ExecuteOne / ExecuteOneUpload 同名说明。
  username: ""
  password: ""
  max_file_size: 524288000            # 500MB (设备日志包动辄 50-300MB)
  pm_dedup_ttl: 4h                    # 覆盖短时重投，降低 Redis 历史键数量

backpressure:
  queue_pending_high: 5000
  queue_pending_low: 1000
  queue_oldest_high: 10m
  queue_oldest_low: 2m
  queue_slope_window: 5m

download:
  base_url: "http://localhost:8080"   # CPE 可访问的 ACS 地址（网关代理到 ACS）
  path: "/smallcell/FileDownloadService"
  # 同 upload：产品线要求 Download 也不走 Basic Auth。
  username: ""
  password: ""

metrics:
  port: 9090
  # pprof 性能剖析（默认关）。排查 CPU/内存时改 enabled: true 并重启 acs，
  # 即可访问容器内 :9090（宿主 :9095）/debug/pprof/*，例如：
  #   go tool pprof -seconds=30 http://<host>:9095/debug/pprof/profile
  # 等价环境变量：OMCGO_METRICS_PPROF_ENABLED=true（或临时强开 OMCGO_PPROF=1）。排查完改回 false。
  pprof:
    enabled: false
    contention: false   # 额外开 block/mutex 采样（有开销，定位锁/连接池争用时才开）

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/acs/acs.log"
  rotation:
    enabled: true # 是否启用轮转
    max_size_mb: 50 # 单文件最大 MB（触发 size-based 切割）
    max_age_days: 7 # 保留天数（时间维度删旧归档）
    compress: true # 压缩旧文件
    local_time: true # 使用本地时间
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

protocol_log:
  enabled: true
  # issue #218：level 控制每报文全量 XML 记录的级别。
  #   warn（默认）= 抓包记录抑制，稳态零 CPU 开销（不做整段 XML 的 zap 编码），报文跟踪不受影响；
  #   info/debug  = 恢复全量抓包（排障/互操作测试时显式开），落盘体积大。
  level: "warn"
  file_path: "/run/logs/acs/protocol.log"
  max_body_size: 4096  # XML 截断阈值 bytes（issue #218：默认非 0，避免整段多 KB XML 进编码）；0/缺省回退 4096
  rotation:
    enabled: true
    max_size_mb: 50    # 协议日志文件较大
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩；其余 .log → .log.gz，max_age 超时自动删（T-0134 compactor 模式接入）

request_id_prefix: "acs"

# 测试功能：启用随机 RPC 任务注入
# 当 CPE 发送 Inform 时，自动为设备生成 3-10 个随机 RPC 任务
# 仅用于测试，生产环境应设置为 false
enable_test_task_injection: false
