server:
  host: "0.0.0.0"
  port: 8080
  tls_port: 8443
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

session:
  timeout: 5m
  max_concurrent: 10000

rate_limit:
  per_device: 10            # 每设备每分钟最大 Inform 数
  burst: 5                  # token bucket 突发容量
  max_devices: 100000       # 限流器追踪的最大设备数
  cleanup_interval: 5m      # 不活跃设备清理扫描间隔
  cleanup_timeout: 10m      # 设备不活跃淘汰超时

auth:
  mode: "none"
  username: ""
  password: ""

redis:
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://localhost:4222"
  max_reconnect: -1
  reconnect_wait: 2s

db:
  dsn: "postgres://omcgo:omcgo123@localhost:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s

metrics:
  port: 9090

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/var/log/omcgo/worker.log"
  rotation:
    enabled: true # 是否启用轮转
    max_size_mb: 20 # 单文件最大 MB
    max_age_days: 7 # 保留天数
    max_backups: 100 # 最大备份数
    compress: true # 压缩旧文件
    local_time: true # 使用本地时间

request_id_prefix: "acs"
