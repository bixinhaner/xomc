db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: true
  log_sql_slow_threshold: 500

tsdb:
  # KPI/时序库物理分离：指向独立时序库实例 postgres-tsdb（不再与主库 postgres 同实例）。
  dsn: "postgres://omcgo:omcgo123@postgres-tsdb:5432/omcgo?sslmode=disable"
  # ingest=4 + finalize=32 + 三路各 8 个聚合消费者 + reserve=8 = 68，max_conns 须 ≥ 并发预算。
  max_conns: 80
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: false
  log_sql_slow_threshold: 1000

redis:
  addrs:
    - "redis-core:6379"
  password: ""
  db: 0
  pool_size: 100

pm_redis:
  addrs:
    - "redis-pm:6379"
  password: ""
  db: 0
  pool_size: 100

# Reliable parameter-sync data plane. Keep disabled until migration 000021 is applied.
param_sync:
  run_enabled: false
  result_consumer_enabled: false
  staging_enabled: false
  canary_percent: 0
  legacy_fallback_enabled: true

# 告警生命周期迁移开关：默认 legacy；shadow 仅用于 Outbox 对比验证。
alarm:
  lifecycle_mode: legacy
  lifecycle_stream_max_bytes: 10737418240
  lifecycle_start_sequence: 1

# 与 app 共用同一套 SMTP 配置语义；生产秘密通过部署配置注入。
notification:
  smtp:
    enabled: false
    host: ""
    port: 25
    username: ""
    password: ""
    from: "omc-alert@example.com"
    tls_mode: none
    timeout: 10s
  zed_summary:
    enabled: false
    send_time: "00:00"
    time_zone: "Asia/Shanghai"
    recipients: []

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"
    trace_bulk: "trace-bulk"

# PM 文件入库消费者的进程内并发订阅数（pm.file.received → 解析入库）。
# NATS push 订阅 async 回调单 goroutine 串行（单订阅只用 ~1 核）；N 个订阅共享 durable
# consumer "pm-workers" 由 JetStream 负载均衡，吃满 worker 多核。<=0 回退 GOMAXPROCS（容器
# CPU 配额），上限 32。worker 容器配 4 核，故设 4。
pm_consumer_concurrency: 4

raw_cleanup:
  enabled: true
  mode: shadow
  batch_size: 100
  min_rate: 5
  max_rate: 100
  rate_headroom: 1.5
  recalculate_interval: 5m
  object_timeout: 10s
  prometheus_url: "http://prometheus:9090"

# PM 指标大批量写关掉 WAL 同步落盘（synchronous_commit=off）换吞吐：PM 数据可从 MinIO 重建，
# 崩溃最多丢已提交未刷盘的最后几 ms 行，可接受。默认 false（durable），写瓶颈下开。
pm_async_commit: true

# KPI 计算取数路径：false=用内存刚解析的 counter 直接算（默认，省每文件一次全量回读 SELECT）；
# true=从 DB 按 15min 窗回读再算（仅"同窗拆多文件需跨文件聚合"部署才需要）。
pm_kpi_window_from_db: false

# T-0157 C2: 任务过期扫描器配置（worker 进程消费）。
# default_expires_in_seconds 在 worker 不使用（CreateTask 在 app 端兜底），保留占位让两端一致。
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10
  reconcile_interval_seconds: 30
  terminal_redis_ttl: 15m

# #358: 离线设备活动告警清理器阈值/周期/批量。设备离线满 threshold_seconds 仍未恢复，
# 下一轮扫描（<=interval_seconds）把其当前活动告警归档到历史告警（clearedBy=system:offline_timeout）。
# 与设备离线检测阈值（offline_threshold.go，#203）对齐，运营商可把告警收敛调到分钟级。
# 任一字段 <=0 或缺省则回退代码 Default*（threshold 3600s / interval 300s / batch 200）。
offline_alarm_cleanup:
  threshold_seconds: 3600
  interval_seconds: 300
  batch_size: 200

# 设备上线时（device.online 事件）自动下发 PM 文件上传配置（KPI 上报参数整理.md 三参数）：
#   Device.FAP.PerfMgmt.Config.1.Enable = enable_value
#   Device.FAP.PerfMgmt.Config.1.URL = 渲染后的 upload_url_template
#   Device.FAP.PerfMgmt.Config.1.PeriodicUploadInterval = periodic_upload_interval
# upload_url_template 支持 ${VAR} / ${VAR:-default} 环境变量插值
# OMC_PUBLIC_HOST 由 docker-compose 注入（生产部署填本机对外 IP，如 172.19.1.132）
pm:
  # 端口走 :8080 — CPE 通过 web 容器的 nginx 反代到 acs:7557（设计标准）。
  # 与 ACS 自身 config.{dev,prod}.yaml 的 upload.base_url=:8080 保持一致，
  # 享受 nginx 500MB client_max_body_size 限制与统一访问日志。
  upload_url_template: "http://${OMC_PUBLIC_HOST:-localhost}:8080/smallcell/FileUploadService?fileType=PM&filename="
  enable_value: "1"
  periodic_upload_interval: 900
  auto_setup_on_online: true
  # 日/周/月聚合桶按业务时区切本地零点（T-0192）；空值代码默认 Asia/Shanghai。
  # 影响日/周/月桶的本地零点对齐（北京 00:00 = UTC 前一日 16:00）；hourly 整点对齐时区无关。
  timezone: Asia/Shanghai
  storage:
    # 聚合任务结果落库范围（T-0182，全局开关，非任务级）：
    #   true  = 全存（默认）：所有指标都落库，事后改任务指标集无需重算
    #   false = 仅存所选：只落任务定义的 N 个指标，省存储
    # 只影响"落哪些指标"，不影响"查看/导出限 N 个"收口规则。
    store_all_metrics: true

# F05 MR 测量任务的 scheduler / dispatcher / cleaner 已迁到 app 进程（B 方案，2026-05-25），
# worker 端不再需要 mr 配置段。Collector（mr.file.received → 解析）仍在 worker，
# 它本身不读 mr.* 配置。

metrics:
  port: 9092
  # pprof 性能剖析（默认关）。排查 CPU/内存时改 enabled: true 并重启 worker，
  # 即可访问 :9092/debug/pprof/*（go tool pprof -seconds=30 ...）。排查完改回 false。
  # 等价环境变量：OMCGO_METRICS_PPROF_ENABLED=true（或临时强开 OMCGO_PPROF=1）。
  pprof:
    enabled: false
    contention: false   # 额外开 block/mutex 采样（有开销，定位锁/连接池争用时才开）

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 1.0

# T-0178 P2: worker 自定义 XML 备份清理 cron 需读 XMLBaseDir + ParamModel 子配置
# (app yaml 同名段在 cmd/app/etc/config.dev.yaml 维护;两份配置保持一致)
dict_loader:
  xml_base_dir: "data"
  param_model:
    directory: "param-mappings"        # 单目录(builtin + custom XML 同住,sidecar 判来源)
    backup_retention_days: 30          # .deleted/.bak 保留天数(空→默认 30)
    backup_cleanup_cron: "0 3 * * *"   # 每天凌晨 3 点扫(空→默认同左)

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/worker/worker.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "worker"
