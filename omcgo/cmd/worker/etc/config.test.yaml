db:
  dsn: "postgres://omcgo:omcgo123@172.19.1.73:5432/omcgo?sslmode=disable"
  # 连接池核定（#24）：与 prod 对齐，worker PG 池温和上调 20→25。聚合预算见 app/config.prod.yaml。
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: true
  log_sql_slow_threshold: 500

tsdb:
  # KPI/时序库物理分离：指向独立时序库实例（测试主机 postgres-tsdb 宿主映射端口 5433，与主库 5432 物理分离）。
  dsn: "postgres://omcgo:omcgo123@172.19.1.73:5433/omcgo?sslmode=disable"
  # ingest=4 + finalize=32 + 三路各 8 个聚合消费者 + reserve=8 = 68，max_conns 须 ≥ 并发预算。
  max_conns: 80
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: false
  log_sql_slow_threshold: 1000

redis:
  addrs:
    - "172.19.1.73:6379"
  password: ""
  db: 0
  pool_size: 100

pm_redis:
  addrs:
    - "172.19.1.73:6381"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://172.19.1.73:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "172.19.1.73:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

# 测试环境固定并发，避免高核宿主机按 GOMAXPROCS 回退后超过 TSDB 连接预算。
pm_consumer_concurrency: 4

raw_cleanup:
  enabled: true
  mode: shadow
  batch_size: 100
  min_rate: 5
  max_rate: 100
  rate_headroom: 1.5
  recalculate_interval: 5m
  object_timeout: 10s
  prometheus_url: "http://prometheus:9090"

# T-0157 C2: 任务过期扫描器配置
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10
  reconcile_interval_seconds: 30
  terminal_redis_ttl: 15m

# #358: 离线设备活动告警清理器（test 环境用分钟级短阈值，便于运行时复现收敛窗口）。
# 任一字段 <=0 或缺省则回退代码 Default*（threshold 3600s / interval 300s / batch 200）。
offline_alarm_cleanup:
  threshold_seconds: 120
  interval_seconds: 30
  batch_size: 200

# PM 文件上传自动下发配置（test 环境默认关闭，避免影响压测和 E2E 设备）
pm:
  upload_url_template: "http://${OMC_PUBLIC_HOST:-localhost}:7557/smallcell/FileUploadService?fileType=PM&filename="
  enable_value: "1"
  periodic_upload_interval: 900
  auto_setup_on_online: false
  # 日/周/月聚合桶业务时区（T-0192）；空默认 Asia/Shanghai。
  timezone: Asia/Shanghai
  storage:
    # T-0182 聚合结果落库范围：true=全存（默认），false=仅存所选
    store_all_metrics: true

metrics:
  port: 9092

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/worker/worker.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "worker"
