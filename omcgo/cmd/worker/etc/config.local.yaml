db:
  dsn: "postgres://omcgo:omcgo123@localhost:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: true
  log_sql_slow_threshold: 500

tsdb:
  # KPI/时序库物理分离：本机裸跑时序库实例在 localhost:5433（postgres-tsdb 宿主映射）。
  dsn: "postgres://omcgo:omcgo123@localhost:5433/omcgo?sslmode=disable"
  # ingest=4 + finalize=32 + 三路各 8 个聚合消费者 + reserve=8 = 68，max_conns 须 ≥ 并发预算。
  max_conns: 80
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: false
  log_sql_slow_threshold: 1000

redis:
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 100

pm_redis:
  addrs:
    - "localhost:6381"
  password: ""
  db: 0
  pool_size: 100

# Reliable parameter-sync data plane. Keep disabled until migration 000021 is applied.
param_sync:
  run_enabled: false
  result_consumer_enabled: false
  staging_enabled: false
  canary_percent: 0
  legacy_fallback_enabled: true

nats:
  url: "nats://localhost:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

# 本机默认 4 路 PM 入库；完整聚合并发预算不超过 tsdb.max_conns=40。
pm_consumer_concurrency: 4

# T-0157 C2: 任务过期扫描器配置
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10
  reconcile_interval_seconds: 30
  terminal_redis_ttl: 15m

# #358: 离线设备活动告警清理器（local 开发用分钟级短阈值，便于本地复现收敛）。
# 任一字段 <=0 或缺省则回退代码 Default*（threshold 3600s / interval 300s / batch 200）。
offline_alarm_cleanup:
  threshold_seconds: 120
  interval_seconds: 30
  batch_size: 200

# PM 文件上传自动下发配置（local 开发，OMC_PUBLIC_HOST 不设时回退 localhost — 基站不可达）
pm:
  upload_url_template: "http://${OMC_PUBLIC_HOST:-localhost}:7557/smallcell/FileUploadService?fileType=PM&filename="
  enable_value: "1"
  periodic_upload_interval: 900
  auto_setup_on_online: true

metrics:
  port: 9092

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "../run/logs/worker/worker.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "worker"
