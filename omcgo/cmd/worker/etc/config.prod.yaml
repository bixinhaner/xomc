db:
  # 【全 docker compose 部署】使用 service 名 postgres（容器间 docker network 解析）
  dsn: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"  # 凭据由 deploy/.env 经 compose 注入 ${POSTGRES_*}，Load() 解析前展开（单一真值源）
  # 连接池核定（#24）：worker 是 PM/MR 文件处理 + KPI 计算的后台批负载，并发受 WorkerPool
  # 约束，PG 池温和上调 20→25。聚合预算见 app/config.prod.yaml 与 migrations/README.md。
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  # KPI/时序库物理分离：指向独立时序库实例 postgres-tsdb（凭据/主机由 deploy/.env 经 compose 注入 ${POSTGRES_TSDB_*}/${TSDB_HOST}）。
  dsn: "postgres://${POSTGRES_TSDB_USER}:${POSTGRES_TSDB_PASSWORD}@${TSDB_HOST}:5432/${POSTGRES_TSDB_DB}?sslmode=disable"
  # 连接池核定（#24）：KPI 聚合和 PM 原始入库共享本池。
  # 2 万设备槽位上报会与 12 分钟后的小时结算重叠：32 路 PM COPY + 32 路
  # finalize + normalized/hourly/daily 三路各 16 个聚合写消费者 + 8 路后台余量，
  # 共需 120 连接；按 2 的幂次上取整为 128。低于此预算会让结算抢占入库连接并放大 pm-workers pending。
  max_conns: 128
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 2000

redis:
  addrs:
    - "redis-core:6379"
  password: ""
  db: 0
  pool_size: 100

pm_redis:
  addrs:
    - "redis-pm:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  access_key: "${MINIO_ROOT_USER}"    # 由 deploy/.env 注入 ${MINIO_ROOT_USER}
  secret_key: "${MINIO_ROOT_PASSWORD}"  # 由 deploy/.env 注入 ${MINIO_ROOT_PASSWORD}
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

# PM 文件入库消费者的进程内并发订阅数（pm.file.received → 解析入库）。
# 共享 durable consumer "pm-workers" 由 JetStream 负载均衡，吃满 worker 多核。
# <=0 回退 GOMAXPROCS（容器 CPU 配额），上限 32。
# 2026-07-21 压测实测（20000 设备规模）：初次显式设为 16（旧上限）验证消费吞吐翻倍
# （~10/s→~20/s）且 worker CPU 仍有余量（~30%），随即代码上限从 16 上调到 32
# （见 cmd/worker/main.go 注释）；tsdb.max_conns 按 PM 入库与小时结算并发相加核定，
# 避免两个正常波峰重叠时连接池成为瓶颈。
pm_consumer_concurrency: 32

raw_cleanup:
  enabled: true
  mode: shadow
  batch_size: 100
  min_rate: 5
  max_rate: 100
  rate_headroom: 1.5
  recalculate_interval: 5m
  object_timeout: 10s
  prometheus_url: "http://prometheus:9090"

# PM 指标大批量写关掉 WAL 同步落盘（synchronous_commit=off）换吞吐：PM 数据可从 MinIO 重建。
# 默认 false（durable）；写吞吐瓶颈下置 true。
# 2026-07-21 压测实测（20000设备/32并发）过 true：tsdb pg_stat_activity 观测到 WALWrite
# 等待，但隔离对比测试（同批次分别测 async_commit 单独开/关）显示吞吐差异在噪音范围内
# （压测环境生产速率本身波动过大，未能得出确认的收益），故保持默认 false，不在此环境
# 下强行开启一个效果不确定的开关。
pm_async_commit: false

# KPI 计算取数：false=内存 counter 直接算（默认，省每文件回读）；true=DB 回读（同窗多文件部署）。
pm_kpi_window_from_db: false

# T-0157 C2: 任务过期扫描器配置
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10
  reconcile_interval_seconds: 30
  terminal_redis_ttl: 15m

# #358: 离线设备活动告警清理器阈值/周期/批量。设备离线满 threshold_seconds 仍未恢复，
# 下一轮扫描（<=interval_seconds）把其当前活动告警归档到历史告警（clearedBy=system:offline_timeout）。
# 与设备离线检测阈值（offline_threshold.go，#203）对齐口径，运营商可按需收敛。
# 任一字段 <=0 或缺省则回退代码 Default*（threshold 3600s / interval 300s / batch 200）。
offline_alarm_cleanup:
  threshold_seconds: 3600
  interval_seconds: 300
  batch_size: 200

# 设备上线时自动下发 PM 文件上传配置（KPI 上报参数整理.md 三参数）。
# OMC_PUBLIC_HOST 必须在生产环境部署时填本机对外 IP（基站可达），不能用 localhost。
pm:
  upload_url_template: "http://${OMC_PUBLIC_HOST}:7557/smallcell/FileUploadService?fileType=PM&filename="
  enable_value: "1"
  periodic_upload_interval: 900
  auto_setup_on_online: true
  # 日/周/月聚合桶业务时区（T-0192）；空默认 Asia/Shanghai。
  timezone: Asia/Shanghai
  storage:
    # T-0182 聚合结果落库范围：true=全存（默认），false=仅存所选
    store_all_metrics: true

notification:
  smtp:
    enabled: false
    host: ""
    port: 25
    security_mode: "none"
    auth_enabled: false
    username: ""
    password: ""
    from: "omc-alert@example.com"
    timeout: 10s

metrics:
  port: 9092
  # pprof 性能剖析（默认关）。线上排查 CPU/内存时改 enabled: true 并重启 worker，
  # 即可访问 :9092/debug/pprof/*（go tool pprof -seconds=30 ...）。排查完务必改回 false。
  # 等价环境变量：OMCGO_METRICS_PPROF_ENABLED=true（或临时强开 OMCGO_PPROF=1）。
  pprof:
    enabled: false
    contention: false   # 额外开 block/mutex 采样（有开销，定位锁/连接池争用时才开）

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 0.1

# T-0178 P2: worker 自定义 XML 备份清理 cron 需读 XMLBaseDir + ParamModel 子配置
# (app yaml 同名段在 cmd/app/etc/config.prod.yaml 维护;两份配置保持一致)
dict_loader:
  xml_base_dir: "data"
  param_model:
    directory: "param-mappings"        # 单目录(builtin + custom XML 同住,sidecar 判来源)
    backup_retention_days: 30          # .deleted/.bak 保留天数(空→默认 30)
    backup_cleanup_cron: "0 3 * * *"   # 每天凌晨 3 点扫(空→默认同左)

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/worker/worker.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "worker"
