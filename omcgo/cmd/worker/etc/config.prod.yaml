db:
  dsn: "${DB_DSN}"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  dsn: "${TSDB_DSN}"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 2000

redis:
  addrs:
    - "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 100

nats:
  url: "${NATS_URL}"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "${MINIO_ENDPOINT}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  use_ssl: true
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"

metrics:
  port: 9092

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/var/log/omcgo/worker.log"
  rotation:
    enabled: true
    max_size_mb: 5
    max_age_days: 7
    max_backups: 20
    compress: true
    local_time: true

request_id_prefix: "worker"
