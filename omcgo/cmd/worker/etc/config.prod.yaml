db:
  # 【全 docker compose 部署】使用 service 名 postgres（容器间 docker network 解析）
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 2000

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

# T-0157 C2: 任务过期扫描器配置
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10

# 设备上线时自动下发 PM 文件上传配置（KPI 上报参数整理.md 三参数）。
# OMC_PUBLIC_HOST 必须在生产环境部署时填本机对外 IP（基站可达），不能用 localhost。
pm:
  upload_url_template: "http://${OMC_PUBLIC_HOST}:7557/smallcell/FileUploadService?fileType=PM&filename="
  enable_value: "1"
  periodic_upload_interval: 900
  auto_setup_on_online: true
  # 日/周/月聚合桶业务时区（T-0192）；空默认 Asia/Shanghai。
  timezone: Asia/Shanghai
  storage:
    # T-0182 聚合结果落库范围：true=全存（默认），false=仅存所选
    store_all_metrics: true

metrics:
  port: 9092

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 0.1

# T-0178 P2: worker 自定义 XML 备份清理 cron 需读 XMLBaseDir + ParamModel 子配置
# (app yaml 同名段在 cmd/app/etc/config.prod.yaml 维护;两份配置保持一致)
dict_loader:
  xml_base_dir: "data"
  param_model:
    directory: "param-mappings"
    custom_directory: "param-mappings-custom"
    backup_retention_days: 30          # .deleted/.bak 保留天数(空→默认 30)
    backup_cleanup_cron: "0 3 * * *"   # 每天凌晨 3 点扫(空→默认同左)

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/worker/worker.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "worker"
