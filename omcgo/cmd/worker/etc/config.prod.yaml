db:
  # 【全 docker compose 部署】使用 service 名 postgres（容器间 docker network 解析）
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 2000

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 100

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

# T-0157 C2: 任务过期扫描器配置
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10

metrics:
  port: 9092

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 0.1

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/worker/worker.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "worker"
