server:
  host: "0.0.0.0"
  port: 8081
  tls_port: 8444
  grpc_port: 50051
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 50
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 2000

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 200

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

conn_req:
  server_addr: "acs:7547"
  shared_secret: "dps"

jwt:
  secret: "omcgo-prod-jwt-secret-key-minimum-32-characters!!"
  access_token_ttl: 30m
  refresh_token_ttl: 168h

# 登录类接口密码 RSA-OAEP 加密传输。
# 多副本部署时此路径必须挂载同一份 K8s Secret，确保各副本使用同一密钥（keyID 一致）。
login_crypto:
  private_key_path: "/etc/omcgo/keys/login_rsa_private.pem"
  # T-0120：允许明文密码登录 / 改密（非 secure context 部署 escape hatch）。
  # 默认 false。设为 true 后前端在 http://内网IP 访问 crypto.subtle 不可用时
  # 自动 fallback 发明文 password，后端 audit log 标记 reason=plaintext_login。
  # **仅推荐内网受信网络 + 完整 audit 闭环时启用**；公网部署应保持 false，
  # 强制 TLS 加密路径（参 deployments/docker/TLS-SETUP.md 自签证书快速启用）。
  allow_plaintext: false

cors:
  allow_origins:
    - "http://localhost:8080"
    - "http://localhost:8081"

northbound:
  push_targets: []

# T-0100-P4-B/C + P5-a/b — License 治理层运行时配置（详 docs/project/prd/F06-license.md §5.3 §5.4）
# prod 推荐：填 public_key_dir + strict=true 收紧（OEM 颁发 license 须带签名）；
# P5-a W4：strict=true 但 KeyCount==0 时启动 Fatal，运维误配可立即定位。
license:
  signing:
    public_key_dir: "/etc/omcgo/oem_public_keys"
    strict: true
  log_archive:
    retention_months: 6
    minio_bucket: ""  # 空 → fallback minio.buckets.logs
    schedule: "0 3 * * 0"

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

provision:
  enabled: true
  auto_configure: false
  task_timeout: 15m
  model_upload:
    enabled: false
    upload_url: "http://acs:7547/smallcell/FileUploadService"
    upload_username: ""
    upload_password: ""
    auto_activate_model: false
    upload_timeout: 5m
  auto_discovery:
    enabled: false
    max_concurrent: 10
    gpn_timeout: 60s
    gpv_batch_size: 50
    gpv_timeout: 30s
    auto_activate_model: false
  auto_sync:
    enabled: false
    sync_on_bootstrap: true
    sync_on_firmware_change: true
    max_concurrent: 20

datamodel_expiry:
  auto_max_idle_days: 15
  manual_max_idle_days: 60
  cleanup_cron: "0 3 * * *"

batch_processor:
  enabled: true           # 启用 Periodic Inform 批量处理
  workers: 8              # 生产环境建议 CPU 核数 / 2
  flush_interval: 10s     # 批量刷新间隔
  max_batch_size: 500     # 生产环境单次批量上限
  input_buffer: 5000      # 每个 worker 输入通道缓冲
  shutdown_timeout: 30s   # 优雅关闭超时

metrics:
  port: 9091

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/app/app.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "app"
