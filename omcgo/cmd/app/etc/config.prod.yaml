server:
  host: "0.0.0.0"
  port: 8081
  tls_port: 8444
  grpc_port: 50051
  tls:
    enabled: true
    cert_file: "${TLS_CERT_FILE}"
    key_file: "${TLS_KEY_FILE}"

db:
  dsn: "${DB_DSN}"  # e.g. postgres://omcgo:xxx@db-host:5432/omcgo?sslmode=require
  max_conns: 50
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  dsn: "${TSDB_DSN}"  # e.g. postgres://omcgo:xxx@tsdb-host:5432/omcgo?sslmode=require
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 2000

redis:
  addrs:
    - "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 200

nats:
  url: "${NATS_URL}"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "${MINIO_ENDPOINT}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  use_ssl: true
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"

jwt:
  secret: "${JWT_SECRET}"  # minimum 32 characters, must not be default value
  access_token_ttl: 30m
  refresh_token_ttl: 168h

cors:
  allow_origins:
    - "${CORS_ORIGIN}"

northbound:
  push_targets: []

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

provision:
  enabled: true
  auto_discovery:
    enabled: false
    max_concurrent: 10
    gpn_timeout: 60s
    gpv_batch_size: 50
    gpv_timeout: 30s
    auto_activate_model: false
  auto_sync:
    enabled: false
    sync_on_bootstrap: true
    sync_on_firmware_change: true
    max_concurrent: 20

metrics:
  port: 9091

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "../run/logs/app/app.log"
  rotation:
    enabled: true
    max_size_mb: 5
    max_age_days: 7
    max_backups: 20
    compress: true
    local_time: true

request_id_prefix: "app"
