server:
  host: "0.0.0.0"
  port: 8081
  tls_port: 8444
  grpc_port: 50051
  read_timeout: 5m
  write_timeout: 5m
  idle_timeout: 10m
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

db:
  # 【全 docker compose 部署】使用 service 名 postgres；app 容器与 postgres 容器
  # 同 project 共享 docker network，进行内部名字解析。如仅起动 host 二进制调试，
  # 可临时改为 127.0.0.1（infra 的 5432 publish 到 127.0.0.1）。
  dsn: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"  # 凭据由 deploy/.env 经 compose 注入 ${POSTGRES_*}，Load() 解析前展开（单一真值源）
  # 连接池核定（#24）：app 是 REST+gRPC 主负载，PG 池上调 50→60。
  # 单副本全栈聚合预算：app(PG 60 + TS 40) + acs(PG 30) + worker(PG 25 + TS 25) = 180，
  # 需 PostgreSQL max_connections ≥ 200（留 superuser/复制余量）。app/acs 横向扩容时
  # 按副本数线性累加，逼近 PG 上限前必须前置 pgbouncer（transaction pooling）复用连接。
  # 详见 migrations/README.md「连接池核定（#24）」。
  max_conns: 60
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

tsdb:
  # KPI/时序库物理分离：指向独立时序库实例 postgres-tsdb（凭据/主机由 deploy/.env 经 compose 注入 ${POSTGRES_TSDB_*}/${TSDB_HOST}）。
  dsn: "postgres://${POSTGRES_TSDB_USER}:${POSTGRES_TSDB_PASSWORD}@${TSDB_HOST}:5432/${POSTGRES_TSDB_DB}?sslmode=disable"
  # 连接池核定（#24）：PM/KPI/告警历史时序读写，TS 池上调 30→40。
  max_conns: 40
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: false
  log_sql_params: false
  log_sql_slow_threshold: 1000

dashboard:
  query_timeout: 3s
  statement_timeout: 2500ms
  max_concurrent: 4
  queue_timeout: 100ms
  fresh_cache_ttl: 4m30s
  stale_ttl: 15m

redis:
  addrs:
    - "redis-core:6379"
  password: ""
  db: 0
  pool_size: 200

pm_redis:
  addrs:
    - "redis-pm:6379"
  password: ""
  db: 0
  pool_size: 200

# Durable parameter-sync data plane runtime tuning. The data plane is always active.
param_sync:
  manual_offline_mode: reject
  result_consumer_shard_count: 16
  result_consumer_queue_depth: 64
  result_consumer_pull_batch_size: 64
  result_consumer_pull_concurrency: 64
  result_consumer_ack_wait: 2m
  result_consumer_max_ack_pending: 512
  recovery_run_limit: 200
  recovery_task_limit_per_run: 200
  recovery_task_budget: 200

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  # 浏览器 / 外部 SDK 可达的 MinIO 公网地址（host[:port]，无 scheme），
  # 用于签发 License / 配置备份 / 文件导出等下载的预签名 URL。
  # 【主流用法】部署后进「系统配置 → 存储」填写对外可达地址（热生效不需重启），
  # 下面的 ${MINIO_PUBLIC_ENDPOINT} 仅作为启动期兑底；UI 未填 + env 未注入时会
  # 回退用 endpoint (minio:9000) 签发，浏览器无法解析该内网主机名会报 ERR_NAME_NOT_RESOLVED
  # （qa-614 #377 初始场景；issue #548 已上线运行时订阅桥）。
  public_endpoint: "${MINIO_PUBLIC_ENDPOINT}"
  access_key: "${MINIO_ROOT_USER}"    # 由 deploy/.env 注入 ${MINIO_ROOT_USER}
  secret_key: "${MINIO_ROOT_PASSWORD}"  # 由 deploy/.env 注入 ${MINIO_ROOT_PASSWORD}
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

conn_req:
  server_addr: "acs:7547"
  shared_secret: "${OMC_SHARED_SECRET}"  # TR-069 ConnReq/STUN 共享密钥，由 deploy/.env 注入 ${OMC_SHARED_SECRET}

jwt:
  secret: "${OMCGO_JWT_SECRET}"  # ≥32 字符，由 deploy/.env 注入 ${OMCGO_JWT_SECRET}
  access_token_ttl: 30m
  refresh_token_ttl: 168h

# 登录类接口密码 RSA-OAEP 加密传输。
# 多副本部署时此路径必须挂载同一份 K8s Secret，确保各副本使用同一密钥（keyID 一致）。
login_crypto:
  private_key_path: "/etc/omcgo/keys/login_rsa_private.pem"
  # T-0120：允许明文密码登录 / 改密（非 secure context 部署 escape hatch）。
  # 默认 false。设为 true 后前端在 http://内网IP 访问 crypto.subtle 不可用时
  # 自动 fallback 发明文 password，后端 audit log 标记 reason=plaintext_login。
  # **仅推荐内网受信网络 + 完整 audit 闭环时启用**；公网部署应保持 false，
  # 强制 TLS 加密路径（参 deployments/docker/TLS-SETUP.md 自签证书快速启用）。
  allow_plaintext: false

cors:
  allow_origins:
    - "http://localhost:8080"
    - "http://localhost:8081"

northbound:
  push_targets: []

# T-0100-P4-B/C + P5-a/b — License 治理层运行时配置（详 docs/project/prd/F06-license.md §5.3 §5.4）
# 旧项目 TrueLicense .lic 的 JKS/DSA 验签配置。
license:
  signing:
    # omcPublicKey.store 是公钥库（随仓库分发、只读挂载），bcb9omc6 是其完整性密码
    # （非签名私钥，私钥不在仓库），正式发布默认用此值开箱即用；自定义 keystore 用
    # OMC_LICENSE_STORE_PASSWORD 覆盖。
    legacy_keystore_path: "/etc/omc/license/omcPublicKey.store"
    legacy_store_password: "${OMC_LICENSE_STORE_PASSWORD:-bcb9omc6}"
    legacy_key_alias: "omcPublicKey"
    legacy_verify_integrity: true
  log_archive:
    retention_months: 6
    minio_bucket: ""  # 空 → fallback minio.buckets.logs
    schedule: "0 3 * * 0"

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

# Task 默认行为（T-0157 C1 引入），详见 config.dev.yaml 注释。
# prod 与 dev/test 取同一默认值（120s）；若现场设备 RTT 偏长可在此覆盖。
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10
  wake_concurrency: 256  # issue #12: wakeDevice 唤醒并发上界（防 10 万风暴峰值 OOM）
  terminal_redis_ttl: 15m

provision:
  enabled: true
  auto_configure: false
  task_timeout: 15m
  gpv_response:
    provision_queue: "${GPV_PROVISION_QUEUE:-provision-gpv}"
    provision_concurrency: ${GPV_PROVISION_CONCURRENCY:-2}
    provision_queue_depth: ${GPV_PROVISION_QUEUE_DEPTH:-256}
    rpc_durable: "${GPV_RPC_DURABLE:-device-rpc-gpv}"
    rpc_start_sequence: ${GPV_RPC_START_SEQUENCE:-0}
    rpc_concurrency: ${GPV_RPC_CONCURRENCY:-2}
    rpc_queue_depth: ${GPV_RPC_QUEUE_DEPTH:-1000}
    ack_wait: "${GPV_ACK_WAIT:-30s}"
    max_deliver: ${GPV_MAX_DELIVER:-5}
    max_ack_pending: ${GPV_MAX_ACK_PENDING:-2000}
  model_upload:
    enabled: false
    upload_url: "http://acs:7547/smallcell/FileUploadService"
    upload_username: ""
    upload_password: ""
    auto_activate_model: false
    upload_timeout: 5m
  auto_discovery:
    enabled: false
    max_concurrent: 10
    gpn_timeout: 60s
    gpv_batch_size: 50
    gpv_timeout: 30s
    auto_activate_model: false
  auto_sync:
    enabled: true
    sync_on_bootstrap: true
    sync_on_firmware_change: true
    max_concurrent: 20
    gpv_batch_size: 100

datamodel_expiry:
  auto_max_idle_days: 15
  manual_max_idle_days: 60
  cleanup_cron: "0 3 * * *"

# T-0098 P1-06 + T-0178: 4 域字典启动期加载 + 自定义 paramModel XML 分层目录
# (LATENT BUG fix: 此前 prod.yaml 未配 dict_loader,XMLBaseDir 走零值导致
# Loader 实际扫描路径退化为 cwd 下"param-mappings/",与 Dockerfile.app 的
# COPY data/ → /etc/omcgo/data 不一致。本节修复 + 引入 T-0178 字段。)
dict_loader:
  xml_base_dir: "data"           # 相对 cwd /etc/omcgo;Dockerfile.app COPY 至 /etc/omcgo/data
  auto_load_on_startup: true
  cache_version_poll_interval: 30s
  load_concurrency: 4
  param_model:
    directory: "param-mappings"
    standard_model_file: "standard-model.xml"
    param_model_files: []        # 空 → Loader 扫除 standard-model.xml/products.xml/旧 routing 之外的 *.xml
    # 三库 XML 导入重构(2026-06-04):所有 XML 同住 directory,来源由 sidecar(X.xml.custom)判定。
    # custom_directory / custom_overrides_builtin 已废弃。备份清理扫 directory 下残留 + 孤儿 sidecar
    backup_retention_days: 30
    backup_cleanup_cron: "0 3 * * *"
  indicator:
    base_directory: "indicator-library"
    enb_subdir: "enb"
    gsm_file: "GSM.xml"
    gnb_file: "GNB.xml"
  alarm_definition:
    directory: "alarm-definitions"
  product:
    directory: "param-mappings"
    file: "products.xml"
  quick_settings:
    directory: "quicksettings"

batch_processor:
  enabled: true           # 启用 Periodic Inform 批量处理
  workers: 8              # 生产环境建议 CPU 核数 / 2
  flush_interval: 10s     # 批量刷新间隔
  max_batch_size: 500     # 生产环境单次批量上限
  input_buffer: 5000      # 每个 worker 输入通道缓冲
  shutdown_timeout: 30s   # 优雅关闭超时

# 通知中心（T-0152）：SMTP 邮件发送器 + Alertmanager 告警 webhook 入口
# ⚠️ 生产部署：配好内网 SMTP 后把 smtp.enabled 改 true 并填 host/from；
#    告警邮件需在 alert_webhook.recipients 填收件人。
notification:
  smtp:
    enabled: false              # 配好内网 SMTP 服务器后改 true
    host: ""                    # 内网 SMTP 服务器地址
    port: 25
    username: ""                # 留空 = 不做 SMTP AUTH
    password: ""
    from: "omc-alert@example.com"
    starttls: false             # SMTP 支持 STARTTLS 时改 true
    timeout: 10s
  alert_webhook:
    token: ""                   # 建议生产填随机串，Alertmanager 侧带 Bearer
    recipients: []              # 告警邮件收件人，如 ["ops@example.com"]

metrics:
  port: 9091
  # pprof 性能剖析（默认关）。线上排查 CPU/内存时改 enabled: true 并重启 app，
  # 即可访问 http://<host>:9091/debug/pprof/*。排查完务必改回 false。
  # 等价环境变量：OMCGO_METRICS_PPROF_ENABLED=true（或临时强开 OMCGO_PPROF=1）。
  pprof:
    enabled: false
    contention: false   # 额外开 block/mutex 采样（有开销，定位锁/连接池争用时才开）

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 0.1

log:
  level: "warn"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/app/app.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 30
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "app"
