server:
  host: "0.0.0.0"
  port: 8081
  tls_port: 8444
  grpc_port: 50051
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

db:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 50
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: true
  log_sql_slow_threshold: 500

tsdb:
  dsn: "postgres://omcgo:omcgo123@postgres:5432/omcgo?sslmode=disable"
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: false
  log_sql_slow_threshold: 1000

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 200

nats:
  url: "nats://nats:4222"
  max_reconnect: -1
  reconnect_wait: 2s

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

conn_req:
  server_addr: "acs:7547"
  shared_secret: "dps"

jwt:
  secret: "change-me-in-production-minimum-32-characters!!"
  access_token_ttl: 30m
  refresh_token_ttl: 168h

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

northbound:
  push_targets: []

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

provision:
  enabled: true
  auto_configure: false
  task_timeout: 15m
  model_upload:
    enabled: false
    upload_url: "http://acs:7547/smallcell/FileUploadService"
    upload_username: ""
    upload_password: ""
    auto_activate_model: false
    upload_timeout: 5m
  auto_discovery:
    enabled: false
    max_concurrent: 10
    gpn_timeout: 60s
    gpv_batch_size: 50
    gpv_timeout: 30s
    auto_activate_model: false
  auto_sync:
    enabled: false
    sync_on_bootstrap: true
    sync_on_firmware_change: true
    max_concurrent: 20

datamodel_expiry:
  auto_max_idle_days: 15
  manual_max_idle_days: 60
  cleanup_cron: "0 3 * * *"

batch_processor:
  enabled: false          # 测试环境默认关闭，走逐条处理便于调试
  workers: 2
  flush_interval: 5s
  max_batch_size: 50
  input_buffer: 500
  shutdown_timeout: 10s

metrics:
  port: 9091

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/app/app.log"
  rotation:
    enabled: true
    max_size_mb: 5
    max_age_days: 7
    max_backups: 20
    compress: true
    local_time: true

request_id_prefix: "app"
