server:
  host: "0.0.0.0"
  port: 8081
  tls_port: 8444
  grpc_port: 50051
  read_timeout: 5m
  write_timeout: 5m
  idle_timeout: 10m
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

db:
  dsn: "postgres://omcgo:omcgo123@172.19.1.73:5432/omcgo?sslmode=disable"
  # 连接池核定（#24）：与 prod 对齐，app PG 池 50→60。聚合预算见 prod yaml / migrations/README.md。
  max_conns: 60
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: true
  log_sql_slow_threshold: 500

tsdb:
  # KPI/时序库物理分离：指向独立时序库实例（测试主机 postgres-tsdb 宿主映射端口 5433，与主库 5432 物理分离）。
  dsn: "postgres://omcgo:omcgo123@172.19.1.73:5433/omcgo?sslmode=disable"
  # 连接池核定（#24）：与 prod 对齐，app TS 池 30→40。
  max_conns: 40
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: false
  log_sql_slow_threshold: 1000

dashboard:
  query_timeout: 3s
  statement_timeout: 2500ms
  max_concurrent: 4
  queue_timeout: 100ms
  fresh_cache_ttl: 4m30s
  stale_ttl: 15m

redis:
  addrs:
    - "172.19.1.73:6379"
  password: ""
  db: 0
  pool_size: 200

pm_redis:
  addrs:
    - "172.19.1.73:6381"
  password: ""
  db: 0
  pool_size: 200

# Durable parameter-sync data plane runtime tuning. The data plane is always active.
param_sync:
  manual_offline_mode: reject
  result_consumer_shard_count: 16
  result_consumer_queue_depth: 64
  result_consumer_pull_batch_size: 64
  result_consumer_pull_concurrency: 64
  result_consumer_ack_wait: 2m
  result_consumer_max_ack_pending: 512
  recovery_run_limit: 200
  recovery_task_limit_per_run: 200
  recovery_task_budget: 200

nats:
  url: "nats://172.19.1.73:4222"
  max_reconnect: -1
  reconnect_wait: 2s
  allow_stream_rebuild: true

minio:
  endpoint: "172.19.1.73:9000"
  # 浏览器 / 外部 SDK 可达的 MinIO 地址，用于签发下载预签名 URL（qa-614 #377）。
  # 【主流用法】部署后进「系统配置 → 存储」填写对外可达地址（热生效不需重启，
  # issue #548 订阅桥）。下面的 ${MINIO_PUBLIC_ENDPOINT} 仅作启动期兑底；
  # test 环境默认回退到 172.19.1.73:9000（该网段可直接路由访问）。
  public_endpoint: "${MINIO_PUBLIC_ENDPOINT:-172.19.1.73:9000}"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

conn_req:
  server_addr: "acs:7547"
  shared_secret: "dps"

jwt:
  secret: "change-me-in-production-minimum-32-characters!!"
  access_token_ttl: 30m
  refresh_token_ttl: 168h

# 登录类接口密码 RSA-OAEP 加密传输；私钥不存在时启动自动生成。
login_crypto:
  private_key_path: "configs/keys/login_rsa_private.pem"

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

northbound:
  push_targets: []

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

# Task 默认行为（T-0157 C1 引入），详见 config.dev.yaml 注释。
task:
  default_expires_in_seconds: 120
  sweep_interval_seconds: 10
  wake_concurrency: 256  # issue #12: wakeDevice 唤醒并发上界（防峰值 OOM）
  terminal_redis_ttl: 15m

provision:
  enabled: true
  auto_configure: false
  task_timeout: 15m
  gpv_response:
    provision_queue: "${GPV_PROVISION_QUEUE:-provision-gpv}"
    provision_concurrency: ${GPV_PROVISION_CONCURRENCY:-2}
    provision_queue_depth: ${GPV_PROVISION_QUEUE_DEPTH:-256}
    rpc_durable: "${GPV_RPC_DURABLE:-device-rpc-gpv}"
    rpc_start_sequence: ${GPV_RPC_START_SEQUENCE:-0}
    rpc_concurrency: ${GPV_RPC_CONCURRENCY:-2}
    rpc_queue_depth: ${GPV_RPC_QUEUE_DEPTH:-1000}
    ack_wait: "${GPV_ACK_WAIT:-30s}"
    max_deliver: ${GPV_MAX_DELIVER:-5}
    max_ack_pending: ${GPV_MAX_ACK_PENDING:-2000}
  model_upload:
    enabled: false
    upload_url: "http://acs:7547/smallcell/FileUploadService"
    upload_username: ""
    upload_password: ""
    auto_activate_model: false
    upload_timeout: 5m
  auto_discovery:
    enabled: false
    max_concurrent: 10
    gpn_timeout: 60s
    gpv_batch_size: 50
    gpv_timeout: 30s
    auto_activate_model: false
  auto_sync:
    enabled: false
    sync_on_bootstrap: true
    sync_on_firmware_change: true
    max_concurrent: 20
    gpv_batch_size: 100

datamodel_expiry:
  auto_max_idle_days: 15
  manual_max_idle_days: 60
  cleanup_cron: "0 3 * * *"

# 数据模型/字典启动期加载（与 dev/prod 一致）。
# 种子拆分后（部署 baseline 不再内置 dictloader 管理的字典数据），test 环境必须开
# auto_load_on_startup，否则启动后 param_models/indicators/alarm_definitions/mml_* 全空。
dict_loader:
  xml_base_dir: "data"
  auto_load_on_startup: true
  cache_version_poll_interval: 30s
  load_concurrency: 4
  param_model:
    directory: "param-mappings"
    standard_model_file: "standard-model.xml"
    param_model_files: []
    backup_retention_days: 30
    backup_cleanup_cron: "0 3 * * *"
  indicator:
    base_directory: "indicator-library"
    enb_subdir: "enb"
    gsm_file: "GSM.xml"
    gnb_file: "GNB.xml"
  alarm_definition:
    directory: "alarm-definitions"
  product:
    directory: "param-mappings"
    file: "products.xml"
  quick_settings:
    directory: "quicksettings"

batch_processor:
  enabled: false          # 测试环境默认关闭，走逐条处理便于调试
  workers: 2
  flush_interval: 5s
  max_batch_size: 50
  input_buffer: 500
  shutdown_timeout: 10s

# 通知中心（T-0152）：SMTP 邮件发送器 + Alertmanager 告警 webhook 入口
notification:
  smtp:
    enabled: false
    host: ""
    port: 25
    security_mode: "none"
    auth_enabled: false
    username: ""
    password: ""
    from: "omc-alert@example.com"
    timeout: 10s
  alert_webhook:
    token: ""
    recipients: []

metrics:
  port: 9091

tracer:
  enabled: true
  endpoint: "otelcol:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "/run/logs/app/app.log"
  rotation:
    enabled: true
    max_size_mb: 50
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "app"
