server:
  host: "0.0.0.0"
  port: 8081
  tls_port: 8444
  grpc_port: 50051
  read_timeout: 5m
  write_timeout: 5m
  idle_timeout: 10m
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

db:
  dsn: "postgres://omcgo:omcgo123@localhost:5432/omcgo?sslmode=disable"
  max_conns: 50
  min_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: true
  log_sql_slow_threshold: 500

tsdb:
  # KPI/时序库物理分离：本机裸跑时序库实例在 localhost:5433（postgres-tsdb 宿主映射）。
  dsn: "postgres://omcgo:omcgo123@localhost:5433/omcgo?sslmode=disable"
  max_conns: 30
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_interval: 30s
  log_sql: true
  log_sql_params: false
  log_sql_slow_threshold: 1000

dashboard:
  query_timeout: 60s
  statement_timeout: 55s
  max_concurrent: 4
  queue_timeout: 100ms
  fresh_cache_ttl: 4m30s
  stale_ttl: 15m

redis:
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 200

pm_redis:
  addrs:
    - "localhost:6381"
  password: ""
  db: 0
  pool_size: 200

# Durable parameter-sync data plane runtime tuning. The data plane is always active.
param_sync:
  manual_offline_mode: reject
  result_consumer_shard_count: 16
  result_consumer_queue_depth: 64
  result_consumer_pull_batch_size: 64
  result_consumer_pull_concurrency: 64
  result_consumer_ack_wait: 2m
  result_consumer_max_ack_pending: 512
  recovery_run_limit: 200
  recovery_task_limit_per_run: 200
  recovery_task_budget: 200

nats:
  url: "nats://localhost:4222"
  max_reconnect: -1
  reconnect_wait: 2s
  allow_stream_rebuild: true

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  use_ssl: false
  buckets:
    pm_files: "pm-files"
    mr_files: "mr-files"
    firmware: "firmware"
    config_backup: "config-backup"
    logs: "logs"
    reports: "reports"
    exchange: "omc-exchange"
    ui_assets: "ui-assets"

conn_req:
  server_addr: "localhost:7547"  # ACS external address for CPE UDP CR URL
  shared_secret: "dps"            # HMAC-SHA1 secret for CPE UDP CR signing

jwt:
  secret: "change-me-in-production-minimum-32-characters!!"
  access_token_ttl: 30m
  refresh_token_ttl: 168h

# 登录类接口密码 RSA-OAEP 加密传输；私钥不存在时启动自动生成。
login_crypto:
  private_key_path: "configs/keys/login_rsa_private.pem"

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

northbound:
  push_targets: []

ne_direct:
  enabled: false
  host: "0.0.0.0"
  port: 7549

provision:
  enabled: true
  auto_configure: false  # Path A 自动下发配置暂禁用（需参数路径映射层）
  task_timeout: 15m
  gpv_response:
    provision_queue: "${GPV_PROVISION_QUEUE:-provision-gpv}"
    provision_concurrency: ${GPV_PROVISION_CONCURRENCY:-2}
    provision_queue_depth: ${GPV_PROVISION_QUEUE_DEPTH:-256}
    rpc_durable: "${GPV_RPC_DURABLE:-device-rpc-gpv}"
    rpc_start_sequence: ${GPV_RPC_START_SEQUENCE:-0}
    rpc_concurrency: ${GPV_RPC_CONCURRENCY:-2}
    rpc_queue_depth: ${GPV_RPC_QUEUE_DEPTH:-1000}
    ack_wait: "${GPV_ACK_WAIT:-30s}"
    max_deliver: ${GPV_MAX_DELIVER:-5}
    max_ack_pending: ${GPV_MAX_ACK_PENDING:-2000}
  model_upload:
    enabled: true
    upload_url: "http://localhost:8080/smallcell/FileUploadService"
    upload_username: ""
    upload_password: ""
    auto_activate_model: true
    upload_timeout: 5m
  auto_sync:
    enabled: true
    sync_on_bootstrap: true
    sync_on_firmware_change: true
    max_concurrent: 20
    gpv_batch_size: 100

datamodel_expiry:
  auto_max_idle_days: 15    # 自动发现模板最大空闲天数
  manual_max_idle_days: 60  # 手动模板最大空闲天数
  cleanup_cron: "0 3 * * *" # 清理定时任务 cron 表达式

batch_processor:
  enabled: false          # 启用 Periodic Inform 批量处理（降低 DB 写入压力）
  workers: 2              # 工作协程数
  flush_interval: 10s     # 批量刷新间隔
  max_batch_size: 200     # 单次批量上限
  input_buffer: 2500      # 每个 worker 输入通道缓冲
  shutdown_timeout: 30s   # 优雅关闭超��

metrics:
  port: 9091

tracer:
  enabled: false
  endpoint: "localhost:4317"
  sample_rate: 1.0

log:
  level: "info"
  format: "json"
  output_paths:
    - "stdout"
    - "../run/logs/app/app.log"
  rotation:
    enabled: true
    max_size_mb: 50
    rotate_interval: 5m # 与 max_size_mb 为 OR：任一条件满足都切
    max_age_days: 7
    compress: true
    local_time: true
    keep_uncompressed: 10 # 最新 N 个 .log 不压缩供 tail/less 直读；其余 .log → .log.gz

request_id_prefix: "app"
