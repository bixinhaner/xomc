# 数据字典数据源白名单 — T-0182
# PRD: docs/project/prd/F06-data-dictionary-source.md §13 A.1
#
# 这是字典页面"数据源"下拉的唯一真实来源。
# 任何不在此清单的表 / 字段不会出现在 UI,后端 Resolve 时也会拒绝。
#
# 维护规则:
# - 添加新表 → 在此追加一项,加 PR 评审
# - 敏感表(用户密码 hash / API key / 审计日志 / login_logs / system_license) 绝不入此清单
# - 字段必须是原生类型(string / int / bool / time);v1 不支持 jsonb / array
# - 字段名必须与 PostgreSQL 实际列名一致;否则同步时 SQL 报错 column does not exist
#   (P5 真机抓 bug 修正 2026-05-31:原 yaml 直接照 PRD 起草,与实际 schema 错位了 6 个字段)

sources:
  - table: devices
    display_name: "设备"
    fields:
      - { column: serial_number,    display: "序列号",     type: string }
      - { column: product_class,    display: "产品类型",   type: string }
      - { column: oui,              display: "厂商 OUI",   type: string }
      - { column: manufacturer,     display: "厂商",       type: string }

  - table: products
    display_name: "产品"
    fields:
      - { column: product_name,     display: "产品名",     type: string }
      - { column: vendor,           display: "厂商",       type: string }
      - { column: tech,             display: "制式",       type: string }

  - table: param_models
    display_name: "参数模型"
    fields:
      - { column: name,             display: "模型名",     type: string }

  - table: topo_nodes
    display_name: "拓扑节点"
    fields:
      - { column: label,            display: "节点名",     type: string }
      - { column: node_type,        display: "节点类型",   type: string }

  - table: alarm_definitions
    display_name: "告警定义"
    fields:
      - { column: identifier,       display: "告警标识",   type: string }
      - { column: ne_type,          display: "网元类型",   type: string }
      - { column: event_type,       display: "事件类型",   type: string }

  # #241 新增产品「KPI指标名称」下拉源:KPI 平台(eNB)。
  # 平台名权威来源是公式表 rela_platform_indicator_formula_{enb|gsm|gnb}.platform_name
  # (perf_indicators_* 本身不存平台维度,见 internal/product/pg_repository.go:89-90)。
  # 与 product 下拉现有口径(FetchIndicatorPlatformsByDeviceType / ListIndicatorPlatforms)一致;
  # 本期仅 enb(与 ProductDrawer isENB 一致),gnb/gsm 留后续。
  - table: rela_platform_indicator_formula_enb
    display_name: "KPI 平台公式(eNB)"
    fields:
      - { column: platform_name,    display: "平台名",     type: string }

  - table: device_groups
    display_name: "设备组"
    fields:
      - { column: name,             display: "组名",       type: string }

  - table: sites
    display_name: "站点"
    fields:
      - { column: name,             display: "站点名",     type: string }
      - { column: address,          display: "地址",       type: string }

  - table: product_class_patterns
    display_name: "产品 productClass pattern"
    fields:
      - { column: product_class,    display: "productClass", type: string }

  - table: firmware_versions
    display_name: "固件版本"
    fields:
      - { column: version,          display: "版本号",     type: string }
      - { column: product_class,    display: "产品类型",   type: string }

  - table: kpi_definitions
    display_name: "KPI 定义"
    fields:
      - { column: name,             display: "KPI 名",     type: string }
      - { column: display_name,     display: "显示名",     type: string }
      - { column: category,         display: "分类",       type: string }

  - table: users
    display_name: "用户"
    fields:
      - { column: username,         display: "用户名",     type: string }
      - { column: display_name,     display: "显示名",     type: string }

  - table: roles
    display_name: "角色"
    fields:
      - { column: code,             display: "角色 code",  type: string }
      - { column: name,             display: "角色名",     type: string }
