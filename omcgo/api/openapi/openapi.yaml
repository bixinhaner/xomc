openapi: 3.0.3
info:
  title: OMC API
  description: Operations Management and Control for Base Stations
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and authorization
  - name: Devices
    description: Device management
  - name: DataModels
    description: TR-069 data model management
  - name: OUI
    description: OUI (Organizationally Unique Identifier) management
  - name: Templates
    description: Configuration template management
  - name: ConfigSync
    description: Device configuration synchronization
  - name: Provisioning
    description: Device provisioning task management
  - name: Groups
    description: Device group management
  - name: PMCounters
    description: Performance management counters
  - name: KPI
    description: Key Performance Indicators
  - name: KPIThresholds
    description: KPI threshold management
  - name: Alarms
    description: Alarm management
  - name: AlarmRules
    description: Alarm rule configuration
  - name: Dashboard
    description: Dashboard and overview
  - name: SystemLogs
    description: System and NE message logs
  - name: MR
    description: Measurement Report management
  - name: Software
    description: Firmware and software management
  - name: Upgrades
    description: Device upgrade management
  - name: Interop
    description: Interoperability testing
  - name: Northbound
    description: Northbound interface and data export
  - name: Admin
    description: Administration (users, roles, permissions, audit)

paths:
  # ===========================================================================
  # Health
  # ===========================================================================
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ===========================================================================
  # Auth
  # ===========================================================================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: User login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # Devices
  # ===========================================================================
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List devices
      operationId: listDevices
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/CarrierParam"
        - $ref: "#/components/parameters/TechnologyParam"
        - name: status
          in: query
          schema:
            type: string
        - name: oui
          in: query
          schema:
            type: string
        - name: sn
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated device list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Devices]
      summary: Create a device
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/devices/stats:
    get:
      tags: [Devices]
      summary: Get device statistics
      operationId: getDeviceStats
      responses:
        "200":
          description: Device statistics by carrier
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/devices/{id}:
    get:
      tags: [Devices]
      summary: Get device by ID
      operationId: getDevice
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Device details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Devices]
      summary: Update a device
      operationId: updateDevice
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Devices]
      summary: Delete a device
      operationId: deleteDevice
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "204":
          description: Device deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/{id}/parameters:
    get:
      tags: [Devices]
      summary: Get device parameters
      operationId: getDeviceParameters
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Device parameter list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/{id}/reboot:
    post:
      tags: [Devices]
      summary: Reboot a device
      operationId: rebootDevice
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "202":
          description: Reboot command accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # DataModels
  # ===========================================================================
  /api/v1/datamodels:
    get:
      tags: [DataModels]
      summary: List data models
      operationId: listDataModels
      parameters:
        - $ref: "#/components/parameters/CarrierParam"
        - $ref: "#/components/parameters/TechnologyParam"
        - name: oui
          in: query
          schema:
            type: string
        - name: product_class
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated data model list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DataModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [DataModels]
      summary: Create a data model
      operationId: createDataModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDataModelRequest"
      responses:
        "201":
          description: Data model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/datamodels/resolve:
    get:
      tags: [DataModels]
      summary: Resolve data model by OUI, product class, and carrier
      operationId: resolveDataModel
      parameters:
        - name: oui
          in: query
          schema:
            type: string
        - name: product_class
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/CarrierParam"
      responses:
        "200":
          description: Resolved data model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/datamodels/statistics:
    get:
      tags: [DataModels]
      summary: Get data model statistics
      operationId: getDataModelStatistics
      responses:
        "200":
          description: Data model statistics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/datamodels/import:
    post:
      tags: [DataModels]
      summary: Bulk import data models
      operationId: importDataModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/datamodels/cache/refresh:
    post:
      tags: [DataModels]
      summary: Refresh data model cache
      operationId: refreshDataModelCache
      responses:
        "200":
          description: Cache refreshed
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/datamodels/{id}:
    get:
      tags: [DataModels]
      summary: Get data model by ID
      operationId: getDataModel
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Data model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [DataModels]
      summary: Update a data model
      operationId: updateDataModel
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDataModelRequest"
      responses:
        "200":
          description: Data model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [DataModels]
      summary: Delete a data model
      operationId: deleteDataModel
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "204":
          description: Data model deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/datamodels/{id}/export:
    get:
      tags: [DataModels]
      summary: Export a data model
      operationId: exportDataModel
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Data model export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/datamodels/{id}/activate:
    post:
      tags: [DataModels]
      summary: Activate a data model
      operationId: activateDataModel
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Data model activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/datamodels/{id}/deprecate:
    post:
      tags: [DataModels]
      summary: Deprecate a data model
      operationId: deprecateDataModel
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Data model deprecated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # OUI
  # ===========================================================================
  /api/v1/oui:
    get:
      tags: [OUI]
      summary: List OUIs
      operationId: listOUIs
      responses:
        "200":
          description: OUI list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OUI"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [OUI]
      summary: Create an OUI
      operationId: createOUI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOUIRequest"
      responses:
        "201":
          description: OUI created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OUI"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # Templates
  # ===========================================================================
  /api/v1/config/templates:
    get:
      tags: [Templates]
      summary: List configuration templates
      operationId: listConfigTemplates
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated template list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ConfigTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Templates]
      summary: Create a configuration template
      operationId: createConfigTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigTemplateRequest"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/config/templates/{id}:
    get:
      tags: [Templates]
      summary: Get configuration template by ID
      operationId: getConfigTemplate
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Templates]
      summary: Update a configuration template
      operationId: updateConfigTemplate
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigTemplateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Templates]
      summary: Delete a configuration template
      operationId: deleteConfigTemplate
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "204":
          description: Template deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # ConfigSync
  # ===========================================================================
  /api/v1/config/sync/push/{deviceId}:
    post:
      tags: [ConfigSync]
      summary: Push configuration to a device
      operationId: pushConfig
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Configuration pushed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/config/sync/pull/{deviceId}:
    post:
      tags: [ConfigSync]
      summary: Pull configuration from a device
      operationId: pullConfig
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Configuration pulled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/config/sync/status/{deviceId}:
    get:
      tags: [ConfigSync]
      summary: Get configuration sync status for a device
      operationId: getConfigSyncStatus
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [synced, pending, out_of_sync, error]
                  last_sync_at:
                    type: string
                    format: date-time
                  error_message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Provisioning
  # ===========================================================================
  /api/v1/provisioning/tasks:
    get:
      tags: [Provisioning]
      summary: List provisioning tasks
      operationId: listProvisioningTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Paginated provisioning task list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProvisioningTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Provisioning]
      summary: Create a provisioning task
      operationId: createProvisioningTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProvisioningTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/provisioning/tasks/{id}:
    get:
      tags: [Provisioning]
      summary: Get provisioning task by ID
      operationId: getProvisioningTask
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/provisioning/tasks/{id}/retry:
    post:
      tags: [Provisioning]
      summary: Retry a provisioning task
      operationId: retryProvisioningTask
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Task retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Groups
  # ===========================================================================
  /api/v1/groups:
    get:
      tags: [Groups]
      summary: Get device group tree
      operationId: getGroupTree
      responses:
        "200":
          description: Group tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Groups]
      summary: Create a device group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      operationId: getGroup
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Groups]
      summary: Update a group
      operationId: updateGroup
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Groups]
      summary: Delete a group
      operationId: deleteGroup
      parameters:
        - $ref: "#/components/parameters/UUIDPathParam"
      responses:
        "204":
          description: Group deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups/{id}/members:
    post:
      tags: [Groups]
      summary: Add members to a group
