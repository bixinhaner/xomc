  # ===========================================================================
  # MML standard-model rebuild endpoints (T-0119 Sprint B)
  # ===========================================================================

  /api/v1/admin/dictload/reload:
    post:
      tags: [Admin, MML]
      summary: 热重载单个 dictload Loader（Sprint B-1）
      description: |
        触发指定 dictload Loader 重新加载，仅 superAdmin 可调用。
        `mml-standard` Loader 支持基于 sha256 的增量重载：内容未变化时
        毫秒级返回 `rows_affected:0`（F-3 增量重载）。
        其他可选 loader：`param-model` / `indicator` / `alarm-definition` /
        `product`。
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
            enum: [mml-standard, param-model, indicator, alarm-definition, product]
          description: 要重载的 Loader 名（dictloader.Registry 注册名）
      responses:
        "200":
          description: 重载完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  loader:
                    type: string
                    example: mml-standard
                  rows_affected:
                    type: integer
                    example: 3093
                  files_loaded:
                    type: integer
                    example: 1
                  files_skipped:
                    type: integer
                    example: 0
                  elapsed_ms:
                    type: integer
                    example: 464
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: string
        "400":
          description: name 参数缺失或不在白名单
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 仅 superAdmin 可调用

  /api/v1/admin/kpi-routes/refresh:
    post:
      tags: [Admin, KPI]
      summary: 人工刷新 KPI 路由缓存
      operationId: refreshKPIRoutes
      description: |
        仅 `super_admin` 可调用。先清理当前 app 进程的 KPI 路由 L1，再以
        有界后台上下文最多三次推进 Redis 全局 `cache_version`。
        无 Redis 时仅保证当前进程 L1 清理，响应 `scope=local` 且
        `multi_process_sync=false`。
      responses:
        "200":
          description: KPI 路由失效完成
          content:
            application/json:
              schema:
                type: object
                required: [ret, msg, data]
                properties:
                  ret:
                    type: integer
                    example: 1
                  msg:
                    type: string
                    example: ok
                  data:
                    type: object
                    required: [cache_version, attempts, scope, multi_process_sync]
                    properties:
                      cache_version:
                        type: integer
                        format: int64
                        example: 12
                      attempts:
                        type: integer
                        minimum: 0
                        maximum: 3
                        example: 1
                      scope:
                        type: string
                        enum: [global, local]
                      multi_process_sync:
                        type: boolean
                        example: true
        "401":
          description: 未提供或提供了无效的认证凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeErrorResponse"
        "403":
          description: 已认证，但不是 super_admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeErrorResponse"
        "503":
          description: 本进程 L1 已清理，但 Redis 全局版本推进最终失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeErrorResponse"

  /api/v1/mml/groups/{id}/execute:
    post:
      tags: [MML]
      summary: 按组批量执行 mml_param_groups 下的全部命令（Sprint B-5）
      description: |
        将指定 `mml_param_groups.id` 下的所有 mml_commands 一次性展开为一个
        mml_task。Fanouter + Sequencer 负责按 command_index 顺序串行下发到
        目标设备。`operation_filter` 可挑选执行子集（如仅 LST 或仅 MOD）。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: mml_param_groups.id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_sns]
              properties:
                device_sns:
                  type: array
                  items: { type: string }
                  example: ["BAICELLS-SN-001"]
                parameters:
                  type: object
                  additionalProperties: true
                  description: MOD/ADD 操作的入参（按 command 透传）
                task_name:
                  type: string
                operation_filter:
                  type: array
                  items:
                    type: string
                    enum: [LST, MOD, ADD, RMV]
                  description: 仅执行特定 operation_type 的命令；空则全部
                execute_type:
                  type: string
                  enum: [immediate, scheduled, periodic]
                  default: immediate
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: mml_task 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MMLTaskBrief"
        "400":
          description: device_sns 缺失 / group_id 无效 / operation_filter 过滤后无命令
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: group 不存在

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    UUIDPathParam:
      name: id
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSizeParam:
      name: page_size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    CarrierParam:
      name: carrier
      in: query
      description: Carrier / operator name
      schema:
        type: string

    TechnologyParam:
      name: technology
      in: query
      description: Radio access technology (e.g. 4G, 5G)
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized - missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # ---- Generic ----
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Human-readable error message
          example: "Invalid request parameters"
        details:
          type: string
          description: Additional error details
        request_id:
          type: string
          description: Request tracking ID

    EnvelopeErrorResponse:
      type: object
      description: 当前 Gin API 统一失败信封
      required: [ret, msg, data]
      properties:
        ret:
          type: integer
          enum: [0]
          example: 0
        msg:
          type: string
          description: 已脱敏、可供调用方处理的错误说明
          example: "super_admin role required"
        data:
          type: object
          nullable: true
          additionalProperties: true
          example: null
        biz_code:
          type: integer
          description: 可选业务错误码
        request_id:
          type: string
          description: 可选请求追踪 ID

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          description: Total number of records
          example: 150
        page:
          type: integer
          description: Current page number
          example: 1
        page_size:
          type: integer
          description: Number of items per page
          example: 20

    # ---- Auth ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: secret123

    TokenPair:
      type: object
