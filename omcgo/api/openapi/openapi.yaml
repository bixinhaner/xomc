          items:
            $ref: "#/components/schemas/Role"
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        email:
          type: string
          format: email
        display_name:
          type: string
        role_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, locked, disabled]

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        permission_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permission_ids:
          type: array
          items:
            type: string
            format: uuid

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        resource:
          type: string
        action:
          type: string
          enum: [read, write, delete, admin]
        description:
          type: string

    # MML rebuild schemas (T-0119)
    MMLTaskBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_name:
          type: string
        device_sns:
          type: array
          items: { type: string }
        commands:
          type: array
          description: |
            后端展开的命令明细。每个元素包含 command_code / rpc_method /
            operation_type / parameters；Sprint B-6 之后 orphan command 会
            额外标记 orphan:true。
          items:
            type: object
            properties:
              command_code: { type: string }
              rpc_method:
                type: string
                enum: [GetParameterValues, SetParameterValues, AddObject, DeleteObject, Reboot, FactoryReset, Download, Upload, GetRPCMethods]
              operation_type:
                type: string
                enum: [LST, MOD, ADD, RMV, DSP, ACT, DEA, RST, CLR, UPG]
              parameters:
                type: object
                additionalProperties: true
              orphan:
                type: boolean
                description: Sprint B-6：standard-model 重建后该 command_code 已不存在
        status:
          type: string
          enum: [pending, running, completed, failed, paused, cancelled]
        execute_type:
          type: string
        total_devices: { type: integer }
        success_count: { type: integer }
        failed_count:  { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
