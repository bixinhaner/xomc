version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/admin/"
    schema:
      - "migrations/000001_init_schema.sql"
    gen:
      go:
        package: "adminsqlc"
        out: "internal/admin/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "varchar"
            go_type: "string"
