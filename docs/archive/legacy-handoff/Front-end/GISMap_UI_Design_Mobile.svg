<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <!-- Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="popupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="onlineMarkerMobile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#73D13D"/>
      <stop offset="100%" style="stop-color:#52C41A"/>
    </linearGradient>
    <linearGradient id="clusterGradientMobile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#40A9FF"/>
      <stop offset="100%" style="stop-color:#1890FF"/>
    </linearGradient>
    <linearGradient id="alarmGradientMobile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7875"/>
      <stop offset="100%" style="stop-color:#F5222D"/>
    </linearGradient>
    <linearGradient id="mapBgMobile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#F1F8E9"/>
    </linearGradient>

    <!-- Patterns -->
    <pattern id="mapGridMobile" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E0E0E0" stroke-width="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="#F0F2F5"/>

  <!-- ==================== Title ==================== -->
  <g transform="translate(40, 30)">
    <text x="0" y="0" font-family="SF Pro Display, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#262626">GIS Map 移动端设计</text>
    <text x="0" y="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8C8C8C">Mobile View - 375px Width</text>
  </g>

  <!-- ==================== Phone Frame 1 - Main View ==================== -->
  <g transform="translate(40, 80)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="335" height="680" rx="28" fill="#1A1A1A"/>
    <rect x="3" y="3" width="329" height="674" rx="25" fill="#FFF"/>

    <!-- Status Bar -->
    <rect x="3" y="3" width="329" height="44" rx="25" fill="#FFF"/>
    <text x="167" y="32" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">9:41</text>
    <text x="30" y="32" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#262626">📶</text>
    <text x="280" y="32" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#262626">🔋</text>

    <!-- Navigation Bar -->
    <rect x="3" y="47" width="329" height="56" fill="#FFF"/>
    <text x="32" y="84" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#1890FF">☰</text>
    <text x="167" y="84" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#262626" text-anchor="middle">GIS 地图</text>
    <text x="290" y="84" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#1890FF">🔍</text>

    <!-- Node Search Box -->
    <g transform="translate(15, 111)">
      <rect x="0" y="0" width="200" height="36" rx="8" fill="#FFF" filter="url(#cardShadow)"/>
      <circle cx="18" cy="18" r="6" fill="none" stroke="#1890FF" stroke-width="1.5"/>
      <line x1="23" y1="23" x2="27" y2="27" stroke="#1890FF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="38" y="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#BFBFBF">搜索定位...</text>
      <rect x="170" y="8" width="18" height="18" rx="4" fill="#F5F5F5"/>
      <text x="179" y="21" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8C8C8C" text-anchor="middle">×</text>
    </g>

    <!-- Map Area -->
    <rect x="3" y="155" width="329" height="425" fill="url(#mapBgMobile)"/>
    <rect x="3" y="155" width="329" height="425" fill="url(#mapGridMobile)"/>

    <!-- Map Content -->
    <g opacity="0.5">
      <path d="M30 200 Q80 180 140 220 Q200 190 260 240 Q300 210 320 260 L320 500 Q250 480 180 520 Q100 500 30 530 Z"
            fill="#FFF" stroke="#D9D9D9" stroke-width="1"/>
      <text x="160" y="330" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#8C8C8C">Beijing</text>
      <text x="240" y="400" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#8C8C8C">Shanghai</text>
    </g>

    <!-- Cluster Marker -->
    <g transform="translate(160, 330)" filter="url(#softShadow)">
      <circle r="24" fill="url(#clusterGradientMobile)"/>
      <circle r="24" fill="none" stroke="#FFF" stroke-width="2"/>
      <text y="2" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">128</text>
    </g>

    <!-- Cluster Marker 2 -->
    <g transform="translate(250, 390)" filter="url(#softShadow)">
      <circle r="18" fill="url(#clusterGradientMobile)"/>
      <circle r="18" fill="none" stroke="#FFF" stroke-width="2"/>
      <text y="1" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">56</text>
    </g>

    <!-- Online Device with Alarm -->
    <g transform="translate(100, 300)" filter="url(#softShadow)">
      <circle r="10" fill="url(#onlineMarkerMobile)"/>
      <circle r="10" fill="none" stroke="#FFF" stroke-width="2"/>
      <circle cx="7" cy="-7" r="8" fill="url(#alarmGradientMobile)"/>
      <text x="7" y="-4" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFF" text-anchor="middle">5</text>
    </g>

    <!-- Online Device -->
    <g transform="translate(200, 320)" filter="url(#softShadow)">
      <circle r="10" fill="url(#onlineMarkerMobile)"/>
      <circle r="10" fill="none" stroke="#FFF" stroke-width="2"/>
    </g>

    <!-- Offline Device (实心红色圆点) -->
    <g transform="translate(80, 380)" filter="url(#softShadow)">
      <circle r="10" fill="#b60808"/>
      <circle r="10" fill="none" stroke="#FFF" stroke-width="2"/>
    </g>

    <!-- Hover Tooltip Panel -->
    <g transform="translate(60, 200)" filter="url(#popupShadow)">
      <rect x="0" y="0" width="200" height="130" rx="10" fill="#FFF"/>
      <rect x="0" y="0" width="200" height="130" rx="10" fill="none" stroke="#E8E8E8" stroke-width="1"/>
      <path d="M-6 45 L0 38 L0 52 Z" fill="#FFF"/>

      <!-- Header -->
      <rect x="0" y="0" width="200" height="36" rx="10" fill="#FAFAFA"/>
      <text x="12" y="24" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#262626">📍 Beijing Chaoyang Site</text>

      <!-- Status Row -->
      <g transform="translate(12, 52)">
        <circle cx="5" cy="0" r="5" fill="#52C41A"/>
        <text x="16" y="3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#52C41A">在线</text>
        <text x="40" y="3" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#D9D9D9">|</text>
        <text x="50" y="3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#595959">告警:</text>
        <circle cx="82" cy="0" r="8" fill="url(#alarmGradientMobile)"/>
        <text x="82" y="3" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
      </g>

      <line x1="12" y1="64" x2="188" y2="64" stroke="#F0F0F0" stroke-width="1"/>

      <!-- Details -->
      <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#8C8C8C">
        <text x="12" y="80">序列号:</text>
        <text x="52" y="80" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#262626">SN2024001</text>
        <text x="12" y="94">设备组:</text>
        <text x="52" y="94" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#262626">Chaoyang group</text>
        <text x="12" y="108">地址:</text>
        <text x="52" y="108" font-size="8" fill="#262626">北京市朝阳区建国路88号</text>
        <text x="12" y="122">坐标:</text>
        <text x="52" y="122" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#262626">116.46, 39.92</text>
      </g>

      <rect x="12" y="128" width="24" height="2" rx="1" fill="#1890FF"/>
    </g>

    <!-- Zoom Controls -->
    <g transform="translate(290, 170)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#FFF" filter="url(#softShadow)"/>
      <text x="18" y="24" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#262626" text-anchor="middle">+</text>
      <rect x="0" y="44" width="36" height="36" rx="8" fill="#FFF" filter="url(#softShadow)"/>
      <text x="18" y="68" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#262626" text-anchor="middle">−</text>
    </g>

    <!-- Stats Bar -->
    <rect x="3" y="580" width="329" height="97" fill="#FFF"/>
    <line x1="3" y1="580" x2="332" y2="580" stroke="#E8E8E8" stroke-width="1"/>
    <rect x="140" y="588" width="55" height="4" rx="2" fill="#D9D9D9"/>

    <g transform="translate(20, 608)">
      <text x="0" y="0" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#262626">设备统计</text>

      <g transform="translate(0, 20)">
        <text x="0" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#8C8C8C">总计</text>
        <text x="50" y="0" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#262626">10,000</text>
      </g>

      <g transform="translate(120, 20)">
        <circle cx="6" cy="-4" r="5" fill="#52C41A"/>
        <text x="20" y="0" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#52C41A">9,200</text>
      </g>

      <g transform="translate(200, 20)">
        <circle cx="6" cy="-4" r="5" fill="#b60808"/>
        <text x="20" y="0" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#8C8C8C">800</text>
      </g>
    </g>

    <!-- Home Indicator -->
    <rect x="100" y="664" width="135" height="4" rx="2" fill="#1A1A1A"/>
  </g>

  <!-- ==================== Phone Frame 2 - Filter Drawer ==================== -->
  <g transform="translate(420, 80)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="335" height="680" rx="28" fill="#1A1A1A"/>
    <rect x="3" y="3" width="329" height="674" rx="25" fill="#FFF"/>

    <!-- Status Bar -->
    <rect x="3" y="3" width="329" height="44" rx="25" fill="#FFF"/>
    <text x="167" y="32" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">9:41</text>

    <!-- Navigation Bar -->
    <rect x="3" y="47" width="329" height="56" fill="#FFF"/>
    <text x="167" y="84" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#262626" text-anchor="middle">GIS 地图</text>

    <!-- Dimmed Map Area -->
    <rect x="3" y="103" width="329" height="260" fill="#E8F5E9" opacity="0.5"/>
    <rect x="3" y="103" width="329" height="260" fill="rgba(0,0,0,0.25)"/>

    <!-- Filter Drawer -->
    <g transform="translate(0, 280)">
      <rect x="3" y="0" width="329" height="397" rx="0" fill="#FFF" filter="url(#cardShadow)"/>

      <!-- Drawer Handle -->
      <rect x="140" y="8" width="55" height="4" rx="2" fill="#D9D9D9"/>

      <!-- Header -->
      <text x="24" y="48" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#262626">筛选</text>
      <text x="295" y="48" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#1890FF">重置</text>

      <!-- Device Group Section -->
      <text x="24" y="84" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#8C8C8C">设备组</text>

      <!-- China group (Selected - Expanded [-], 无文件夹图标) -->
      <g transform="translate(24, 100)">
        <rect x="0" y="0" width="287" height="44" fill="#E6F7FF" rx="6"/>
        <rect x="8" y="14" width="16" height="16" rx="3" fill="#1890FF"/>
        <path d="M13 22 L17 26 L23 18" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- [-] 展开状态图标 -->
        <rect x="32" y="14" width="14" height="14" rx="2" fill="none" stroke="#1890FF" stroke-width="1.5"/>
        <line x1="35" y1="21" x2="43" y2="21" stroke="#1890FF" stroke-width="1.5" stroke-linecap="round"/>
        <text x="56" y="28" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#262626">China group</text>
      </g>

      <!-- Beijing group (Selected - Expanded [-], 无文件夹图标) -->
      <g transform="translate(24, 148)">
        <rect x="16" y="0" width="271" height="40" fill="#F0F7FF" rx="4"/>
        <rect x="24" y="12" width="14" height="14" rx="2" fill="#1890FF"/>
        <path d="M29 19 L32 22 L37 16" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- [-] 展开状态图标 -->
        <rect x="44" y="32" width="14" height="14" rx="2" fill="none" stroke="#1890FF" stroke-width="1.5"/>
        <line x1="47" y1="39" x2="55" y2="39" stroke="#1890FF" stroke-width="1.5" stroke-linecap="round"/>
        <text x="68" y="24" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#262626">Beijing group</text>
      </g>

      <!-- Chaoyang group (Selected - Collapsed [+], 无文件夹图标) -->
      <g transform="translate(24, 192)">
        <rect x="32" y="0" width="255" height="36" fill="#F0F7FF" rx="4"/>
        <rect x="40" y="11" width="14" height="14" rx="2" fill="#1890FF"/>
        <path d="M45 18 L48 21 L53 15" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- [+] 收起状态图标 -->
        <rect x="60" y="11" width="12" height="12" rx="2" fill="none" stroke="#BFBFBF" stroke-width="1"/>
        <line x1="66" y1="14" x2="66" y2="20" stroke="#BFBFBF" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="63" y1="17" x2="69" y2="17" stroke="#BFBFBF" stroke-width="1.5" stroke-linecap="round"/>
        <text x="80" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#1890FF">Chaoyang group</text>
      </g>

      <!-- Haidian group (Not Selected, 叶子节点, 无图标, 无文件夹) -->
      <g transform="translate(24, 232)">
        <rect x="32" y="0" width="255" height="36" fill="transparent" rx="4"/>
        <rect x="40" y="11" width="14" height="14" rx="2" fill="#FFF" stroke="#D9D9D9" stroke-width="1"/>
        <!-- 叶子节点：无展开/收起图标，无文件夹图标 -->
        <text x="60" y="22" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#595959">Haidian group</text>
      </g>

      <!-- Shanghai group (Selected - Collapsed [+], 无文件夹图标) -->
      <g transform="translate(24, 272)">
        <rect x="16" y="0" width="271" height="40" fill="#F0F7FF" rx="4"/>
        <rect x="24" y="13" width="14" height="14" rx="2" fill="#1890FF"/>
        <path d="M29 20 L32 23 L37 17" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- [+] 收起状态图标 -->
        <rect x="44" y="13" width="14" height="14" rx="2" fill="none" stroke="#BFBFBF" stroke-width="1.5"/>
        <line x1="51" y1="16" x2="51" y2="24" stroke="#BFBFBF" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="47" y1="20" x2="55" y2="20" stroke="#BFBFBF" stroke-width="1.5" stroke-linecap="round"/>
        <text x="68" y="24" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#262626">Shanghai group</text>
      </g>

      <!-- Multi-select Summary -->
      <g transform="translate(24, 320)">
        <rect x="0" y="0" width="287" height="32" rx="6" fill="#E6F7FF"/>
        <text x="12" y="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1890FF">已选择 4 个设备组</text>
      </g>

      <!-- Divider -->
      <line x1="24" y1="368" x2="307" y2="368" stroke="#F0F0F0" stroke-width="1"/>

      <!-- Status Filter -->
      <text x="24" y="396" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="500" fill="#8C8C8C">设备状态</text>

      <g transform="translate(24, 412)">
        <!-- Online -->
        <rect x="0" y="0" width="130" height="36" rx="6" fill="#F6FFED" stroke="#B7EB8F" stroke-width="1"/>
        <rect x="12" y="10" width="16" height="16" rx="3" fill="#1890FF"/>
        <path d="M17 18 L20 21 L25 15" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="44" cy="18" r="5" fill="#52C41A"/>
        <text x="58" y="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#262626">在线</text>

        <!-- Offline (实心灰色圆点) -->
        <rect x="145" y="0" width="130" height="36" rx="6" fill="#F5F5F5" stroke="#D9D9D9" stroke-width="1"/>
        <rect x="157" y="10" width="16" height="16" rx="3" fill="#1890FF"/>
        <path d="M162 18 L165 21 L170 15" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="189" cy="18" r="5" fill="#b60808"/>
        <text x="203" y="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#262626">离线</text>
      </g>

      <!-- Confirm Button -->
      <rect x="24" y="456" width="287" height="44" rx="8" fill="#1890FF"/>
      <text x="167" y="484" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#FFF" text-anchor="middle">确认筛选</text>
    </g>

    <!-- Home Indicator -->
    <rect x="100" y="664" width="135" height="4" rx="2" fill="#1A1A1A"/>
  </g>

  <!-- ==================== Notes ==================== -->
  <g transform="translate(40, 780)">
    <rect x="0" y="0" width="720" height="100" rx="8" fill="#FFF" filter="url(#cardShadow)"/>
    <text x="20" y="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#262626">移动端适配说明</text>

    <g transform="translate(20, 48)">
      <circle cx="6" cy="0" r="3" fill="#1890FF"/>
      <text x="20" y="4" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#595959">设备标记尺寸增大至 20px (radius: 10px)，便于触摸操作</text>
    </g>
    <g transform="translate(20, 68)">
      <circle cx="6" cy="0" r="3" fill="#1890FF"/>
      <text x="20" y="4" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#595959">底部抽屉式面板，上滑展开筛选选项，下滑收起</text>
    </g>
    <g transform="translate(380, 48)">
      <circle cx="6" cy="0" r="3" fill="#1890FF"/>
      <text x="20" y="4" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#595959">悬浮提示面板自动定位，不超出屏幕边界</text>
    </g>
    <g transform="translate(380, 68)">
      <circle cx="6" cy="0" r="3" fill="#1890FF"/>
      <text x="20" y="4" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#595959">设备组树纯目录结构，支持多选</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="900" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#BFBFBF" text-anchor="middle">OMC GIS Map - Mobile Design v1.5</text>

</svg>